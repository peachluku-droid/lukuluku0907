<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

/* ─── THEMES ─────────────────────────────────── */
:root, body.theme-light {
  --peach: #E8835A; --peach-light: #FEF0E9; --peach-mid: #F2A882;
  --peach-dark: #B85B30; --peach-darker: #7A3A1A;
  --gold: #C9A84C; --gold-light: #FDF6E3;
  --bg: #FDF6F2; --bg2: #ffffff;
  --card: #ffffff; --text: #2C1A0E; --text-muted: #9A7A6A;
  --border: rgba(232,131,90,0.18); --border-hover: #F2A882;
}
body.theme-dark {
  --peach: #F2A882; --peach-light: #2A1A0E; --peach-mid: #C87050;
  --peach-dark: #F2C0A0; --peach-darker: #FFE0CC;
  --gold: #D4B86A; --gold-light: #1A1500;
  --bg: #1a1a1a; --bg2: #242424;
  --card: #242424; --text: #F0D8C8; --text-muted: #A08070;
  --border: rgba(242,168,130,0.15); --border-hover: #C87050;
}
body.theme-sepia {
  --peach: #8B5E3C; --peach-light: #F0E8D8; --peach-mid: #A67C52;
  --peach-dark: #6B3E1C; --peach-darker: #4B2E0C;
  --gold: #8B7040; --gold-light: #F5EDD8;
  --bg: #f5f0e8; --bg2: #faf7f0;
  --card: #faf7f0; --text: #3d2b1f; --text-muted: #9a8070;
  --border: rgba(139,94,60,0.18); --border-hover: #A67C52;
}
body.theme-blue {
  --peach: #2a5bbf; --peach-light: #dce8fc; --peach-mid: #4a7de0;
  --peach-dark: #1a3b8f; --peach-darker: #0a1b4f;
  --gold: #2a7bbf; --gold-light: #e0eeff;
  --bg: #e8f0fe; --bg2: #f4f7ff;
  --card: #f4f7ff; --text: #1a2a4a; --text-muted: #7a9ac0;
  --border: rgba(42,91,191,0.18); --border-hover: #4a7de0;
}
body.theme-pink {
  --peach: #d4537e; --peach-light: #ffe6f2; --peach-mid: #e876a0;
  --peach-dark: #993556; --peach-darker: #721a3e;
  --gold: #d46080; --gold-light: #fff0f8;
  --bg: #fff0f6; --bg2: #fff8fb;
  --card: #fff8fb; --text: #2c1a22; --text-muted: #c09aaa;
  --border: rgba(212,83,126,0.18); --border-hover: #e876a0;
}
body.theme-purple {
  --peach: #6a3bbf; --peach-light: #e8dcfc; --peach-mid: #8a5de0;
  --peach-dark: #4a1b8f; --peach-darker: #2a0b5f;
  --gold: #7a4bd0; --gold-light: #f2eeff;
  --bg: #f0ebff; --bg2: #f9f6ff;
  --card: #f9f6ff; --text: #2a1a4a; --text-muted: #9a7ac0;
  --border: rgba(106,59,191,0.18); --border-hover: #8a5de0;
}
body.theme-gray {
  --peach: #555555; --peach-light: #e8e8e8; --peach-mid: #777777;
  --peach-dark: #333333; --peach-darker: #111111;
  --gold: #666666; --gold-light: #f0f0f0;
  --bg: #f0f0f0; --bg2: #fafafa;
  --card: #fafafa; --text: #222222; --text-muted: #888888;
  --border: rgba(85,85,85,0.18); --border-hover: #777777;
}


body.theme-warm {
  --peach: #f26522; --peach-light: #fff3e0; --peach-mid: #f8863a;
  --peach-dark: #c04a00; --peach-darker: #8a3000;
  --gold: #e8821a; --gold-light: #fff8e0;
  --bg: #faf5ee; --bg2: #fff9f2;
  --card: #fff9f2; --text: #2c1f0e; --text-muted: #a08050;
  --border: rgba(242,101,34,0.18); --border-hover: #f8863a;
}

body.theme-greenpastel {
  --peach: #4caf82; --peach-light: #e8f8f0; --peach-mid: #6dcba0;
  --peach-dark: #2e7d5a; --peach-darker: #1a5040;
  --gold: #52b06e; --gold-light: #f0faf4;
  --bg: #f0faf5; --bg2: #f8fdfb;
  --card: #f8fdfb; --text: #1a3028; --text-muted: #6a9a82;
  --border: rgba(76,175,130,0.18); --border-hover: #6dcba0;
}

html, body {
  overflow-x: hidden;
  max-width: 100%;
}
body {
  font-family: 'Nunito', sans-serif;
  background: var(--bg);
  color: var(--text);
  transition: background .3s, color .3s;
}

/* ─── TOPBAR ────────────────────────────────── */
.topbar {
  background: var(--bg2);
  border-bottom: 1px solid var(--border);
  padding: 0 2rem;
  display: flex; align-items: center;
  justify-content: space-between; height: 56px;
  position: sticky; top: 0; z-index: 100;
  transition: background .3s;
}
.logo { display: flex; align-items: center; gap: 8px; text-decoration: none; }
.logo img { width: 36px; height: 36px; object-fit: contain; border-radius: 50%; }
.logo-text { font-family: 'Nunito', sans-serif; font-size: 18px; font-weight: 800; color: var(--peach); }


.nav-center { display: flex; gap: 2px; align-items: center; }
.nav-center a {
  font-size: 13px; font-weight: 700; padding: 7px 14px;
  border-radius: 8px; color: var(--text-muted); text-decoration: none;
  transition: all .15s; display: flex; align-items: center; gap: 5px;
  position: relative;
}
.nav-center a:hover { color: var(--peach); }
.nav-center a.active { color: var(--peach); font-weight: 800; }
.nav-center a.active::after {
  content: ''; position: absolute; bottom: 2px; left: 50%; transform: translateX(-50%);
  width: 20px; height: 2px; background: var(--peach); border-radius: 2px;
}
.nav-center a svg { width: 15px; height: 15px; stroke: currentColor; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; flex-shrink: 0; }

.nav-right { display: flex; gap: 6px; align-items: center; }

/* Icon buttons ngay nav */
.icon-btn {
  background: none; border: none; cursor: pointer;
  width: 34px; height: 34px; border-radius: 8px;
  display: flex; align-items: center; justify-content: center;
  color: var(--text-muted); transition: all .15s;
}
.icon-btn:hover { background: var(--peach-light); color: var(--peach); }
.icon-btn svg { width: 17px; height: 17px; stroke: currentColor; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }

/* ─── MOBILE TOPBAR FIX ─────────────────────── */
@media (max-width: 600px) {
  .topbar { padding: 0 0.6rem; }
  .logo-text { font-size: 15px; }
  .nav-center { gap: 0; }
  .nav-center a { padding: 5px 7px; font-size: 0; gap: 0; }
  .nav-center a svg { width: 18px; height: 18px; }
  .nav-right { gap: 3px; }
  .icon-btn, .theme-btn { width: 30px; height: 30px; }
  .user-nav-btn { width: 30px !important; height: 30px !important; }
  .profile-menu-btn { width: 30px !important; height: 30px !important; }
}

/* Avatar button */
.user-nav-btn {
  display: flex !important; align-items: center; justify-content: center;
  width: 34px !important; height: 34px !important;
  border-radius: 50% !important; overflow: hidden;
  background: var(--peach-light); color: var(--peach-dark);
  font-weight: 800; font-size: 14px; text-decoration: none;
  border: 2px solid var(--border-hover) !important;
  transition: all .15s; flex-shrink: 0; padding: 0 !important;
}
.user-nav-btn:hover { border-color: var(--peach) !important; }
.user-nav-btn img { width: 100%; height: 100%; object-fit: cover; display: block; border-radius: 50%; }

/* Fix profile-menu-btn avatar display */
.profile-menu-btn.has-avatar {
  border-radius: 50% !important;
  overflow: hidden;
  padding: 0 !important;
  border: 2px solid var(--border-hover) !important;
  background: var(--peach-light);
}
.profile-menu-btn.has-avatar:hover { border-color: var(--peach) !important; }
.profile-menu-btn.has-avatar img { width: 100%; height: 100%; object-fit: cover; display: block; border-radius: 50%; }
.profile-menu-btn svg { pointer-events: none; }

/* ─── THEME TOGGLE BTN ──────────────────────── */
.theme-btn {
  background: none; border: none;
  border-radius: 8px; width: 34px; height: 34px;
  cursor: pointer; display: flex; align-items: center; justify-content: center;
  transition: all .15s; flex-shrink: 0; color: var(--text-muted);
}
.theme-btn:hover { background: var(--peach-light); color: var(--peach); }
.theme-btn svg { width: 17px; height: 17px; stroke: currentColor; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }

/* ─── THEME DRAWER ─────────────────────────── */
.theme-drawer {
  position: fixed; top: 60px; right: 1rem; z-index: 200;
  background: var(--bg2); border: 1px solid var(--border);
  border-radius: 16px; padding: 14px 16px; width: 220px;
  box-shadow: 0 8px 28px rgba(0,0,0,0.12);
  display: none;
}
.theme-drawer.open { display: block; }
.theme-drawer-title { font-size: 12px; font-weight: 800; color: var(--text-muted); margin-bottom: 10px; text-transform: uppercase; letter-spacing: .5px; }
.theme-swatches { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
.swatch { width: 38px; height: 38px; border-radius: 50%; border: 3px solid transparent; cursor: pointer; transition: all .15s; }
.swatch.active { border-color: var(--peach); box-shadow: 0 0 0 2px var(--bg2), 0 0 0 4px var(--peach); }
.swatch:hover { transform: scale(1.12); }
.swatch-label { font-size: 10px; text-align: center; color: var(--text-muted); margin-top: 3px; font-weight: 700; }

/* ─── THÔNG BÁO BANNER ──────────────────────── */
.notice-banner {
  background: var(--bg2);
  border: 1.5px solid var(--border-hover);
  border-radius: 6px;
  margin: 10px 2rem;
  padding: 7px 12px 7px 14px;
  display: flex; align-items: center; gap: 10px;
  overflow: hidden;
  max-width: calc(100% - 4rem - 2px);
}
.notice-badge {
  background: var(--peach);
  color: white;
  font-size: 11px; font-weight: 800;
  padding: 3px 10px; border-radius: 20px;
  white-space: nowrap; flex-shrink: 0;
  display: flex; align-items: center; gap: 5px;
  letter-spacing: 0.4px;
}
.notice-badge svg { width: 13px; height: 13px; stroke: white; fill: none; stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; flex-shrink: 0; }
.notice-scroll-wrap { overflow: hidden; flex: 1; }
.notice-scroll-text {
  display: inline-block; white-space: nowrap;
  animation: scroll-left 12s linear infinite;
  font-size: 13px; font-weight: 600; color: var(--text-muted);
  padding-left: 100%;
}
.notice-banner:hover .notice-scroll-text { animation-play-state: paused; }
@keyframes scroll-left {
  0%   { transform: translateX(0); }
  100% { transform: translateX(-100%); }
}
.notice-close {
  background: none; border: none; cursor: pointer;
  color: var(--text-muted); flex-shrink: 0; padding: 2px;
  display: flex; align-items: center; justify-content: center;
  border-radius: 6px; transition: all .15s;
}
.notice-close:hover { background: var(--peach-light); color: var(--peach); }
.notice-close svg { width: 14px; height: 14px; stroke: currentColor; fill: none; stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; }

/* ─── HERO ──────────────────────────────────── */
.hero {
  background: linear-gradient(135deg, var(--peach-light) 0%, var(--gold-light) 100%);
  padding: 2rem 2rem 1.6rem;
  display: flex; align-items: center; gap: 1.5rem;
  transition: background .3s;
}
.hero-logo { flex-shrink: 0; }
.hero-logo img { width: 120px; height: 120px; object-fit: contain; filter: drop-shadow(0 4px 14px rgba(232,131,90,0.25)); }
.hero-body { flex: 1; display: flex; flex-direction: column; align-items: center; text-align: center; }
.hero-body h1 { font-size: 17px; font-weight: 800; color: var(--peach); margin-bottom: 0; line-height: 1.5; }

/* ─── SEARCH BAR (dưới hero) ─── */
.inline-search { position: relative; width: 100%; max-width: 520px; }
.inline-search-icon { position: absolute; left: 14px; top: 50%; transform: translateY(-50%); pointer-events: none; color: var(--text-muted); display: flex; align-items: center; }
.inline-search-icon svg { width: 15px; height: 15px; stroke: currentColor; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
.inline-search-input { width: 100%; padding: 12px 46px 12px 40px; border: 1.5px solid var(--border-hover); border-radius: 28px; background: var(--bg2); color: var(--text); font-family: 'Nunito', sans-serif; font-size: 13px; font-weight: 600; outline: none; transition: border .15s, box-shadow .15s; }
.inline-search-input:focus { border-color: var(--peach); box-shadow: 0 0 0 3px rgba(232,131,90,0.12); }
.inline-search-input::placeholder { color: var(--text-muted); font-weight: 400; }
.inline-search-btn { position: absolute; right: 5px; top: 50%; transform: translateY(-50%); background: var(--peach); border: none; border-radius: 50%; width: 34px; height: 34px; cursor: pointer; display: flex; align-items: center; justify-content: center; transition: background .15s; }
.inline-search-btn:hover { background: var(--peach-dark); }
.inline-search-btn svg { stroke: white; fill: none; stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; width: 14px; height: 14px; }

/* ─── SECTION COMMON ──────────────────────── */
.section { padding: 1.1rem 2rem; }
.sec-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
.sec-title { font-size: 14px; font-weight: 800; display: flex; align-items: center; gap: 6px; color: var(--text); }
.sec-title svg { width: 16px; height: 16px; stroke: currentColor; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; color: var(--peach); }
.see-all { font-size: 12px; color: var(--peach); background: none; border: none; cursor: pointer; font-family: 'Nunito', sans-serif; font-weight: 700; display: flex; align-items: center; gap: 3px; }
.see-all:hover { text-decoration: underline; }
.see-all svg { width: 13px; height: 13px; stroke: currentColor; fill: none; stroke-width: 2.2; }

/* ─── ĐỌC GẦN ĐÂY BOX ─── */
.empty-box { background: linear-gradient(135deg, var(--peach-light), var(--gold-light)); border-radius: 16px; padding: 1.3rem 1.5rem; text-align: center; }
.empty-box p { font-size: 14px; font-weight: 700; color: var(--text); margin-bottom: 4px; }
.empty-box span { font-size: 12px; color: var(--text-muted); }

/* ─── PHẦN GỘP: ĐIỆN THOẠI, BIỂN CẢ VÀ GẬY ── */
/* TOP RANK GRID (2 cột dạng card ngang) */
.top-rank-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 16px; }
@media (max-width: 600px) { .top-rank-grid { grid-template-columns: 1fr; } }
.top-rank-card {
  background: var(--card); border: 1px solid var(--border);
  border-radius: 14px; padding: 10px 12px;
  display: flex; gap: 10px; align-items: center;
  cursor: pointer; transition: all .15s; text-decoration: none; color: var(--text);
}
.top-rank-card:hover { border-color: var(--peach-mid); transform: translateY(-1px); box-shadow: 0 4px 16px rgba(0,0,0,0.07); }
.rank-badge {
  width: 28px; height: 28px; border-radius: 10px;
  display: flex; align-items: center; justify-content: center;
  font-size: 12px; font-weight: 900; flex-shrink: 0;
}
.rank-hidden { display: none; }
.rank-1 { background: #FDF6E3; color: #B85B30; }
.rank-2 { background: var(--peach-light); color: var(--text-muted); }
.rank-3 { background: var(--peach-light); color: var(--peach-dark); }
.rank-n { background: var(--border); color: var(--text-muted); }
.rank-cover-wrap { width: 40px; height: 56px; border-radius: 6px; overflow: hidden; flex-shrink: 0; background: var(--peach-light); }
.rank-cover-wrap img { width: 100%; height: 100%; object-fit: cover; }
.rank-info { flex: 1; min-width: 0; }
.rank-title { font-size: 12px; font-weight: 700; line-height: 1.4; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; margin-bottom: 3px; }
.rank-author { font-size: 11px; color: var(--text-muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; display: flex; align-items: center; gap: 3px; }
.rank-author svg { width: 11px; height: 11px; stroke: currentColor; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; flex-shrink: 0; }
.rank-views { font-size: 11px; color: var(--peach); font-weight: 700; display: flex; align-items: center; gap: 3px; margin-top: 2px; }
.rank-views svg { width: 11px; height: 11px; stroke: currentColor; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; flex-shrink: 0; }

/* DIVIDER mỏng trong section */
.sec-divider { height: 1px; background: var(--border); margin: 0 0 14px; }
.sec-sub-title { font-size: 13px; font-weight: 800; margin-bottom: 12px; display: flex; align-items: center; gap: 5px; color: var(--text); }
.sec-sub-title svg { width: 14px; height: 14px; stroke: currentColor; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; color: var(--peach); }

/* TRUYỆN GRID (5 cột card dọc kiểu wattpad) */
.story-col-grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 12px; }
@media (max-width: 700px) { .story-col-grid { grid-template-columns: repeat(3, 1fr); gap: 8px; } }
@media (max-width: 400px) { .story-col-grid { grid-template-columns: repeat(2, 1fr); gap: 8px; } }

/* TRUYỆN MỚI CẬP NHẬT (dạng card dọc, 6 cột laptop, 2 cột mobile) */
.new-update-grid { display: grid; grid-template-columns: repeat(6, 1fr); gap: 12px; }
@media (max-width: 1100px) { .new-update-grid { grid-template-columns: repeat(4, 1fr); } }
@media (max-width: 700px) { .new-update-grid { grid-template-columns: repeat(2, 1fr); gap: 8px; } }
.new-update-card {
  background: var(--card); border: 1px solid var(--border); border-radius: 14px;
  cursor: pointer; transition: all .2s; overflow: hidden;
  text-decoration: none; color: var(--text); display: block;
}
.new-update-card:hover { transform: translateY(-3px); box-shadow: 0 8px 24px rgba(0,0,0,0.09); border-color: var(--peach-mid); }
.new-update-card:hover .new-update-cover-wrap { box-shadow: none; }
.new-update-cover-wrap { position: relative; width: 100%; padding-top: 140%; overflow: hidden; background: linear-gradient(145deg, var(--peach-light), var(--gold-light)); border-radius: 14px 14px 0 0; }
.new-update-cover-wrap img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; display: block; }
.new-update-ch-badge { position: absolute; top: 6px; left: 6px; background: var(--peach); color: white; font-size: 9px; font-weight: 800; padding: 2px 7px; border-radius: 10px; }
.status-badge { position: absolute; top: 6px; right: 6px; font-size: 9px; font-weight: 800; padding: 2px 7px; border-radius: 10px; color: white; }
.status-full { background: #4caf50; }
.status-on { background: #e876a0; }
.new-update-info { padding: 8px 10px 10px; flex: 1; display: flex; flex-direction: column; gap: 3px; }
.new-update-title { font-size: 12px; font-weight: 800; line-height: 1.35; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; color: var(--text); }
.new-update-tags { display: flex; flex-wrap: wrap; gap: 2px; margin-top: 2px; }
.new-update-tag { font-size: 9px; font-weight: 700; padding: 1px 5px; border-radius: 8px; background: var(--peach-light); color: var(--peach-dark); border: 1px solid var(--border-hover); text-decoration: none; cursor: pointer; transition: background .15s; }
.new-update-tag:hover { background: var(--peach); color: #fff; border-color: var(--peach); }

.story-card {
  background: var(--card); border: 1px solid var(--border); border-radius: 12px;
  overflow: hidden; cursor: pointer; transition: all .2s;
  text-decoration: none; color: var(--text); display: flex; flex-direction: column;
}
.story-card:hover { border-color: var(--peach-mid); transform: translateY(-3px); box-shadow: 0 8px 24px rgba(0,0,0,0.09); }
.story-cover-wrap { position: relative; width: 100%; padding-top: 140%; overflow:
