body.theme-dark {

  --border: rgba(242,168,130,0.15); --border-hover: #C87050;
  --shadow: rgba(0,0,0,0.3);
  --green: #6fcf97; --green-light: #0d2016;
}
body.theme-sepia {
  --peach: #8B5E3C; --peach-light: #F0E8D8; --peach-mid: #A67C52;
  --peach-dark: #6B3E1C; --peach-darker: #4B2E0C;
  --gold: #8B7040; --gold-light: #F5EDD8;
  --bg: #f5f0e8; --bg2: #faf7f0; --card: #faf7f0;
  --text: #3d2b1f; --text-muted: #9a8070;
  --border: rgba(139,94,60,0.18); --border-hover: #A67C52;
  --shadow: rgba(139,94,60,0.08);
  --green: #5a8a60; --green-light: #edf7ee;
}
body.theme-blue {
  --peach: #2a5bbf; --peach-light: #dce8fc; --peach-mid: #4a7de0;
  --peach-dark: #1a3b8f; --peach-darker: #0a1b4f;
  --gold: #2a7bbf; --gold-light: #e0eeff;
  --bg: #e8f0fe; --bg2: #f4f7ff; --card: #f4f7ff;
  --text: #1a2a4a; --text-muted: #7a9ac0;
  --border: rgba(42,91,191,0.18); --border-hover: #4a7de0;
  --shadow: rgba(42,91,191,0.08);
  --green: #2a9bbf; --green-light: #e0f7ff;
}
body.theme-pink {
  --peach: #d4537e; --peach-light: #ffe6f2; --peach-mid: #e876a0;
  --peach-dark: #993556; --peach-darker: #721a3e;
  --gold: #d46080; --gold-light: #fff0f8;
  --bg: #fff0f6; --bg2: #fff8fb; --card: #fff8fb;
  --text: #2c1a22; --text-muted: #c09aaa;
  --border: rgba(212,83,126,0.18); --border-hover: #e876a0;
  --shadow: rgba(212,83,126,0.08);
  --green: #c054a0; --green-light: #fff0fb;
}
body.theme-purple {
  --peach: #6a3bbf; --peach-light: #e8dcfc; --peach-mid: #8a5de0;
  --peach-dark: #4a1b8f; --peach-darker: #2a0b5f;
  --gold: #7a4bd0; --gold-light: #f2eeff;
  --bg: #f0ebff; --bg2: #f9f6ff; --card: #f9f6ff;
  --text: #2a1a4a; --text-muted: #9a7ac0;
  --border: rgba(106,59,191,0.18); --border-hover: #8a5de0;
  --shadow: rgba(106,59,191,0.08);
  --green: #5a3bbf; --green-light: #ede8ff;
}
body.theme-gray {
  --peach: #555555; --peach-light: #e8e8e8; --peach-mid: #777777;
  --peach-dark: #333333; --peach-darker: #111111;
  --gold: #666666; --gold-light: #f0f0f0;
  --bg: #f0f0f0; --bg2: #fafafa; --card: #fafafa;
  --text: #222222; --text-muted: #888888;
  --border: rgba(85,85,85,0.18); --border-hover: #777777;
  --shadow: rgba(85,85,85,0.08);
  --green: #4a7a4a; --green-light: #eef5ee;
}
body.theme-wattpad {
  --peach: #f26522; --peach-light: #fff3e0; --peach-mid: #f8863a;
  --peach-dark: #c04a00; --peach-darker: #8a3000;
  --gold: #e8821a; --gold-light: #fff8e0;
  --bg: #faf5ee; --bg2: #fff9f2; --card: #fff9f2;
  --text: #2c1f0e; --text-muted: #a08050;
  --border: rgba(242,101,34,0.18); --border-hover: #f8863a;
  --shadow: rgba(242,101,34,0.08);
  --green: #4caf7d; --green-light: #f0fff6;
}

body {
  font-family: 'Nunito', sans-serif;
  background: var(--bg); color: var(--text);
  transition: background .3s, color .3s;
  line-height: 1.6;
  max-width: 680px; margin: 0 auto;
  min-height: 100vh;
}

/* ─── TOPBAR ──────────────────────────────────── */
.topbar {
  background: var(--bg2); border-bottom: 1px solid var(--border);
  padding: 0 1rem; display: flex; align-items: center;
  justify-content: space-between; height: 56px;
  position: sticky; top: 0; z-index: 100; transition: background .3s;
}
.topbar-left { display: flex; align-items: center; gap: 8px; }
.back-btn {
  background: none; border: none; cursor: pointer;
  color: var(--text); padding: 7px; border-radius: 50%;
  display: flex; align-items: center; transition: background .15s;
}
.back-btn:hover { background: var(--peach-light); }
.back-btn svg { width: 20px; height: 20px; stroke: currentColor; fill: none; stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; }
.logo { display: flex; align-items: center; gap: 6px; text-decoration: none; }
.logo-text { font-family: 'Pacifico', cursive; font-size: 18px; color: var(--peach); }
.topbar-right { display: flex; align-items: center; gap: 2px; }
.icon-btn {
  background: none; border: none; cursor: pointer;
  color: var(--text); padding: 8px; border-radius: 50%;
  display: flex; align-items: center; transition: background .15s;
}
.icon-btn:hover { background: var(--peach-light); }
.icon-btn svg { width: 19px; height: 19px; stroke: currentColor; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }

/* theme drawer */
.theme-drawer {
  position: fixed; top: 58px; right: .75rem; z-index: 300;
  background: var(--bg2); border: 1px solid var(--border);
  border-radius: 16px; padding: 12px 14px; width: 210px;
  box-shadow: 0 8px 28px rgba(0,0,0,0.12); display: none;
}
.theme-drawer.open { display: block; }
.theme-drawer-title { font-size: 11px; font-weight: 800; color: var(--text-muted); margin-bottom: 9px; text-transform: uppercase; letter-spacing: .5px; }
.theme-swatches { display: grid; grid-template-columns: repeat(4,1fr); gap: 7px; }
.swatch { width: 36px; height: 36px; border-radius: 50%; border: 3px solid transparent; cursor: pointer; transition: all .15s; }
.swatch.active { border-color: var(--peach); box-shadow: 0 0 0 2px var(--bg2), 0 0 0 4px var(--peach); }
.swatch:hover { transform: scale(1.12); }
.swatch-label { font-size: 9px; text-align: center; color: var(--text-muted); margin-top: 3px; font-weight: 700; }

/* ─── COVER HERO ─────────────────────────────── */
.cover-hero {
  position: relative; width: 100%;
  background: var(--peach-light);
  display: flex; justify-content: center;
  padding: 2rem 1.5rem 2.5rem; overflow: hidden;
}
.cover-hero-blur {
  position: absolute; inset: 0;
  filter: blur(22px) saturate(1.4); opacity: 0.32;
  background-size: cover; background-position: center; transform: scale(1.1);
}
.cover-book {
  position: relative; width: 154px; height: 230px;
  border-radius: 10px; overflow: hidden;
  box-shadow: 0 12px 40px rgba(0,0,0,0.28);
  background: var(--peach-light);
  display: flex; align-items: center; justify-content: center; flex-shrink: 0;
}
.cover-book img { width: 100%; height: 100%; object-fit: cover; }
.cover-book-ph { display: flex; align-items: center; justify-content: center; width: 100%; height: 100%; }
.cover-book-ph svg { width: 52px; height: 52px; stroke: var(--peach-mid); fill: none; stroke-width: 1.3; stroke-linecap: round; stroke-linejoin: round; }

/* ─── STORY BODY ─────────────────────────────── */
.story-body { background: var(--bg2); padding: 1.2rem 1.2rem 0; }

.story-title-main { font-size: 20px; font-weight: 800; color: var(--text); line-height: 1.3; margin-bottom: 0.7rem; }

.author-row { display: flex; align-items: center; gap: 10px; margin-bottom: 1rem; }
.author-avatar {
  width: 34px; height: 34px; border-radius: 50%;
  background: var(--peach-light); display: flex; align-items: center; justify-content: center;
  flex-shrink: 0; overflow: hidden; border: 2px solid var(--border);
}
.author-avatar svg { width: 16px; height: 16px; stroke: var(--peach-mid); fill: none; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
.author-avatar img { width: 100%; height: 100%; object-fit: cover; }
.author-name { font-size: 14px; font-weight: 700; }

/* stats */
.stats-row {
  display: flex; gap: 0; margin-bottom: 1.2rem;
  border-top: 1px solid var(--border); border-bottom: 1px solid var(--border);
  padding: .7rem 0;
}
.stat-block { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 2px; position: relative; }
.stat-block + .stat-block::before { content: ''; position: absolute; left: 0; top: 10%; bottom: 10%; width: 1px; background: var(--border); }
.stat-icon { color: var(--text-muted); display: flex; align-items: center; margin-bottom: 1px; }
.stat-icon svg { width: 15px; height: 15px; stroke: currentColor; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
.stat-val { font-size: 15px; font-weight: 800; color: var(--text); }
.stat-label { font-size: 10.5px; color: var(--text-muted); font-weight: 600; }

/* action buttons */
.action-row { display: flex; gap: 8px; margin-bottom: 1.2rem; }
.btn-read {
  flex: 1; background: var(--text); color: var(--bg2); border: none;
  border-radius: 28px; padding: 13px 16px;
  font-size: 14px; font-weight: 700; cursor: pointer;
  display: flex; align-items: center; justify-content: center; gap: 7px;
  transition: opacity .2s, transform .1s; text-decoration: none; font-family: 'Nunito', sans-serif;
}
.btn-read svg { width: 16px; height: 16px; stroke: currentColor; fill: none; stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; }
.btn-read:hover { opacity: .82; }
.btn-read:active { transform: scale(.97); }

.btn-secondary-action {
  background: var(--bg2); color: var(--text);
  border: 1.5px solid var(--border-hover); border-radius: 28px; padding: 13px 14px;
  font-size: 13px; font-weight: 700; cursor: pointer;
  display: flex; align-items: center; justify-content: center; gap: 6px;
  transition: background .15s, transform .1s; font-family: 'Nunito', sans-serif;
  white-space: nowrap;
}
.btn-secondary-action svg { width: 16px; height: 16px; stroke: currentColor; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; flex-shrink: 0; }
.btn-secondary-action:hover { background: var(--peach-light); }
.btn-secondary-action.active { background: var(--peach-light); color: var(--peach-dark); border-color: var(--peach-mid); }
.btn-secondary-action.active svg { stroke: var(--peach); }
.btn-secondary-action:active { transform: scale(.97); }

/* tags */
.tags-row { display: flex; flex-wrap: wrap; gap: 7px; margin-bottom: 1.2rem; align-items: center; }
.status-chip {
  padding: 5px 13px; border-radius: 20px; font-size: 11.5px; font-weight: 800;
  display: flex; align-items: center; gap: 5px;
}
.status-chip svg { width: 11px; height: 11px; stroke: currentColor; fill: none; stroke-width: 2.5; stroke-linecap: round; stroke-linejoin: round; }
.status-chip.done { background: var(--green-light); color: var(--green); }
.status-chip.ongoing { background: var(--gold-light); color: var(--gold); }
.genre-tag {
  padding: 5px 13px; background: var(--peach-light); color: var(--peach-dark);
  border-radius: 20px; font-size: 11.5px; font-weight: 700; cursor: pointer;
  text-decoration: none; transition: background .12s;
}
.genre-tag:hover { background: var(--peach-mid); color: white; }

/* description */
.description-box {
  background: var(--bg); border: 1px solid var(--border);
  border-radius: 14px; padding: .9rem 1rem; margin-bottom: 1.4rem;
}
.description-label {
  font-size: 10.5px; font-weight: 800; color: var(--text-muted);
  text-transform: uppercase; letter-spacing: .8px; margin-bottom: 5px;
}
.description-text { font-size: 13.5px; line-height: 1.78; color: var(--text); white-space: pre-wrap; }
.description-text.clamped {
  display: -webkit-box; -webkit-line-clamp: 4; -webkit-box-orient: vertical; overflow: hidden;
}
.read-more-btn {
  background: none; border: none; cursor: pointer;
  color: var(--peach); font-size: 12.5px; font-weight: 700;
  padding: 4px 0; margin-top: 5px; font-family: 'Nunito', sans-serif;
  display: flex; align-items: center; gap: 4px;
}
.read-more-btn svg { width: 12px; height: 12px; stroke: currentColor; fill: none; stroke-width: 2.5; stroke-linecap: round; stroke-linejoin: round; transition: transform .15s; }
.read-more-btn.expanded svg { transform: rotate(180deg); }

/* ─── TAB BAR ────────────────────────────────── */
.content-tabs {
  display: flex; gap: 0; border-bottom: 2px solid var(--border);
  background: var(--bg2); position: sticky; top: 56px; z-index: 90; transition: background .3s;
}
.tab-btn {
  flex: 1; background: none; border: none;
  padding: 12px 0; font-size: 13px; font-weight: 700;
  color: var(--text-muted); cursor: pointer; position: relative;
  transition: color .15s; font-family: 'Nunito', sans-serif;
  display: flex; align-items: center; justify-content: center; gap: 5px;
}
.tab-btn svg { width: 14px; height: 14px; stroke: currentColor; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; flex-shrink: 0; }
.tab-btn:hover { color: var(--peach); }
.tab-btn.active { color: var(--peach); }
.tab-btn.active::after {
  content: ''; position: absolute; bottom: -2px; left: 15%; right: 15%;
  height: 2.5px; background: var(--peach); border-radius: 2px;
}
.tab-count {
  font-size: 10px; font-weight: 800; background: var(--peach-light); color: var(--peach-dark);
  padding: 1px 5px; border-radius: 8px; min-width: 16px; text-align: center;
}
.tab-btn.active .tab-count { background: var(--peach); color: white; }

.tab-content { display: none; }
.tab-content.active { display: block; }

/* ─── CHAPTER LIST ─────────────────────────── */
.chapter-controls {
  display: flex; justify-content: space-between; align-items: center;
  padding: .9rem 1.2rem .7rem; flex-wrap: wrap; gap: .6rem;
  background: var(--bg2);
}
.chapter-count-label {
  font-size: 13.5px; font-weight: 800; color: var(--text);
  display: flex; align-items: center; gap: 6px;
}
.chapter-count-label svg { width: 15px; height: 15px; stroke: currentColor; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; color: var(--text-muted); }
.sort-btn {
  padding: 5px 12px; background: var(--bg); border: 1.5px solid var(--border);
  border-radius: 16px; font-size: 12px; font-weight: 700; color: var(--text);
  cursor: pointer; transition: all .15s; font-family: 'Nunito', sans-serif;
  display: flex; align-items: center; gap: 5px;
}
.sort-btn svg { width: 12px; height: 12px; stroke: currentColor; fill: none; stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; transition: transform .2s; }
.sort-btn:hover { background: var(--peach-light); border-color: var(--border-hover); }

.chapter-search-bar {
  display: flex; align-items: center; gap: 8px;
  background: var(--bg); border: 1.5px solid var(--border);
  border-radius: 22px; padding: 7px 15px;
  margin: 0 1.2rem .7rem; transition: border-color .15s;
}
.chapter-search-bar:focus-within { border-color: var(--peach); }
.chapter-search-bar svg { width: 14px; height: 14px; stroke: var(--text-muted); fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; flex-shrink: 0; }
.chapter-search-bar input {
  border: none; background: none; outline: none;
  font-size: 13px; color: var(--text); flex: 1; font-family: 'Nunito', sans-serif;
}
.chapter-search-bar input::placeholder { color: var(--text-muted); }

.chapter-list { padding: 0 1.2rem 1.5rem; display: flex; flex-direction: column; }

.chapter-item {
  display: flex; align-items: center; gap: 12px;
  padding: 12px 4px; border-bottom: 1px solid var(--border);
  text-decoration: none; color: var(--text); transition: all .12s;
  border-radius: 0;
}
.chapter-item:last-child { border-bottom: none; }
.chapter-item:hover {
  background: var(--peach-light); margin: 0 -8px; padding-left: 12px; padding-right: 12px;
  border-radius: 10px; border-bottom-color: transparent;
}
.chapter-num-badge {
  width: 28px; height: 28px; border-radius: 8px; flex-shrink: 0;
  background: var(--peach-light); color: var(--peach-dark);
  display: flex; align-items: center; justify-content: center;
  font-size: 11px; font-weight: 800;
}
.chapter-item.read .chapter-num-badge { background: var(--green-light); color: var(--green); }
.chapter-info { flex: 1; min-width: 0; }
.chapter-name { font-weight: 700; font-size: 13.5px; margin-bottom: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.chapter-item.read .chapter-name { color: var(--text-muted); }
.chapter-meta { font-size: 11px; color: var(--text-muted); display: flex; align-items: center; gap: 8px; }
.chapter-meta svg { width: 10px; height: 10px; stroke: currentColor; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
.chapter-arrow { color: var(--text-muted); flex-shrink: 0; }
.chapter-arrow svg { width: 14px; height: 14px; stroke: currentColor; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }

/* skeleton for chapters */
.skel-ch { display: flex; gap: 12px; padding: 12px 4px; align-items: center; border-bottom: 1px solid var(--border); }
.skel { animation: shimmer 1.4s infinite; background: linear-gradient(90deg, var(--border) 25%, var(--peach-light) 50%, var(--border) 75%); background-size: 200% 100%; border-radius: 6px; }
.skel-sq { width: 28px; height: 28px; border-radius: 8px; flex-shrink: 0; }
.skel-lines { flex: 1; display: flex; flex-direction: column; gap: 6px; }
.skel-line { height: 11px; }
.skel-line.w70 { width: 70%; }
.skel-line.w40 { width: 40%; }
@keyframes shimmer { 0%{background-position:200% 0} 100%{background-position:-200% 0} }

/* ─── COMMENT TAB ────────────────────────────── */
.comment-section { padding: 1rem 1.2rem 2rem; }

.comment-compose {
  display: flex; gap: 10px; margin-bottom: 1.4rem;
  background: var(--bg); border: 1.5px solid var(--border);
  border-radius: 16px; padding: 12px 14px;
  transition: border-color .15s;
}
.comment-compose:focus-within { border-color: var(--peach); }
.compose-avatar {

}
.compose-avatar svg { width: 14px; height: 14px; stroke: var(--peach-mid); fill: none; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
.compose-body { flex: 1; min-width: 0; }
.compose-input {

}

.compose-footer { display: flex; align-items: center; justify-content: flex-end; margin-top: 8px; }
.compose-submit {

  font-family: 'Nunito', sans-serif; font-size: 12.5px; font-weight: 700;
