.user-nav-btn, #nav-user-btn {
  width: 34px; height: 34px; border-radius: 50%; overflow: hidden;
  display: flex; align-items: center; justify-content: center;

  text-decoration: none; flex-shrink: 0; padding: 0;
  background: none; border: none; cursor: pointer;
}

  width: 34px; height: 34px; border-radius: 50%; object-fit: cover; display: block;
}

body {
  font-family: 'Nunito', sans-serif; background: var(--bg); color: var(--text);
  transition: background .3s, color .3s; line-height: 1.6;
  margin: 0; min-height: 100vh;
  font-size: 18px;
}
.page-wrapper {
  max-width: 720px; margin: 0 auto; min-height: 100vh;
  background: var(--bg2);
}

  .page-wrapper { max-width: 860px; }
  .cover-book { width: 200px; height: 300px; }

}
@media (min-width: 1200px) {
  .page-wrapper { max-width: 1000px; }
  .cover-book { width: 220px; height: 330px; }
}
.topbar {
  background: var(--bg2); border-bottom: 1px solid var(--border);
  padding: 0 1rem; display: flex; align-items: center;
  justify-content: space-between; height: 56px;
  position: sticky; top: 0; z-index: 100; transition: background .3s;
}
.topbar-left { display: flex; align-items: center; gap: 8px; }
.back-btn { background: none; border: none; cursor: pointer; color: var(--text); padding: 7px; border-radius: 50%; display: flex; align-items: center; transition: background .15s; }
.back-btn:hover { background: var(--peach-light); }
.back-btn svg { width: 20px; height: 20px; stroke: currentColor; fill: none; stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; }
.logo { display: flex; align-items: center; gap: 6px; text-decoration: none; }
.logo-text { font-family: 'Nunito', sans-serif; font-size: 18px; font-weight: 800; color: var(--peach); }
.topbar-right { display: flex; align-items: center; gap: 2px; }
.icon-btn { background: none; border: none; cursor: pointer; color: var(--text); padding: 8px; border-radius: 50%; display: flex; align-items: center; transition: background .15s; }
.icon-btn:hover { background: var(--peach-light); }
.icon-btn svg { width: 19px; height: 19px; stroke: currentColor; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
.theme-drawer { position: fixed; top: 58px; right: .75rem; z-index: 300; background: var(--bg2); border: 1px solid var(--border); border-radius: 16px; padding: 12px 14px; width: 210px; box-shadow: 0 8px 28px rgba(0,0,0,0.12); display: none; }
.theme-drawer.open { display: block; }
.theme-drawer-title { font-size: 13px; font-weight: 800; color: var(--text-muted); margin-bottom: 9px; text-transform: uppercase; letter-spacing: .5px; }
.theme-swatches { display: grid; grid-template-columns: repeat(4,1fr); gap: 7px; }
.swatch { width: 36px; height: 36px; border-radius: 50%; border: 3px solid transparent; cursor: pointer; transition: all .15s; }
.swatch.active { border-color: var(--peach); box-shadow: 0 0 0 2px var(--bg2), 0 0 0 4px var(--peach); }
.swatch:hover { transform: scale(1.12); }
.swatch-label { font-size: 11px; text-align: center; color: var(--text-muted); margin-top: 3px; font-weight: 700; }
.swatch-locked { position: relative; cursor: not-allowed; opacity: 0.6; display: flex; align-items: center; justify-content: center; }
.swatch-locked:hover { transform: scale(1.05); opacity: 0.75; }
.swatch-lock-icon { width: 16px; height: 16px; flex-shrink: 0; }
.cover-hero { position: relative; width: 100%; background: var(--peach-light); display: flex; justify-content: center; padding: 2rem 1.5rem 2.5rem; overflow: hidden; }
.cover-hero-blur { position: absolute; inset: 0; filter: blur(22px) saturate(1.4); opacity: 0.32; background-size: cover; background-position: center; transform: scale(1.1); }
.cover-book { position: relative; width: 154px; height: 230px; border-radius: 10px; overflow: hidden; box-shadow: 0 12px 40px rgba(0,0,0,0.28); background: var(--peach-light); display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
.cover-book img { width: 100%; height: 100%; object-fit: cover; }
.cover-book-ph { display: flex; align-items: center; justify-content: center; width: 100%; height: 100%; }
.cover-book-ph svg { width: 52px; height: 52px; stroke: var(--peach-mid); fill: none; stroke-width: 1.3; stroke-linecap: round; stroke-linejoin: round; }
.story-body { background: var(--bg2); padding: 1.2rem 0 0; margin-bottom: 0; }
.story-detail-container { width: min(100%, 760px); margin: 0 auto; padding-inline: 16px; box-sizing: border-box; }
.story-card { width: 100%; max-width: 100%; margin: 0; box-sizing: border-box; }
.story-title-main { font-size: 22px; font-weight: 800; color: var(--text); line-height: 1.3; margin-bottom: 0.7rem; text-align: center; }
.author-row { display: flex; align-items: center; justify-content: center; gap: 10px; margin-bottom: 1rem; cursor: pointer; }
.author-avatar { width: 34px; height: 34px; border-radius: 50%; background: var(--peach-light); display: flex; align-items: center; justify-content: center; flex-shrink: 0; overflow: hidden; border: 2px solid var(--border); }
.author-avatar svg { width: 16px; height: 16px; stroke: var(--peach-mid); fill: none; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
.author-avatar img { width: 100%; height: 100%; object-fit: cover; }
.author-name { font-size: 16px; font-weight: 700; }
.author-row:hover .author-name { color: var(--peach); text-decoration: underline; }
.stats-row { display: flex; gap: 0; margin-bottom: 1.2rem; border-top: 1px solid var(--border); border-bottom: 1px solid var(--border); padding: .7rem 0; }
.stat-block { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 2px; position: relative; }
.stat-block + .stat-block::before { content: ''; position: absolute; left: 0; top: 10%; bottom: 10%; width: 1px; background: var(--border); }
.stat-icon { color: var(--text-muted); display: flex; align-items: center; margin-bottom: 1px; }
.stat-icon svg { width: 16px; height: 16px; stroke: currentColor; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
.stat-val { font-size: 17px; font-weight: 800; color: var(--text); }
.stat-label { font-size: 12.5px; color: var(--text-muted); font-weight: 600; }
.action-row { display: flex; gap: 8px; margin-bottom: 1.2rem; }
.btn-read { flex: 1; background: var(--text); color: var(--bg2); border: none; border-radius: 28px; padding: 13px 16px; font-size: 16px; font-weight: 700; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 7px; transition: opacity .2s, transform .1s; text-decoration: none; font-family: 'Nunito', sans-serif; }
.btn-read svg { width: 16px; height: 16px; stroke: currentColor; fill: none; stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; }
.btn-read:hover { opacity: .82; }
.btn-read:active { transform: scale(.97); }
.btn-secondary-action { background: var(--bg2); color: var(--text); border: 1.5px solid var(--border-hover); border-radius: 28px; padding: 13px 14px; font-size: 15px; font-weight: 700; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 6px; transition: background .15s, transform .1s; font-family: 'Nunito', sans-serif; white-space: nowrap; }
.btn-secondary-action svg { width: 16px; height: 16px; stroke: currentColor; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; flex-shrink: 0; }
.btn-secondary-action:hover { background: var(--peach-light); }
.btn-secondary-action.active { background: var(--peach-light); color: var(--peach-dark); border-color: var(--peach-mid); }
.btn-secondary-action.active svg { stroke: var(--peach); fill: var(--peach); }
#follow-btn.active svg { stroke: var(--peach); fill: var(--peach); }
#bookmark-btn.active svg { stroke: var(--peach); fill: var(--peach); }
.btn-secondary-action:active { transform: scale(.97); }
.tags-row { display: flex; flex-wrap: wrap; gap: 7px; margin-bottom: 1.2rem; align-items: center; }
.status-chip { padding: 5px 13px; border-radius: 20px; font-size: 13.5px; font-weight: 800; display: flex; align-items: center; gap: 5px; }
.status-chip svg { width: 12px; height: 12px; stroke: currentColor; fill: none; stroke-width: 2.5; stroke-linecap: round; stroke-linejoin: round; }
.status-chip.done { background: var(--green-light); color: var(--green); }
.status-chip.ongoing { background: var(--gold-light); color: var(--gold); }
.genre-tag { padding: 5px 13px; background: var(--peach-light); color: var(--peach-dark); border-radius: 20px; font-size: 13.5px; font-weight: 700; cursor: pointer; text-decoration: none; transition: background .12s; }
.genre-tag:hover { background: var(--peach-mid); color: white; }
.description-box { background: var(--bg); border: 1px solid var(--border); border-radius: 14px; padding: .9rem 1rem; margin-bottom: 1.4rem; }
.description-label { font-size: 12.5px; font-weight: 800; color: var(--text-muted); text-transform: uppercase; letter-spacing: .8px; margin-bottom: 5px; }
.description-text { font-size: 15.5px; line-height: 1.45; color: var(--text); }
.description-text.clamped { display: -webkit-box; -webkit-line-clamp: 4; -webkit-box-orient: vertical; overflow: hidden; }
.description-text * { font-family: inherit !important; font-size: inherit !important; color: inherit !important; background: transparent !important; }
.description-text p, .description-text div { margin-bottom: 0.2em; line-height: 1.45; }
.description-text b, .description-text strong { font-weight: 700; }
.description-text i, .description-text em { font-style: italic; }
.read-more-btn { background: none; border: none; cursor: pointer; color: var(--peach); font-size: 14.5px; font-weight: 700; padding: 4px 0; margin-top: 5px; font-family: 'Nunito', sans-serif; display: flex; align-items: center; gap: 4px; }
.read-more-btn svg { width: 13px; height: 13px; stroke: currentColor; fill: none; stroke-width: 2.5; stroke-linecap: round; stroke-linejoin: round; transition: transform .15s; }
.read-more-btn.expanded svg { transform: rotate(180deg); }
.content-tabs { display: flex; gap: 0; border-bottom: 2px solid var(--border); background: var(--bg2); position: sticky; top: 56px; z-index: 90; transition: background .3s; padding: 0; }
.tab-btn { flex: 1; background: none; border: none; padding: 12px 0; font-size: 15px; font-weight: 700; color: var(--text-muted); cursor: pointer; position: relative; transition: color .15s; font-family: 'Nunito', sans-serif; display: flex; align-items: center; justify-content: center; gap: 5px; }
.tab-btn svg { width: 15px; height: 15px; stroke: currentColor; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; flex-shrink: 0; }
.tab-btn:hover { color: var(--peach); }
.tab-btn.active { color: var(--peach); }
.tab-btn.active::after { content: ''; position: absolute; bottom: -2px; left: 15%; right: 15%; height: 2.5px; background: var(--peach); border-radius: 2px; }
.tab-count { font-size: 12px; font-weight: 800; background: var(--peach-light); color: var(--peach-dark); padding: 1px 5px; border-radius: 8px; min-width: 18px; text-align: center; }
.tab-btn.active .tab-count { background: var(--peach); color: white; }

.tab-content { display: none; }
.tab-content.active { display: block; }
#tab-chapters { margin: 12px 0 1.4rem; border-radius: 14px; border: 1px solid var(--border); overflow: hidden; background: var(--bg); }
#tab-comments { margin: 12px 0 1.4rem; border-radius: 14px; border: 1px solid var(--border); overflow: hidden; background: var(--bg); }
#tab-info { margin: 12px 0 1.4rem; border-radius: 14px; border: 1px solid var(--border); background: var(--bg); }

.tab-frame { margin: 12px 0 1.4rem; border-radius: 14px; border: 1px solid var(--border); overflow: hidden; position: relative; background: var(--bg); }
.tab-deco-top, .tab-deco-bot { display: none; }
.comment-card { margin: 8px 10px; border-radius: 14px !important; border: 1px solid var(--peach-mid) !important; border-bottom: 1px solid var(--peach-mid) !important; }
.comment-card:last-child { margin-bottom: 8px; }
.chapter-controls { display: flex; justify-content: space-between; align-items: center; padding: .9rem 1.2rem .7rem; flex-wrap: wrap; gap: .6rem; background: var(--bg); }
.chapter-count-label { font-size: 15.5px; font-weight: 800; color: var(--text); display: flex; align-items: center; gap: 6px; }
.chapter-count-label svg { width: 16px; height: 16px; stroke: currentColor; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; color: var(--text-muted); }
.sort-btn { padding: 5px 12px; background: var(--bg); border: 1.5px solid var(--border); border-radius: 16px; font-size: 14px; font-weight: 700; color: var(--text); cursor: pointer; transition: all .15s; font-family: 'Nunito', sans-serif; display: flex; align-items: center; gap: 5px; }
.sort-btn svg { width: 13px; height: 13px; stroke: currentColor; fill: none; stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; transition: transform .2s; }
.sort-btn:hover { background: var(--peach-light); border-color: var(--border-hover); }
.chapter-search-bar { display: flex; align-items: center; gap: 8px; background: var(--bg2); border: 1.5px solid var(--border); border-radius: 22px; padding: 7px 15px; margin: 0 0 .7rem; transition: border-color .15s; }
.chapter-search-bar:focus-within { border-color: var(--peach); }
.chapter-search-bar svg { width: 15px; height: 15px; stroke: var(--text-muted); fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; flex-shrink: 0; }
.chapter-search-bar input { border: none; background: none; outline: none; font-size: 15px; color: var(--text); flex: 1; font-family: 'Nunito', sans-serif; }
.chapter-search-bar input::placeholder { color: var(--text-muted); }
.chapter-list { padding: 0 1.2rem 1rem; display: flex; flex-direction: column; }
.chapter-item { display: flex; align-items: center; gap: 10px; padding: 11px 4px; border-bottom: 1px solid var(--border); text-decoration: none; color: var(--text); transition: all .12s; border-radius: 0; min-height: 48px; }
.chapter-item:last-child { border-bottom: none; }
.chapter-item:hover { background: var(--peach-light); margin: 0 -8px; padding-left: 12px; padding-right: 12px; border-radius: 10px; border-bottom-color: transparent; }

  width: 28px; height: 28px; border-radius: 6px; flex-shrink: 0;
  background: var(--peach-light); color: var(--peach-dark);
  display: flex; align-items: center; justify-content: center;
  font-size: 11px; font-weight: 800; line-height: 1;
  align-self: center;
}
.chapter-item.read .chapter-num-badge { background: var(--green-light); color: var(--green); }
.chapter-info { flex: 1; min-width: 0; display: flex; flex-direction: row; align-items: center; gap: 8px; }
.chapter-name { font-weight: 700; font-size: 15.5px; margin-bottom: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; line-height: 1.2; flex: 1; min-width: 0; }
.chapter-item.read .chapter-name { color: var(--text-muted); }

function setTheme(name, el) { if (el && el.classList.contains('swatch-locked')) return; document.body.className = 'theme-' + name; localStorage.setItem('plTheme', name); document.querySelectorAll('.swatch').forEach(s => s.classList.remove('active')); if (el) el.classList.add('active'); }

function timeAgo(ts) { const diff = Date.now() - new Date(ts).getTime(); const m = Math.floor(diff/60000), h = Math.floor(diff/3600000), d = Math.floor(diff/86400000); if (d > 30) return new Date(ts).toLocaleDateString('vi-VN', {day:'2-digit',month:'2-digit',year:'numeric'}); if (d > 0) return d + ' ngày trước'; if (h > 0) return h + ' giờ trước'; if (m > 0) return m + ' phút trước'; return 'Vừa xong'; }

    el.innerHTML = content;

async function loadStory() {
  try {
    const [{ data: story, error }, { data: chapVotes }] = await Promise.all([
      sb.from('stories').select('*').eq('id', storyId).single(),
      sb.from('chapters').select('votes').eq('story_id', storyId)
    ]);

    const totalVotes = (chapVotes || []).reduce((sum, c) => sum + (c.votes || 0), 0);

    document.title = story.title + ' — Peach Luku';
    setStoryMeta(story);
    document.getElementById('story-title').textContent = story.title || 'Không có tiêu đề';
    if (story.user_id) {
      uploaderUserId = story.user_id;
      const { data: uploaderProf } = await sb.from('profiles').select('username, avatar_url').eq('id', story.user_id).maybeSingle();
      if (uploaderProf) {
        document.getElementById('story-author').textContent = uploaderProf.username || story.author || 'Ẩn danh';
        const avEl = document.getElementById('author-avatar');
        if (uploaderProf.avatar_url) {
          avEl.innerHTML = `<img src="${escapeHtml(uploaderProf.avatar_url)}" alt="${escapeHtml(uploaderProf.username || '')}" style="width:100%;height:100%;object-fit:cover;border-radius:50%">`;
        }
      } else {
        document.getElementById('story-author').textContent = story.author || 'Ẩn danh';
      }
    } else {
      document.getElementById('story-author').textContent = story.author || 'Ẩn danh';
    }
    setDescriptionContent(document.getElementById('story-description'), story.description);
    document.getElementById('story-views').textContent = formatViews(story.total_views || 0);
    document.getElementById('story-votes').textContent = formatViews(totalVotes);
    const isDone = story.status === 'completed' || story.status === 'done' || story.completed;
    const chip = document.getElementById('story-status-chip');
    if (isDone) { chip.className = 'status-chip done'; chip.innerHTML = `<svg viewBox="0 0 24 24" style="width:12px;height:12px;stroke:currentColor;fill:none;stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round"><polyline points="20 6 9 17 4 12"/></svg> Hoàn thành`; }
    else { chip.className = 'status-chip ongoing'; chip.innerHTML = `<svg viewBox="0 0 24 24" style="width:12px;height:12px;stroke:currentColor;fill:none;stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round"><polyline points="12 8 12 12 14 14"/><path d="M3.05 11a9 9 0 1 1 .5 4"/></svg> Đang ra`; }
    if (story.cover_url) { document.getElementById('story-cover').innerHTML = `<img src="${escapeHtml(story.cover_url)}" alt="${escapeHtml(story.title)}">`;  document.getElementById('cover-blur').style.backgroundImage = `url('${escapeHtml(story.cover_url)}')`; }
    document.getElementById('story-genres').style.display = 'none';
    if (story.tags) {
      const tags = story.tags.split(',').map(t => t.trim()).filter(Boolean);
      const tagsHtml = tags.map(t => `<a class="genre-tag" href="search.html?tag=${encodeURIComponent(t)}">${escapeHtml(t)}</a>`).join('');
      document.getElementById('tags-row').insertAdjacentHTML('beforeend', tagsHtml);
    }

    const created = story.created_at ? new Date(story.created_at).toLocaleDateString('vi-VN') : '—';



    if (currentUser) {
      const [{ data: bm }, { data: fl }] = await Promise.all([
        sb.from("bookmarks").select("story_id").eq("user_id", currentUser.id).eq("story_id", storyId).maybeSingle(),
        sb.from("follows").select("story_id").eq("user_id", currentUser.id).eq("story_id", storyId).maybeSingle()
      ]);
      updateBookmarkBtn(!!bm);
      updateFollowBtn(!!fl);

    await loadCommentCount();
  } catch (err) {

async function loadChapters() {
  const { data: chapters } = await sb.from('chapters').select('*').eq('story_id', storyId).eq('is_published', true).order('chapter_number', { ascending: true });
  allChapters = chapters || [];
  const count = allChapters.length;
  document.getElementById('story-chapters').textContent = count;
  document.getElementById('chapter-count-label').textContent = count + ' chương';
  document.getElementById('tc-chapters').textContent = count;

  if (allChapters.length > 0) {
    const latestChapter = allChapters.reduce((a, b) =>
      new Date(a.created_at) > new Date(b.created_at) ? a : b
    );
    const latestDate = new Date(latestChapter.created_at).toLocaleDateString('vi-VN');
    const updatedValEl = document.getElementById('info-updated-val');
    if (updatedValEl) updatedValEl.textContent = latestDate;

    if (currentUser && storyData && currentUser.id === storyData.user_id) {
      const storyUpdatedAt = storyData.updated_at ? new Date(storyData.updated_at) : new Date(0);
      if (new Date(latestChapter.created_at) > storyUpdatedAt) {
        await sb.from('stories').update({ updated_at: latestChapter.created_at }).eq('id', storyId);
        storyData.updated_at = latestChapter.created_at;
      }
    }
  } else {
    const fallbackDate = storyData?.updated_at
      ? new Date(storyData.updated_at).toLocaleDateString('vi-VN')
      : '—';
    const updatedValEl = document.getElementById('info-updated-val');
    if (updatedValEl) updatedValEl.textContent = fallbackDate;
  }

  const readBtn = document.getElementById('read-btn'), readTxt = document.getElementById('read-btn-text');
  let bmEntry = null;
  try { const bm = JSON.parse(localStorage.getItem('pl_bookmarks') || '{}'); bmEntry = bm[storyId]; } catch {}
  if (bmEntry?.lastChapterId) { readBtn.href = `chapter.html?story=${storyId}&chapter=${bmEntry.lastChapterId}`; readTxt.textContent = `Tiếp chương ${bmEntry.lastChapterNum || ''}`; }
  else if (allChapters.length > 0) { readBtn.href = `chapter.html?story=${storyId}&chapter=${allChapters[0].id}`; readTxt.textContent = 'Đọc từ đầu'; }
  else { readBtn.style.opacity = '.5'; readTxt.textContent = 'Chưa có chương'; }
  if (currentUser && storyData && currentUser.id === storyData.user_id) {
    readBtn.href = 'write.html?story=' + storyId;
    readBtn.innerHTML = '<svg viewBox="0 0 24 24"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/></svg><span>Chỉnh sửa</span>';
  }
  renderChapters();
}

function renderChapters(filtered = null) {
  const list = filtered !== null ? filtered : allChapters;
  const listEl = document.getElementById('chapter-list');
  if (!list.length) { listEl.innerHTML = `<div class="empty-state"><svg viewBox="0 0 24 24"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/></svg><div class="empty-state-text">Chưa có chương nào</div></div>`; return; }
  const sorted = [...list].sort((a, b) => { const nA = a.chapter_number || 0, nB = b.chapter_number || 0; return currentSort === 'asc' ? nA - nB : nB - nA; });
  let readChapterIds = new Set();
  try { const h = JSON.parse(localStorage.getItem('pl_history') || '[]'); const entry = h.find(x => x.storyId === storyId); if (entry) readChapterIds.add(entry.chapterId); } catch {}
  listEl.innerHTML = sorted.map(ch => {
    const num = ch.chapter_number || '?', isRead = readChapterIds.has(ch.id);
    const viewsMeta = ch.views
      ? `<div class="chapter-meta"><div class="chapter-meta-right"><svg viewBox="0 0 24 24"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>${formatViews(ch.views)}</div></div>`
      : '';
    return `<a class="chapter-item${isRead ? ' read' : ''}" href="chapter.html?story=${storyId}&chapter=${ch.id}">
      <div class="chapter-info">
        <div class="chapter-name">${escapeHtml(ch.title || `Chương ${num}`)}</div>
        ${viewsMeta}
      </div>
      <span class="chapter-arrow"><svg viewBox="0 0 24 24"><polyline points="9 18 15 12 9 6"/></svg></span>
    </a>`;
  }).join('');
}

function toggleSort() {
  currentSort = currentSort === 'asc' ? 'desc' : 'asc';
  const icon = document.getElementById('sort-icon-svg');
  document.getElementById('sort-label').textContent = currentSort === 'asc' ? 'Cũ → Mới' : 'Mới → Cũ';
  icon.innerHTML = currentSort === 'asc' ? '<line x1="12" y1="5" x2="12" y2="19"/><polyline points="19 12 12 19 5 12"/>' : '<line x1="12" y1="19" x2="12" y2="5"/><polyline points="5 12 12 5 19 12"/>';
  renderChapters();
}
function searchChapters() { const q = document.getElementById('search-input').value.toLowerCase().trim(); if (!q) { renderChapters(); return; } renderChapters(allChapters.filter(ch => (ch.title || '').toLowerCase().includes(q) || String(ch.chapter_number || '').includes(q))); }

async function loadCommentCount() { const { count } = await sb.from('comments').select('id', { count: 'exact', head: true }).eq('story_id', storyId); commentTotal = count || 0; document.getElementById('story-comment-count').textContent = formatViews(commentTotal); document.getElementById('tc-comments').textContent = commentTotal; }

      document.addEventListener('click', function collapseHandler(e) {

const likesCache = {};

async function loadComments(append = false) {
  if (!append) { commentsPage = 0; comments = []; document.getElementById('comment-list').innerHTML = '<div style="text-align:center;padding:2rem;color:var(--text-muted);font-size:15px;font-weight:600">Đang tải bình luận...</div>'; }
  const from = commentsPage * COMMENTS_PER_PAGE;
  const { data, count } = await sb.from('comments').select('*', { count: 'exact' }).eq('story_id', storyId).is('parent_id', null).order('created_at', { ascending: false }).range(from, from + COMMENTS_PER_PAGE - 1);
  if (!append) comments = data || []; else comments = [...comments, ...(data || [])];
  commentTotal = count || commentTotal;
  const ids = (data || []).map(c => c.id);
  const userIds = [...new Set((data || []).map(c => c.user_id).filter(Boolean))];
  await fetchProfiles(userIds);
  if (ids.length) {
    const { data: likesData } = await sb.from('comment_likes').select('comment_id, user_id').in('comment_id', ids);
    ids.forEach(id => {
      const rows = (likesData || []).filter(l => l.comment_id === id);
      likesCache[id] = { count: rows.length, liked: currentUser ? rows.some(l => l.user_id === currentUser.id) : false };
    });
  }
  renderComments();
  // Resolve @mentions async — nếu tìm được username mới thì re-render
  resolveMentionsInComments(comments).then(changed => { if (changed) renderComments(); });
  if (ids.length) {
    const { data: replyCounts } = await sb.from('comments').select('parent_id').in('parent_id', ids).not('parent_id', 'is', null);
    if (replyCounts) {
      const countMap = {};
      replyCounts.forEach(r => { countMap[r.parent_id] = (countMap[r.parent_id] || 0) + 1; });
      ids.forEach(id => {
        const lbl = document.getElementById('reply-label-' + id);
        if (lbl && countMap[id]) lbl.textContent = `Xem ${countMap[id]} trả lời`;
      });
    }
  }
  document.getElementById('load-more-btn').style.display = comments.length < commentTotal ? 'flex' : 'none';
  commentsPage++;
}

const profilesCache = {};

async function fetchProfiles(userIds) {
  const missing = [...new Set(userIds)].filter(id => id && !profilesCache[id]);
  if (!missing.length) return;
  const { data } = await sb.from('profiles').select('id, username, avatar_url').in('id', missing);
  (data || []).forEach(p => {
    profilesCache[p.id] = p;
    if (p.username) usernameToId[p.username] = p.id;
  });
}

function avatarHtml(userId, email, size = 36, fsize = 14) {
  const p = profilesCache[userId] || {};
  const name = p.username || email?.split('@')[0] || 'U';
  if (p.avatar_url) return `<img src="${p.avatar_url}" alt="${name}" style="width:100%;height:100%;object-fit:cover;border-radius:50%">`;
  return `<span style="font-size:${fsize}px;font-weight:800">${name[0].toUpperCase()}</span>`;
}

function displayName(userId, email) {
  const p = profilesCache[userId] || {};
  return p.username || email?.split('@')[0] || 'Người dùng';
}

// Cache username → userId riêng để tra @mention
const usernameToId = {};

// Sync render (dùng cache đã có)
function renderMentions(text) {
  if (!text) return '';
  const safe = text.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  return safe.replace(/@([\w.]+)/g, (match, uname) => {
    const uid = usernameToId[uname];
    if (uid) {
      return `<span class="mention-tag" onclick="event.stopPropagation();goToUserProfile('${uid}')" style="color:var(--peach);font-weight:700;cursor:pointer">@${uname}</span>`;
    }
    return `<span style="color:var(--peach);font-weight:700">@${uname}</span>`;
  });
}

// Fetch các username được @mention mà chưa có trong cache, rồi re-render
async function resolveMentionsInComments(commentList) {
  const allTexts = commentList.map(c => c.content || '').join(' ');
  const mentioned = [...new Set([...allTexts.matchAll(/@([\w.]+)/g)].map(m => m[1]))];
  const missing = mentioned.filter(u => !usernameToId[u]);
  if (!missing.length) return false;
  const { data } = await sb.from('profiles').select('id, username').in('username', missing);
  if (!data || !data.length) return false;
  let changed = false;
  data.forEach(p => { usernameToId[p.username] = p.id; profilesCache[p.id] = { ...profilesCache[p.id], ...p }; changed = true; });
  return changed;
}

function renderComments() {
  const list = document.getElementById('comment-list');
  renderComposeArea();
  if (!comments.length) { list.innerHTML = '<div class="comment-empty"><svg viewBox="0 0 24 24"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg><div class="comment-empty-title">Chưa có bình luận nào</div><div class="comment-empty-sub">Hãy là người đầu tiên chia sẻ cảm nhận!</div></div>'; return; }
  list.innerHTML = comments.map(c => renderCommentCard(c)).join('');
}

function renderCommentCard(c) {

  const isOwn = currentUser && c.user_id === currentUser.id;
  const isAdmin = currentUser && ADMIN_EMAILS.includes(currentUser.email);
  const canDelete = isOwn || isAdmin;
  const lk = likesCache[c.id] || { count: 0, liked: false };
  const likedClass = lk.liked ? ' liked' : '';
  return `<div class="comment-card" id="cmt-${c.id}" onclick="toggleReplyBox('${c.id}','${escapeHtml(name)}')" style="cursor:pointer">
    <div class="comment-item">
      <div class="comment-avatar" onclick="event.stopPropagation();goToUserProfile('${c.user_id}')" style="cursor:pointer">${avatarHtml(c.user_id, c.user_email)}</div>
      <div class="comment-bubble">
        <div class="comment-header">
          <span class="comment-name" onclick="event.stopPropagation();goToUserProfile('${c.user_id}')" style="cursor:pointer">${escapeHtml(name)}</span>
          <span class="comment-time">${timeAgo(c.created_at)}</span>
        </div>
        <div class="comment-text">${renderMentions(c.content)}</div>
        <div class="comment-actions">
          <button class="comment-action-btn${likedClass}" onclick="event.stopPropagation();toggleLike('${c.id}')">
            <svg viewBox="0 0 24 24"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/></svg>
            <span id="like-count-${c.id}">${lk.count || ''}</span>
          </button>
          <button class="comment-action-btn" id="reply-toggle-${c.id}" onclick="event.stopPropagation();toggleReplyBox('${c.id}')">
            <svg viewBox="0 0 24 24"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
            <span id="reply-label-${c.id}">Trả lời</span>
          </button>
          ${canDelete ? `<button class="comment-action-btn delete-btn" onclick="event.stopPropagation();deleteComment('${c.id}')"><svg viewBox="0 0 24 24"><polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14H6L5 6"/><path d="M9 6V4h6v2"/></svg> Xoá</button>` : ''}
        </div>
      </div>
    </div>
    <div class="replies-section" id="replies-${c.id}" style="display:none"></div>
  </div>`;
}

const replyInputTarget = {};
function tagReply(parentId, name, userId) {
  if (userId) replyInputTarget[parentId] = userId;
  const sec = document.getElementById('replies-' + parentId);
  if (sec.style.display === 'none' || sec.style.display === '') {
    sec.style.display = 'flex';
    sec.style.flexDirection = 'column';
    loadReplies(parentId).then(() => {
      const input = document.getElementById('reply-input-' + parentId);
      if (input) { input.value = '@' + name + ' '; input.focus(); }
    });
  } else {
    const input = document.getElementById('reply-input-' + parentId);
    if (input) { input.value = '@' + name + ' '; input.focus(); }
  }
}

async function toggleReplyBox(parentId, tagName = null) {
  const sec = document.getElementById('replies-' + parentId);
  const isHidden = sec.style.display === 'none' || sec.style.display === '';
  if (isHidden) {
    sec.style.display = 'flex';
    sec.style.flexDirection = 'column';
    await loadReplies(parentId);
    const input = document.getElementById('reply-input-' + parentId);
    if (input && tagName) {
      if (!input.value.startsWith('@' + tagName)) input.value = '@' + tagName + ' ';
      input.focus();
    } else if (input) {
      input.focus();
    }
  } else {
    sec.style.display = 'none';
    const lbl = document.getElementById('reply-label-' + parentId);
    const count = sec.querySelectorAll('.reply-item').length;
    if (lbl) lbl.textContent = count > 0 ? `Xem ${count} trả lời` : 'Trả lời';
  }
}

async function loadReplies(parentId) {
  const sec = document.getElementById('replies-' + parentId);
  sec.innerHTML = '<div style="font-size:13px;color:var(--text-muted);padding:4px 0">Đang tải...</div>';
  const { data } = await sb.from('comments').select('*').eq('parent_id', parentId).order('created_at', { ascending: true });
  const replies = data || [];
  const labelEl = document.getElementById('reply-label-' + parentId);
  if (labelEl) labelEl.textContent = replies.length > 0 ? `Xem ${replies.length} trả lời` : 'Trả lời';
  const rUserIds = [...new Set(replies.map(r => r.user_id).filter(Boolean))];
  await fetchProfiles(rUserIds);
  if (replies.length) {
    const ids = replies.map(r => r.id);
    const { data: likesData } = await sb.from('comment_likes').select('comment_id, user_id').in('comment_id', ids);
    ids.forEach(id => {
      const rows = (likesData || []).filter(l => l.comment_id === id);
      likesCache[id] = { count: rows.length, liked: currentUser ? rows.some(l => l.user_id === currentUser.id) : false };
    });
  }
  const composeAv = currentUser ? `<div class="reply-compose-avatar">${avatarHtml(currentUser.id, currentUser.email, 30, 12)}</div>` : '';
  const composeBox = currentUser ? `<div class="reply-compose" id="reply-compose-${parentId}">
    ${composeAv}
    <div class="reply-compose-body">
      <textarea class="reply-input" id="reply-input-${parentId}" placeholder="Viết trả lời..." rows="1" oninput="this.style.height='auto';this.style.height=this.scrollHeight+'px'"></textarea>
      <button class="reply-submit" onclick="submitReply('${parentId}')">Gửi</button>
    </div>
  </div>` : '';
  if (!replies.length) { sec.innerHTML = composeBox; return; }
  sec.innerHTML = replies.map(r => {
    const rname = displayName(r.user_id, r.user_email);
    const isOwn = currentUser && r.user_id === currentUser.id;
    const isAdmin = currentUser && ADMIN_EMAILS.includes(currentUser.email);
    const lk = likesCache[r.id] || { count: 0, liked: false };
    return `<div class="reply-item" id="cmt-${r.id}" onclick="event.stopPropagation();tagReply('${parentId}','${escapeHtml(rname)}','${r.user_id}')" style="cursor:pointer">
      <div class="reply-avatar" onclick="event.stopPropagation();goToUserProfile('${r.user_id}')" style="cursor:pointer">${avatarHtml(r.user_id, r.user_email, 30, 12)}</div>
      <div class="reply-bubble">
        <div class="reply-header"><span class="reply-name" style="cursor:pointer" onclick="event.stopPropagation();goToUserProfile('${r.user_id}')" title="${escapeHtml(rname)}">@${escapeHtml(rname)}</span><span class="reply-time">${timeAgo(r.created_at)}</span></div>
        <div class="reply-text">${renderMentions(r.content)}</div>
        <div class="reply-actions">
          <button class="comment-action-btn${lk.liked ? ' liked' : ''}" onclick="toggleLike('${r.id}','${parentId}')">
            <svg viewBox="0 0 24 24"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/></svg>
            <span id="like-count-${r.id}">${lk.count || ''}</span>
          </button>
          <button class="comment-action-btn" onclick="toggleReplyBox('${parentId}','${escapeHtml(rname)}')">
            <svg viewBox="0 0 24 24"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
            Trả lời
          </button>
          ${(isOwn || isAdmin) ? `<button class="comment-action-btn delete-btn" onclick="deleteComment('${r.id}','${parentId}')"><svg viewBox="0 0 24 24"><polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14H6L5 6"/><path d="M9 6V4h6v2"/></svg> Xoá</button>` : ''}
        </div>
      </div>
    </div>`;
  }).join('') + composeBox;
  // Resolve @mentions trong replies
  resolveMentionsInComments(replies).then(changed => {
    if (changed) loadReplies(parentId);
  });
}

async function submitReply(parentId) {
  if (!currentUser) { showToast('Cần đăng nhập'); return; }
  const input = document.getElementById('reply-input-' + parentId);
  const content = (input?.value || '').trim();
  if (!content) return;
  const btn = document.querySelector(`#reply-compose-${parentId} .reply-submit`);
  if (btn) btn.disabled = true;
  const replyToUserId = replyInputTarget[parentId] || null;
  let finalReplyUserId = replyToUserId;
  if (!finalReplyUserId) {
    const { data: parentCmt } = await sb.from('comments').select('user_id').eq('id', parentId).maybeSingle();
    finalReplyUserId = parentCmt?.user_id || null;
  }
  const { error } = await sb.from('comments').insert({ story_id: storyId, user_id: currentUser.id, user_email: currentUser.email, content, parent_id: parentId, reply_to_user_id: finalReplyUserId });
  delete replyInputTarget[parentId];
  if (error) { showToast('Lỗi: ' + error.message); if (btn) btn.disabled = false; }
  else { await loadReplies(parentId); }
}

async function toggleLike(commentId, parentId = null) {
  if (!currentUser) { showToast('Cần đăng nhập để thả tim'); return; }
  const lk = likesCache[commentId] || { count: 0, liked: false };
  likesCache[commentId] = { count: lk.liked ? lk.count - 1 : lk.count + 1, liked: !lk.liked };
  updateLikeBtn(commentId);
  if (lk.liked) {
    await sb.from('comment_likes').delete().eq('comment_id', commentId).eq('user_id', currentUser.id);
  } else {
    await sb.from('comment_likes').upsert({ comment_id: commentId, user_id: currentUser.id }, { onConflict: 'comment_id,user_id' });
  }
}

function updateLikeBtn(commentId) {
  const lk = likesCache[commentId];
  const btns = document.querySelectorAll(`[onclick*="toggleLike('${commentId}')"]`);
  btns.forEach(btn => {
    btn.classList.toggle('liked', lk.liked);
    const span = document.getElementById('like-count-' + commentId);
    if (span) span.textContent = lk.count > 0 ? lk.count : '';
  });
}

function expandCompose() {
  const box = document.getElementById('compose-box');
  if (!box) return;
  box.classList.add('expanded');
  box.onclick = null;
  setTimeout(() => {
    const input = document.getElementById('comment-input');
    if (input) input.focus();
    document.addEventListener('click', function collapseHandler(e) {
      const b = document.getElementById('compose-box');
      if (b && !b.contains(e.target)) {
        const inp = document.getElementById('comment-input');
        if (!inp?.value?.trim()) {
          b.classList.remove('expanded');
          b.onclick = expandCompose;
        }
        document.removeEventListener('click', collapseHandler);
      }
    });
  }, 50);
}

async function submitComment() {
  if (!currentUser) { showToast('Cần đăng nhập để bình luận'); return; }
  const input = document.getElementById('comment-input'), content = (input?.value || '').trim();
  if (!content) { showToast('Vui lòng nhập nội dung bình luận'); return; }
  const btn = document.querySelector('.compose-submit');
  if (btn) { btn.disabled = true; btn.textContent = 'Đang gửi...'; }
  const { error } = await sb.from('comments').insert({ story_id: storyId, user_id: currentUser.id, user_email: currentUser.email, content, parent_id: null });
  if (error) {
    showToast('Gửi thất bại: ' + error.message);
    const btnNow = document.querySelector('.compose-submit');
    if (btnNow) { btnNow.disabled = false; btnNow.innerHTML = '<svg viewBox="0 0 24 24" style="width:14px;height:14px;stroke:white;fill:none;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round"><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></svg> Gửi'; }
  } else {
    showToast('Đã gửi bình luận');
    await loadComments();
    await loadCommentCount();
  }
}

async function deleteComment(id, parentId = null) {
  if (!confirm('Xoá bình luận này?')) return;
  const { error } = await sb.from('comments').delete().eq('id', id);
  if (error) { showToast('Không thể xoá'); return; }
  showToast('Đã xoá');
  if (parentId) { await loadReplies(parentId); }
  else { await loadComments(); await loadCommentCount(); }
}

function setStoryMeta(story) {
  if (!storyId) return;
  const canonicalUrl = 'https://peachluku.com/story.html?story=' + encodeURIComponent(storyId);
  if (window.PlSEO) {
    PlSEO.updateMeta({ title: story.title || 'Truyện', description: story.description, image: story.cover_url, url: canonicalUrl, type: 'book' });
  } else {
    const title = (story.title || 'Truyện') + ' — Peach Luku';
    const desc  = story.description ? story.description.replace(/<[^>]+>/g, '').slice(0, 160) : 'Web đọc truyện chữ cute & thơm 🍑';
    const img   = story.cover_url || 'https://jnlqzqtavfptkfvnndxq.supabase.co/storage/v1/object/public/avatars/og-cover.png';
    document.title = title;
    _setMeta('description', desc);
    _setMeta('og:title', title); _setMeta('og:description', desc);
    _setMeta('og:image', img);   _setMeta('og:url', canonicalUrl);
    _setMeta('twitter:title', title); _setMeta('twitter:description', desc); _setMeta('twitter:image', img);
  }
}
function _setMeta(k, v) { const el = document.querySelector('[property="'+k+'"]') || document.querySelector('[name="'+k+'"]'); if (el) el.setAttribute('content', v); }

(function() {
  'use strict';
  const protectCSS = document.createElement('style');
  protectCSS.textContent = `.story-body,.description-text,.story-title-main,.author-name,.stat-val,.chapter-name{-webkit-user-select:none!important;-moz-user-select:none!important;-ms-user-select:none!important;user-select:none!important;-webkit-touch-callout:none!important}img{-webkit-user-drag:none!important;user-drag:none!important;pointer-events:none}::selection{background:transparent!important}::-moz-selection{background:transparent!important}`;
  document.head.appendChild(protectCSS);
  document.addEventListener('contextmenu', e => { e.preventDefault(); return false; });
  document.addEventListener('keydown', e => { const key = e.key.toLowerCase(), ctrl = e.ctrlKey || e.metaKey; if (ctrl && ['c','x','a','s','p','u'].includes(key)) { e.preventDefault(); return false; } if (e.key === 'F12') { e.preventDefault(); return false; } if (ctrl && e.shiftKey && ['i','j','c','k'].includes(key)) { e.preventDefault(); return false; } });
  document.addEventListener('copy', e => { e.preventDefault(); if (e.clipboardData) e.clipboardData.setData('text/plain', '© Peach Luku'); return false; });
  document.addEventListener('cut', e => { e.preventDefault(); return false; });
  document.addEventListener('dragstart', e => { e.preventDefault(); return false; });
  document.addEventListener('selectstart', e => { const t = e.target; if (t.tagName === 'INPUT' || t.tagName === 'TEXTAREA' || t.closest('.comment-compose') || t.closest('.chapter-search-bar')) return true; e.preventDefault(); return false; });
  function injectWatermark() { if (document.getElementById('__pl_wm')) return; const wm = document.createElement('div'); wm.id = '__pl_wm'; wm.style.cssText = 'position:fixed;bottom:18px;right:18px;font-size:13px;color:var(--text-muted,#aaa);font-family:"Nunito",sans-serif;font-weight:700;pointer-events:none;z-index:9999;opacity:0.45;letter-spacing:.3px;'; wm.textContent = '© Peach Luku'; document.body.appendChild(wm); }
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', injectWatermark); else injectWatermark();
  document.addEventListener('DOMContentLoaded', function() { document.querySelectorAll('meta[name="description"],meta[property="og:description"]').forEach(m => m.removeAttribute('content')); });
})();
