<!DOCTYPE html>
<html lang="vi">
<head>
  <script src="navbar.js" data-page="home"></script>
</head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hồ sơ — Peach Luku</title>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&family=Pacifico&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root, body.theme-light {
  --peach: #E8835A; --peach-light: #FEF0E9; --peach-mid: #F2A882;
  --peach-dark: #B85B30; --peach-darker: #7A3A1A;
  --bg: #FDF6F2; --bg2: #ffffff; --card: #ffffff;
  --text: #2C1A0E; --text-muted: #9A7A6A;
  --border: rgba(232,131,90,0.18); --border-hover: #F2A882;
  --danger: #e05252; --success: #4caf7d;
  --header-bg: #2C1A0E;
  --header-text: #ffffff;
}
body.theme-dark {
  --peach: #F2A882; --peach-light: #2A1A0E; --peach-mid: #C87050;
  --peach-dark: #F2C0A0; --peach-darker: #FFE0CC;
  --bg: #1a1a1a; --bg2: #242424; --card: #242424;
  --text: #F0D8C8; --text-muted: #A08070;
  --border: rgba(242,168,130,0.15); --border-hover: #C87050;
  --danger: #e07070; --success: #6fcf97;
  --header-bg: #111111;
  --header-text: #ffffff;
}
body.theme-sepia {
  --peach: #8B5E3C; --peach-light: #F0E8D8; --peach-mid: #A67C52;
  --peach-dark: #6B3E1C; --bg: #f5f0e8; --bg2: #faf7f0; --card: #faf7f0;
  --text: #3d2b1f; --text-muted: #9a8070;
  --border: rgba(139,94,60,0.18); --border-hover: #A67C52;
  --danger: #c05050; --success: #5a8a60;
  --header-bg: #3d2b1f; --header-text: #fff;
}

body {
  font-family: 'Nunito', sans-serif;
  background: var(--bg); color: var(--text);
  min-height: 100vh;
  transition: background .3s, color .3s;
}

/* ── TOPBAR ── */
.topbar {
  position: fixed; top: 0; left: 0; right: 0; z-index: 200;
  height: 52px;
  display: flex; align-items: center; justify-content: space-between;
  padding: 0 1rem;
  background: transparent;
  transition: background .3s;
}
.topbar.scrolled { background: var(--bg2); border-bottom: 1px solid var(--border); box-shadow: 0 2px 12px rgba(0,0,0,0.08); }
.topbar-btn {
  width: 38px; height: 38px; border-radius: 50%;
  background: rgba(0,0,0,0.35); border: none; cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  color: white; backdrop-filter: blur(6px); transition: background .15s;
}
.topbar.scrolled .topbar-btn { background: var(--peach-light); color: var(--peach-dark); }
.topbar-btn svg { width: 18px; height: 18px; stroke: currentColor; fill: none; stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; }
.topbar-right { display: flex; gap: 8px; }

/* ── PROFILE HEADER ── */
.profile-header {
  background: var(--header-bg);
  padding: 0 0 0;
  position: relative;
  overflow: hidden;
}
.header-bg-blur {
  position: absolute; inset: 0;
  background: linear-gradient(160deg, rgba(232,131,90,0.25) 0%, rgba(44,26,14,0.95) 60%);
  z-index: 0;
}
.header-content {
  position: relative; z-index: 1;
  padding: 80px 1.25rem 0;
  display: flex; flex-direction: column; align-items: center;
  text-align: center;
}

/* Avatar */
.avatar-ring {
  width: 100px; height: 100px;
  border-radius: 50%;
  border: 3.5px solid var(--peach-mid);
  padding: 3px;
  background: var(--header-bg);
  margin-bottom: 12px;
  position: relative;
}
.avatar-img {
  width: 100%; height: 100%;
  border-radius: 50%;
  object-fit: cover;
  background: var(--peach-light);
  display: flex; align-items: center; justify-content: center;
  font-size: 36px; font-weight: 900;
  color: var(--peach-dark);
  overflow: hidden;
}
.avatar-img img { width: 100%; height: 100%; object-fit: cover; border-radius: 50%; display: block; }
.avatar-edit-label {
  position: absolute; bottom: 2px; right: 2px;
  width: 28px; height: 28px; border-radius: 50%;
  background: var(--peach); border: 2px solid var(--header-bg);
  display: flex; align-items: center; justify-content: center;
  cursor: pointer; transition: background .15s;
}
.avatar-edit-label:hover { background: var(--peach-dark); }
.avatar-edit-label svg { width: 13px; height: 13px; stroke: #fff; fill: none; stroke-width: 2.5; stroke-linecap: round; stroke-linejoin: round; }
#avatar-file { display: none; }

.profile-name {
  font-family: 'Pacifico', cursive;
  font-size: 24px; color: #fff;
  margin-bottom: 3px;
  text-shadow: 0 2px 8px rgba(0,0,0,0.4);
}
.profile-username { font-size: 13px; color: rgba(255,255,255,0.65); font-weight: 600; margin-bottom: 10px; }
.profile-bio-preview {
  font-size: 13px; color: rgba(255,255,255,0.75);
  max-width: 280px; line-height: 1.55;
  margin-bottom: 14px;
}

/* Stats row */
.stats-row {
  display: flex; justify-content: center; gap: 0;
  width: 100%; margin-bottom: 0;
  border-top: 1px solid rgba(255,255,255,0.1);
}
.stat-item {
  flex: 1; padding: 14px 8px 12px;
  text-align: center; cursor: pointer;
  transition: background .15s;
  border-right: 1px solid rgba(255,255,255,0.1);
}
.stat-item:last-child { border-right: none; }
.stat-item:hover { background: rgba(255,255,255,0.06); }
.stat-num { font-size: 20px; font-weight: 900; color: #fff; line-height: 1; }
.stat-label { font-size: 10px; font-weight: 700; color: rgba(255,255,255,0.55); text-transform: uppercase; letter-spacing: .5px; margin-top: 3px; }

/* ── TAB BAR ── */
.tab-bar {
  background: var(--bg2);
  display: flex;
  border-bottom: 1.5px solid var(--border);
  position: sticky; top: 52px; z-index: 100;
  transition: background .3s;
}
.tab-btn {
  flex: 1; padding: 13px 8px;
  background: none; border: none; cursor: pointer;
  font-family: 'Nunito', sans-serif; font-size: 13px; font-weight: 800;
  color: var(--text-muted);
  border-bottom: 2.5px solid transparent;
  margin-bottom: -1.5px;
  transition: all .15s;
}
.tab-btn:hover { color: var(--peach); }
.tab-btn.active { color: var(--peach); border-bottom-color: var(--peach); }

/* ── PANES ── */
.pane { display: none; padding: 1.25rem; max-width: 600px; margin: 0 auto; }
.pane.active { display: block; }

/* ── GIỚI THIỆU ── */
.section-card {
  background: var(--card); border-radius: 16px;
  border: 1px solid var(--border); padding: 1.25rem;
  margin-bottom: 1rem;
}
.section-title {
  font-size: 11px; font-weight: 800; color: var(--text-muted);
  text-transform: uppercase; letter-spacing: .6px;
  margin-bottom: 1rem;
}
.field { display: flex; flex-direction: column; gap: 5px; margin-bottom: .9rem; }
.field:last-child { margin-bottom: 0; }
.field label { font-size: 12px; font-weight: 700; color: var(--text-muted); }
.field input, .field textarea {
  background: var(--bg); border: 1.5px solid var(--border);
  border-radius: 10px; padding: 9px 12px;
  font-family: 'Nunito', sans-serif; font-size: 14px; color: var(--text);
  outline: none; transition: border .15s; resize: none;
}
.field input:focus, .field textarea:focus { border-color: var(--peach-mid); }
.field textarea { min-height: 72px; }

.save-btn {
  width: 100%; padding: 11px; border-radius: 12px;
  background: var(--peach); border: none; cursor: pointer;
  font-family: 'Nunito', sans-serif; font-size: 15px; font-weight: 800;
  color: #fff; margin-top: .75rem; transition: opacity .15s;
}
.save-btn:hover { opacity: .88; }
.save-btn:disabled { opacity: .5; cursor: not-allowed; }

/* password */
.pw-section { margin-top: 1rem; }
.pw-toggle {
  background: none; border: 1.5px solid var(--border-hover);
  border-radius: 10px; padding: 8px 14px;
  font-family: 'Nunito', sans-serif; font-size: 13px; font-weight: 700;
  color: var(--text-muted); cursor: pointer; transition: all .15s;
  display: flex; align-items: center; gap: 6px; width: 100%; justify-content: center;
}
.pw-toggle:hover { background: var(--peach-light); color: var(--peach-dark); border-color: var(--peach-mid); }
.pw-toggle svg { width: 14px; height: 14px; stroke: currentColor; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
.pw-fields { display: none; margin-top: .75rem; }
.pw-fields.open { display: block; }

/* danger */
.danger-btn {
  width: 100%; padding: 10px; border-radius: 12px;
  background: none; border: 1.5px solid var(--danger);
  cursor: pointer; font-family: 'Nunito', sans-serif;
  font-size: 14px; font-weight: 700; color: var(--danger);
  transition: background .15s;
}
.danger-btn:hover { background: rgba(224,82,82,.08); }

/* ── TÁC PHẨM ── */
.story-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
  gap: 12px;
}
.story-card {
  background: var(--card); border-radius: 12px;
  border: 1px solid var(--border); overflow: hidden;
  text-decoration: none; color: var(--text);
  display: flex; flex-direction: column;
  transition: all .15s;
}
.story-card:hover { border-color: var(--peach-mid); transform: translateY(-2px); box-shadow: 0 6px 20px rgba(0,0,0,0.08); }
.story-cover {
  position: relative; width: 100%; padding-top: 140%;
  background: linear-gradient(145deg, var(--peach-light), #FDF6E3);
  overflow: hidden;
}
.story-cover img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; display: none; }
.story-cover.has-img img { display: block; }
.story-cover-ph { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; font-size: 36px; }
.story-cover.has-img .story-cover-ph { display: none; }
.story-ch-badge {
  position: absolute; bottom: 6px; right: 6px;
  background: rgba(0,0,0,0.52); color: #fff;
  font-size: 10px; font-weight: 800; padding: 2px 6px; border-radius: 8px;
  backdrop-filter: blur(4px);
}
.story-info { padding: 8px 10px 10px; flex: 1; display: flex; flex-direction: column; gap: 3px; }
.story-title { font-size: 12px; font-weight: 800; line-height: 1.35; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.story-meta { font-size: 10px; color: var(--text-muted); display: flex; align-items: center; gap: 4px; margin-top: 2px; }
.story-meta svg { width: 10px; height: 10px; stroke: currentColor; fill: none; stroke-width: 2; }

.empty-pane {
  text-align: center; padding: 3rem 1rem;
  color: var(--text-muted); font-size: 13px;
}
.empty-pane .empty-icon { font-size: 42px; margin-bottom: 10px; }

/* ── UPLOAD PROGRESS ── */
.upload-hint { font-size: 11px; color: var(--text-muted); text-align: center; margin-top: 4px; display: none; }

/* ── LOGIN WALL ── */
.login-wall {
  background: var(--card); border-radius: 20px; border: 1px solid var(--border);
  padding: 2.5rem 1.5rem; text-align: center;
  display: flex; flex-direction: column; align-items: center; gap: 1rem;
  margin: 2rem 1.25rem;
}
.login-wall h2 { font-size: 17px; font-weight: 800; }
.login-wall p { font-size: 13px; color: var(--text-muted); }
.login-wall-btn {
  background: var(--peach); color: #fff; border: none;
  border-radius: 12px; padding: 10px 28px;
  font-family: 'Nunito', sans-serif; font-size: 15px; font-weight: 800; cursor: pointer;
}

/* ── TOAST ── */
.toast {
  position: fixed; bottom: 24px; left: 50%;
  transform: translateX(-50%) translateY(16px);
  background: var(--text); color: var(--bg2);
  padding: 10px 20px; border-radius: 24px;
  font-size: 13px; font-weight: 700;
  opacity: 0; pointer-events: none;
  transition: all .25s; white-space: nowrap; z-index: 999;
}
.toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

/* ── SKELETON ── */
.skel-card { border-radius: 12px; overflow: hidden; background: var(--card); border: 1px solid var(--border); }
.skel { background: linear-gradient(90deg, var(--peach-light) 25%, #FDF6E3 50%, var(--peach-light) 75%); background-size: 200% 100%; animation: shimmer 1.4s infinite; border-radius: 6px; }
.skel-cover-sq { padding-top: 140%; }
.skel-line { height: 11px; margin: 8px 10px 4px; }
.skel-line.short { width: 55%; }
@keyframes shimmer { 0%{background-position:200% 0} 100%{background-position:-200% 0} }

/* ── THEME DRAWER ── */
.theme-drawer {
  position: fixed; top: 60px; right: 1rem; z-index: 300;
  background: var(--bg2); border: 1px solid var(--border);
  border-radius: 16px; padding: 14px 16px; width: 210px;
  box-shadow: 0 8px 28px rgba(0,0,0,0.15); display: none;
}
.theme-drawer.open { display: block; }
.theme-drawer-title { font-size: 11px; font-weight: 800; color: var(--text-muted); margin-bottom: 10px; text-transform: uppercase; letter-spacing: .5px; }
.theme-swatches { display: grid; grid-template-columns: repeat(4,1fr); gap: 7px; }
.swatch { width: 36px; height: 36px; border-radius: 50%; border: 3px solid transparent; cursor: pointer; transition: all .15s; }
.swatch.active { border-color: var(--peach); box-shadow: 0 0 0 2px var(--bg2), 0 0 0 4px var(--peach); }
.swatch:hover { transform: scale(1.1); }
.swatch-lbl { font-size: 9px; text-align: center; color: var(--text-muted); margin-top: 3px; font-weight: 700; }
</style>
</head>

<!-- PROFILE HEADER -->
<div class="profile-header" id="profile-header">

<script>
const SUPABASE_URL = 'https://jnlqzqtavfptkfvnndxq.supabase.co';
const SUPABASE_KEY = 'sb_publishable_ojRrfSwxK_B6-TGSXaYGxQ_DKERN0-f';
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

/* ── theme ── */
(function(){
  const t = localStorage.getItem('plTheme') || 'light';
  document.body.className = 'theme-' + t;
})();
function setTheme(name, el) {
  document.body.className = 'theme-' + name;
  localStorage.setItem('plTheme', name);
  document.querySelectorAll('.swatch').forEach(s => s.classList.remove('active'));
  if (el) el.classList.add('active');
}
function toggleThemeDrawer() {
  document.getElementById('theme-drawer').classList.toggle('open');
}
document.addEventListener('click', e => {
  const d = document.getElementById('theme-drawer');
  if (!d.contains(e.target) && !e.target.closest('#theme-toggle-btn')) d.classList.remove('open');
});

/* topbar scroll */
window.addEventListener('scroll', () => {
  document.getElementById('topbar').classList.toggle('scrolled', window.scrollY > 60);
});

/* ── toast ── */
function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2200);
}

function esc(s) {
  if (!s) return '';
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}
function fmtNum(n) {
  if (!n) return '0';
  if (n >= 1000000) return (n/1e6).toFixed(1)+'M';
  if (n >= 1000) return (n/1000).toFixed(1)+'K';
  return String(n);
}

/* ── tab ── */
function switchTab(name) {
  ['intro','works','settings'].forEach(t => {
    document.getElementById('tab-'+t)?.classList.toggle('active', t === name);
    document.getElementById('pane-'+t)?.classList.toggle('active', t === name);
  });
}

/* ── state ── */
let currentUser = null;
let profile = null;

/* ── login wall ── */
function renderLoginWall() {
  document.getElementById('header-content').innerHTML = `
