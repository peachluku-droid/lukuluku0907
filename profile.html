<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Hồ sơ — Peach Luku</title>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&family=Open+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root, body.theme-light {
  --peach: #E8835A; --peach-light: #FEF0E9; --peach-mid: #F2A882;
  --peach-dark: #B85B30; --peach-darker: #7A3A1A;
  --bg: #FDF6F2; --bg2: #ffffff; --card: #ffffff;
  --text: #2C1A0E; --text-muted: #9A7A6A;
  --border: rgba(232,131,90,0.18); --border-hover: #F2A882;
  --danger: #e05252; --success: #4caf7d;
  --header-bg: #2C1A0E;
  --header-text: #ffffff;
}
body.theme-dark {
  --peach: #F2A882; --peach-light: #2A1A0E; --peach-mid: #C87050;
  --peach-dark: #F2C0A0; --peach-darker: #FFE0CC;
  --bg: #1a1a1a; --bg2: #242424; --card: #242424;
  --text: #F0D8C8; --text-muted: #A08070;
  --border: rgba(242,168,130,0.15); --border-hover: #C87050;
  --danger: #e07070; --success: #6fcf97;
  --header-bg: #111111;
  --header-text: #ffffff;
}
body.theme-sepia {
  --peach: #8B5E3C; --peach-light: #F0E8D8; --peach-mid: #A67C52;
  --peach-dark: #6B3E1C; --bg: #f5f0e8; --bg2: #faf7f0; --card: #faf7f0;
  --text: #3d2b1f; --text-muted: #9a8070;
  --border: rgba(139,94,60,0.18); --border-hover: #A67C52;
  --danger: #c05050; --success: #5a8a60;
  --header-bg: #3d2b1f; --header-text: #fff;
}

body {
  font-family: 'Nunito', sans-serif;
  background: var(--bg); color: var(--text);
  min-height: 100vh;
  transition: background .3s, color .3s;
}

/* ── TOPBAR ── */
.topbar {
  position: fixed; top: 0; left: 0; right: 0; z-index: 200;
  height: 52px;
  display: flex; align-items: center; justify-content: space-between;
  padding: 0 1rem;
  background: transparent;
  transition: background .3s;
}
.topbar.scrolled { background: var(--bg2); border-bottom: 1px solid var(--border); box-shadow: 0 2px 12px rgba(0,0,0,0.08); }
.topbar-btn {
  width: 38px; height: 38px; border-radius: 50%;
  background: rgba(0,0,0,0.35); border: none; cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  color: white; backdrop-filter: blur(6px); transition: background .15s;
}
.topbar.scrolled .topbar-btn { background: var(--peach-light); color: var(--peach-dark); }
.topbar-btn svg { width: 18px; height: 18px; stroke: currentColor; fill: none; stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; }
.topbar-right { display: flex; gap: 8px; }

/* ── PROFILE HEADER ── */
.profile-header {
  background: var(--header-bg);
  padding: 0 0 0;
  position: relative;
  overflow: hidden;
}
.header-bg-blur {
  position: absolute; inset: 0;
  background: linear-gradient(160deg, rgba(232,131,90,0.25) 0%, rgba(44,26,14,0.95) 60%);
  z-index: 0;
}
.header-content {
  position: relative; z-index: 1;
  padding: 80px 1.25rem 0;
  display: flex; flex-direction: column; align-items: center;
  text-align: center;
}

/* Avatar */
.avatar-ring {
  width: 100px; height: 100px;
  border-radius: 50%;
  border: 3.5px solid var(--peach-mid);
  padding: 3px;
  background: var(--header-bg);
  margin-bottom: 12px;
  position: relative;
}
.avatar-img {
  width: 100%; height: 100%;
  border-radius: 50%;
  object-fit: cover;
  background: var(--peach-light);
  display: flex; align-items: center; justify-content: center;
  font-size: 36px; font-weight: 900;
  color: var(--peach-dark);
  overflow: hidden;
}
.avatar-img img { width: 100%; height: 100%; object-fit: cover; border-radius: 50%; display: block; }
.avatar-edit-label {
  position: absolute; bottom: 2px; right: 2px;
  width: 28px; height: 28px; border-radius: 50%;
  background: var(--peach); border: 2px solid var(--header-bg);
  display: flex; align-items: center; justify-content: center;
  cursor: pointer; transition: background .15s;
}
.avatar-edit-label:hover { background: var(--peach-dark); }
.avatar-edit-label svg { width: 13px; height: 13px; stroke: #fff; fill: none; stroke-width: 2.5; stroke-linecap: round; stroke-linejoin: round; }
#avatar-file { display: none; }

.profile-name {
  font-family: 'Pacifico', cursive;
  font-size: 24px; color: #fff;
  margin-bottom: 3px;
  text-shadow: 0 2px 8px rgba(0,0,0,0.4);
}
.profile-username { font-size: 13px; color: rgba(255,255,255,0.65); font-weight: 600; margin-bottom: 10px; }
.profile-bio-preview {
  font-size: 13px; color: rgba(255,255,255,0.75);
  max-width: 280px; line-height: 1.55;
  margin-bottom: 14px;
}

/* Stats row */
.stats-row {
  display: flex; justify-content: center; gap: 0;
  width: 100%; margin-bottom: 0;
  border-top: 1px solid rgba(255,255,255,0.1);
}
.stat-item {
  flex: 1; padding: 14px 8px 12px;
  text-align: center; cursor: pointer;
  transition: background .15s;
  border-right: 1px solid rgba(255,255,255,0.1);
}
.stat-item:last-child { border-right: none; }
.stat-item:hover { background: rgba(255,255,255,0.06); }
.stat-num { font-size: 20px; font-weight: 900; color: #fff; line-height: 1; }
.stat-label { font-size: 10px; font-weight: 700; color: rgba(255,255,255,0.55); text-transform: uppercase; letter-spacing: .5px; margin-top: 3px; }

/* ── TAB BAR ── */
.tab-bar {
  background: var(--bg2);
  display: flex;
  border-bottom: 1.5px solid var(--border);
  position: sticky; top: 52px; z-index: 100;
  transition: background .3s;
}
.tab-btn {
  flex: 1; padding: 13px 8px;
  background: none; border: none; cursor: pointer;
  font-family: 'Nunito', sans-serif; font-size: 13px; font-weight: 800;
  color: var(--text-muted);
  border-bottom: 2.5px solid transparent;
  margin-bottom: -1.5px;
  transition: all .15s;
}
.tab-btn:hover { color: var(--peach); }
.tab-btn.active { color: var(--peach); border-bottom-color: var(--peach); }

/* ── PANES ── */
.pane { display: none; padding: 1.25rem; max-width: 600px; margin: 0 auto; }
.pane.active { display: block; }

/* ── GIỚI THIỆU ── */
.section-card {
  background: var(--card); border-radius: 16px;
  border: 1px solid var(--border); padding: 1.25rem;
  margin-bottom: 1rem;
}
.section-title {
  font-size: 11px; font-weight: 800; color: var(--text-muted);
  text-transform: uppercase; letter-spacing: .6px;
  margin-bottom: 1rem;
}
.field { display: flex; flex-direction: column; gap: 5px; margin-bottom: .9rem; }
.field:last-child { margin-bottom: 0; }
.field label { font-size: 12px; font-weight: 700; color: var(--text-muted); }
.field input, .field textarea {
  background: var(--bg); border: 1.5px solid var(--border);
  border-radius: 10px; padding: 9px 12px;
  font-family: 'Nunito', sans-serif; font-size: 14px; color: var(--text);
  outline: none; transition: border .15s; resize: none;
}
.field input:focus, .field textarea:focus { border-color: var(--peach-mid); }
.field textarea { min-height: 72px; }

.save-btn {
  width: 100%; padding: 11px; border-radius: 12px;
  background: var(--peach); border: none; cursor: pointer;
  font-family: 'Nunito', sans-serif; font-size: 15px; font-weight: 800;
  color: #fff; margin-top: .75rem; transition: opacity .15s;
}
.save-btn:hover { opacity: .88; }
.save-btn:disabled { opacity: .5; cursor: not-allowed; }

/* password */
.pw-section { margin-top: 1rem; }
.pw-toggle {
  background: none; border: 1.5px solid var(--border-hover);
  border-radius: 10px; padding: 8px 14px;
  font-family: 'Nunito', sans-serif; font-size: 13px; font-weight: 700;
  color: var(--text-muted); cursor: pointer; transition: all .15s;
  display: flex; align-items: center; gap: 6px; width: 100%; justify-content: center;
}
.pw-toggle:hover { background: var(--peach-light); color: var(--peach-dark); border-color: var(--peach-mid); }
.pw-toggle svg { width: 14px; height: 14px; stroke: currentColor; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
.pw-fields { display: none; margin-top: .75rem; }
.pw-fields.open { display: block; }

/* danger */
.danger-btn {
  width: 100%; padding: 10px; border-radius: 12px;
  background: none; border: 1.5px solid var(--danger);
  cursor: pointer; font-family: 'Nunito', sans-serif;
  font-size: 14px; font-weight: 700; color: var(--danger);
  transition: background .15s;
}
.danger-btn:hover { background: rgba(224,82,82,.08); }

/* ── TÁC PHẨM ── */
.story-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
  gap: 12px;
}
.story-card {
  background: var(--card); border-radius: 12px;
  border: 1px solid var(--border); overflow: hidden;
  text-decoration: none; color: var(--text);
  display: flex; flex-direction: column;
  transition: all .15s;
}
.story-card:hover { border-color: var(--peach-mid); transform: translateY(-2px); box-shadow: 0 6px 20px rgba(0,0,0,0.08); }
.story-cover {
  position: relative; width: 100%; padding-top: 140%;
  background: linear-gradient(145deg, var(--peach-light), #FDF6E3);
  overflow: hidden;
}
.story-cover img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; display: none; }
.story-cover.has-img img { display: block; }
.story-cover-ph { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; font-size: 36px; }
.story-cover.has-img .story-cover-ph { display: none; }
.story-ch-badge {
  position: absolute; bottom: 6px; right: 6px;
  background: rgba(0,0,0,0.52); color: #fff;
  font-size: 10px; font-weight: 800; padding: 2px 6px; border-radius: 8px;
  backdrop-filter: blur(4px);
}
.story-info { padding: 8px 10px 10px; flex: 1; display: flex; flex-direction: column; gap: 3px; }
.story-title { font-size: 12px; font-weight: 800; line-height: 1.35; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.story-meta { font-size: 10px; color: var(--text-muted); display: flex; align-items: center; gap: 4px; margin-top: 2px; }
.story-meta svg { width: 10px; height: 10px; stroke: currentColor; fill: none; stroke-width: 2; }

.empty-pane {
  text-align: center; padding: 3rem 1rem;
  color: var(--text-muted); font-size: 13px;
}
.empty-pane .empty-icon { font-size: 42px; margin-bottom: 10px; }

/* ── UPLOAD PROGRESS ── */
.upload-hint { font-size: 11px; color: var(--text-muted); text-align: center; margin-top: 4px; display: none; }

/* ── LOGIN WALL ── */
.login-wall {
  background: var(--card); border-radius: 20px; border: 1px solid var(--border);
  padding: 2.5rem 1.5rem; text-align: center;
  display: flex; flex-direction: column; align-items: center; gap: 1rem;
  margin: 2rem 1.25rem;
}
.login-wall h2 { font-size: 17px; font-weight: 800; }
.login-wall p { font-size: 13px; color: var(--text-muted); }
.login-wall-btn {
  background: var(--peach); color: #fff; border: none;
  border-radius: 12px; padding: 10px 28px;
  font-family: 'Nunito', sans-serif; font-size: 15px; font-weight: 800; cursor: pointer;
}

/* ── TOAST ── */
.toast {
  position: fixed; bottom: 24px; left: 50%;
  transform: translateX(-50%) translateY(16px);
  background: var(--text); color: var(--bg2);
  padding: 10px 20px; border-radius: 24px;
  font-size: 13px; font-weight: 700;
  opacity: 0; pointer-events: none;
  transition: all .25s; white-space: nowrap; z-index: 999;
}
.toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

/* ── SKELETON ── */
.skel-card { border-radius: 12px; overflow: hidden; background: var(--card); border: 1px solid var(--border); }
.skel { background: linear-gradient(90deg, var(--peach-light) 25%, #FDF6E3 50%, var(--peach-light) 75%); background-size: 200% 100%; animation: shimmer 1.4s infinite; border-radius: 6px; }
.skel-cover-sq { padding-top: 140%; }
.skel-line { height: 11px; margin: 8px 10px 4px; }
.skel-line.short { width: 55%; }
@keyframes shimmer { 0%{background-position:200% 0} 100%{background-position:-200% 0} }

/* ── THEME DRAWER ── */
.theme-drawer {
  position: fixed; top: 60px; right: 1rem; z-index: 300;
  background: var(--bg2); border: 1px solid var(--border);
  border-radius: 16px; padding: 14px 16px; width: 210px;
  box-shadow: 0 8px 28px rgba(0,0,0,0.15); display: none;
}
.theme-drawer.open { display: block; }
.theme-drawer-title { font-size: 11px; font-weight: 800; color: var(--text-muted); margin-bottom: 10px; text-transform: uppercase; letter-spacing: .5px; }
.theme-swatches { display: grid; grid-template-columns: repeat(4,1fr); gap: 7px; }
.swatch { width: 36px; height: 36px; border-radius: 50%; border: 3px solid transparent; cursor: pointer; transition: all .15s; }
.swatch.active { border-color: var(--peach); box-shadow: 0 0 0 2px var(--bg2), 0 0 0 4px var(--peach); }
.swatch:hover { transform: scale(1.1); }
.swatch-lbl { font-size: 9px; text-align: center; color: var(--text-muted); margin-top: 3px; font-weight: 700; }

/* ── FOLLOW BTN ── */
.follow-btn {
  display: inline-flex; align-items: center; gap: 7px;
  background: rgba(255,255,255,0.18); color: #fff;
  border: 1.5px solid rgba(255,255,255,0.6);
  border-radius: 10px; padding: 10px 36px;
  font-family: 'Nunito', sans-serif; font-size: 15px; font-weight: 800;
  cursor: pointer; margin: 8px 0 4px; transition: all .15s;
  letter-spacing: .3px; backdrop-filter: blur(4px);
}
.follow-btn:hover { background: rgba(255,255,255,0.28); }
</style>
</head>

(function(){ const t = localStorage.getItem('plTheme')||'light'; document.body.className='theme-'+t; })();
function setTheme(n,el){ document.body.className='theme-'+n; localStorage.setItem('plTheme',n); document.querySelectorAll('.swatch').forEach(s=>s.classList.remove('active')); if(el)el.classList.add('active'); }
function toggleThemeDrawer(){ document.getElementById('theme-drawer').classList.toggle('open'); }
document.addEventListener('click',e=>{ const d=document.getElementById('theme-drawer'); if(!d.contains(e.target)&&!e.target.closest('#theme-toggle-btn'))d.classList.remove('open'); });
window.addEventListener('scroll',()=>{ document.getElementById('topbar').classList.toggle('scrolled',window.scrollY>60); });

function showToast(msg){ const t=document.getElementById('toast'); t.textContent=msg; t.classList.add('show'); setTimeout(()=>t.classList.remove('show'),2200); }
function esc(s){ if(!s)return''; return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
function fmtNum(n){ if(!n)return'0'; if(n>=1000000)return(n/1e6).toFixed(1)+'M'; if(n>=1000)return(n/1000).toFixed(1)+'K'; return String(n); }
function fmtDate(d){ const dt=new Date(d); return dt.toLocaleDateString('vi-VN',{day:'numeric',month:'short',year:'numeric'})+' lúc '+dt.toLocaleTimeString('vi-VN',{hour:'2-digit',minute:'2-digit'}); }

let currentUser = null;
let profileData = null;
let profileUserId = null;
let isOwnProfile = false;
let isFollowing = false;

function switchTab(name) {
  ['intro','works','wall','settings'].forEach(t => {
    document.getElementById('tab-'+t)?.classList.toggle('active', t===name);
    document.getElementById('pane-'+t)?.classList.toggle('active', t===name);
  });
  if (name === 'wall') loadWall();
  if (name === 'works') loadWorks();
}

async function init() {
  const params = new URLSearchParams(location.search);
  const userParam = params.get('user');

  let sessionUser = null;
  try { const {data:{session}} = await sb.auth.getSession(); sessionUser = session?.user||null; } catch(e){}
  if (!sessionUser) {
    sb.auth.onAuthStateChange((ev,session) => { if(session){ currentUser=session.user; if(isOwnProfile) showOwnControls(); checkFollowing(); } });
  } else {
    currentUser = sessionUser;
  }

  if (!userParam) {
    // Own profile
    if (!currentUser) { renderLoginWall(); return; }
    profileUserId = currentUser.id;
    isOwnProfile = true;
  } else {
    profileUserId = userParam;
    isOwnProfile = currentUser && currentUser.id === profileUserId;
  }

  await loadProfile();
  loadWorks();
  if (currentUser && !isOwnProfile) checkFollowing();
  if (isOwnProfile) showOwnControls();
}

async function loadProfile() {
  const { data } = await sb.from('profiles').select('*').eq('id', profileUserId).maybeSingle();
  profileData = data || {};

  // Banner
  const bannerUrl = profileData.banner_url || profileData.avatar_url;
  if (bannerUrl) {
    const blur = document.getElementById('header-bg-blur');
    blur.style.backgroundImage = `url('${bannerUrl}')`;
    blur.style.backgroundSize = 'cover';
    blur.style.backgroundPosition = 'center';
    blur.style.filter = profileData.banner_url ? 'blur(0px) brightness(0.55)' : 'blur(22px) brightness(0.35)';
    blur.style.transform = profileData.banner_url ? 'scale(1)' : 'scale(1.15)';
  }

  // Avatar
  const avatarEl = document.getElementById('avatar-display');
  if (profileData.avatar_url) {
    avatarEl.innerHTML = `<img src="${esc(profileData.avatar_url)}" onerror="this.parentElement.textContent='🐹'">`;
  } else {
    const initials = (profileData.display_name||'?')[0].toUpperCase();
    avatarEl.textContent = initials;
  }


  document.getElementById('display-name-header').textContent = profileData.display_name || 'Người dùng';
  document.getElementById('username-header').textContent = '@' + (profileData.username || '...');
  document.getElementById('bio-header').textContent = profileData.bio ? profileData.bio.slice(0,100)+(profileData.bio.length>100?'...':'') : '';
  document.title = (profileData.display_name||'Hồ sơ') + ' — Peach Luku';

  // Stats
  const [{ count: worksCount }, { count: followersCount }] = await Promise.all([
    sb.from('stories').select('*', {count:'exact',head:true}).eq('user_id', profileUserId),
    sb.from('user_follows').select('*', {count:'exact',head:true}).eq('following_id', profileUserId),
  ]);
  document.getElementById('stat-works').textContent = fmtNum(worksCount||0);
  document.getElementById('stat-followers').textContent = fmtNum(followersCount||0);

  // Intro pane
  renderIntro();

  // Show follow button for other profiles
  if (!isOwnProfile && currentUser) {
    document.getElementById('follow-btn').style.display = 'inline-flex';
  }
}

    if (p.facebook) html += `<div style="margin-bottom:8px;font-size:13px"><a href="${esc(p.facebook)}" target="_blank" style="color:var(--peach);font-weight:700">📘 Facebook</a></div>`;

  if (isOwnProfile) {
    html += `
    <div style="background:var(--card);border:1px solid var(--border);border-radius:14px;padding:14px 16px;margin-bottom:12px">
      <div style="font-size:11px;font-weight:800;color:var(--text-muted);text-transform:uppercase;letter-spacing:.5px;margin-bottom:12px">Chỉnh sửa hồ sơ</div>

        <div><label style="font-size:12px;font-weight:700;color:var(--text-muted);display:block;margin-bottom:4px">Username</label>
        <input id="ed-username" value="${esc(p.username||'')}" style="width:100%;background:var(--bg);border:1.5px solid var(--border);border-radius:10px;padding:9px 12px;font-family:Nunito,sans-serif;font-size:14px;color:var(--text);outline:none" onfocus="this.style.borderColor='var(--peach-mid)'" onblur="this.style.borderColor='var(--border)'"></div>
        <div><label style="font-size:12px;font-weight:700;color:var(--text-muted);display:block;margin-bottom:4px">Giới thiệu bản thân</label>
        <textarea id="ed-bio" rows="4" style="width:100%;background:var(--bg);border:1.5px solid var(--border);border-radius:10px;padding:9px 12px;font-family:Nunito,sans-serif;font-size:14px;color:var(--text);outline:none;resize:none" onfocus="this.style.borderColor='var(--peach-mid)'" onblur="this.style.borderColor='var(--border)'">${esc(p.bio||'')}</textarea></div>
        <div><label style="font-size:12px;font-weight:700;color:var(--text-muted);display:block;margin-bottom:4px">Website / Link</label>
        <input id="ed-website" value="${esc(p.website||'')}" placeholder="https://..." style="width:100%;background:var(--bg);border:1.5px solid var(--border);border-radius:10px;padding:9px 12px;font-family:Nunito,sans-serif;font-size:14px;color:var(--text);outline:none" onfocus="this.style.borderColor='var(--peach-mid)'" onblur="this.style.borderColor='var(--border)'"></div>
        <button onclick="saveProfile()" style="width:100%;padding:11px;border-radius:12px;background:var(--peach);border:none;cursor:pointer;font-family:Nunito,sans-serif;font-size:15px;font-weight:800;color:#fff;margin-top:4px">Lưu thông tin</button>

    <div style="background:var(--card);border:1px solid var(--border);border-radius:14px;padding:14px 16px;margin-bottom:12px">
      <div style="font-size:11px;font-weight:800;color:var(--text-muted);text-transform:uppercase;letter-spacing:.5px;margin-bottom:12px">Đổi mật khẩu</div>
      <div style="display:flex;flex-direction:column;gap:10px">

async function loadWorks() {
  const grid = document.getElementById('works-grid');
  const { data: stories } = await sb.from('stories').select('*').eq('user_id', profileUserId).order('created_at', {ascending:false});
  if (!stories || !stories.length) {
    grid.innerHTML = '<div style="text-align:center;padding:3rem 1rem;color:var(--text-muted);font-size:13px"><div style="font-size:36px;margin-bottom:8px">📚</div>Chưa có tác phẩm nào</div>';
    return;
  }
  grid.innerHTML = stories.map(s => `
    <a class="story-card" href="story.html?story=${s.id}">
      <div class="story-cover${s.cover_url?' has-img':''}">
        <div class="story-cover-ph">📖</div>
        ${s.cover_url?`<img src="${esc(s.cover_url)}" onerror="this.style.display='none'" loading="lazy">`:''}
      </div>
      <div class="story-info">
        <div class="story-title">${esc(s.title)}</div>
        <div class="story-meta">
          <svg viewBox="0 0 24 24"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
          ${fmtNum(s.total_views||0)}
        </div>
      </div>
    </a>`).join('');
}

/* ── Wall / Hội thoại ── */
async function loadWall() {
  const list = document.getElementById('wall-list');
  list.innerHTML = '<div style="text-align:center;padding:2rem;color:var(--text-muted);font-size:13px">Đang tải...</div>';

  if (currentUser) document.getElementById('wall-compose').style.display = 'block';

  const { data: posts } = await sb.from('wall_posts')
    .select('*, profiles(display_name, avatar_url, username)')
    .eq('profile_id', profileUserId)
    .order('created_at', {ascending:false});

  if (!posts || !posts.length) {
    list.innerHTML = '<div style="text-align:center;padding:3rem 1rem;color:var(--text-muted);font-size:13px"><div style="font-size:36px;margin-bottom:8px">💬</div>Chưa có tin nhắn nào</div>';
    return;
  }
  list.innerHTML = posts.map(p => {
    const pf = p.profiles || {};
    const initials = (pf.display_name||'?')[0].toUpperCase();
    const canDelete = currentUser && (currentUser.id === p.user_id || currentUser.id === profileUserId || ADMIN_EMAILS.includes(currentUser.email));
    const menuId = 'menu_' + p.id;
    return `<div class="wall-post-item" id="post_${p.id}" style="background:#fff;border-radius:4px;padding:14px 16px;position:relative;margin-bottom:8px">
      <div style="display:flex;align-items:flex-start;gap:12px">
        <div style="width:44px;height:44px;border-radius:50%;background:var(--peach-light);display:flex;align-items:center;justify-content:center;font-size:16px;font-weight:800;color:var(--peach-dark);overflow:hidden;flex-shrink:0">
          ${pf.avatar_url?`<img src="${esc(pf.avatar_url)}" style="width:100%;height:100%;object-fit:cover;border-radius:50%" onerror="this.parentElement.textContent='${initials}'">`:`${initials}`}
        </div>
        <div style="flex:1;min-width:0">
          <div style="font-size:14px;font-weight:800;color:var(--text)">${esc(pf.display_name||'Người dùng')} <span style="font-weight:400;color:var(--text-muted);font-size:13px">đã đăng một tin nhắn</span></div>
          <div style="font-size:12px;color:var(--text-muted);margin-top:1px">${fmtDate(p.created_at)}</div>
        </div>
        <button onclick="toggleWallMenu('${menuId}')" style="background:none;border:none;cursor:pointer;color:var(--text-muted);font-size:20px;padding:0 4px;line-height:1;flex-shrink:0">⋯</button>
      </div>
      <div id="${menuId}" style="display:none;position:absolute;right:12px;top:52px;background:var(--card);border-radius:12px;box-shadow:0 4px 24px rgba(0,0,0,0.14);overflow:hidden;z-index:50;min-width:220px;border:1px solid var(--border)">
        <div onclick="openReply('${p.id}');toggleWallMenu('${menuId}')" style="padding:16px 20px;font-size:15px;color:var(--text);cursor:pointer;border-bottom:1px solid var(--border)">Trả lời</div>
        ${canDelete?`<div onclick="deleteWallPost('${p.id}');toggleWallMenu('${menuId}')" style="padding:16px 20px;font-size:15px;color:var(--danger);font-weight:700;cursor:pointer;border-bottom:1px solid var(--border)">Xóa tin nhắn</div>`:''}
        <div onclick="toggleWallMenu('${menuId}')" style="padding:16px 20px;font-size:15px;color:var(--text-muted);cursor:pointer">Đóng</div>
      </div>
      <hr style="border:none;border-top:1px solid var(--border);margin:10px 0">
      <div style="font-size:15px;color:var(--text);line-height:1.65;white-space:pre-wrap">${esc(p.content)}</div>
      <div id="replies-${p.id}" style="margin-top:8px"></div>
      <button onclick="openReply('${p.id}')" style="background:none;border:none;cursor:pointer;color:var(--text-muted);font-size:13px;font-weight:600;padding:6px 0 0;display:flex;align-items:center;gap:5px;font-family:Nunito,sans-serif">
        <svg viewBox="0 0 24 24" width="14" height="14" style="stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
        Trả lời
      </button>
      <div id="replybox-${p.id}" style="display:none;margin-top:10px">
        <div style="display:flex;gap:8px">
          <input id="reply-input-${p.id}" placeholder="Viết trả lời..." style="flex:1;background:var(--bg);border:1.5px solid var(--border);border-radius:8px;padding:8px 12px;font-family:Nunito,sans-serif;font-size:13px;color:var(--text);outline:none">
          <button onclick="postReply('${p.id}')" style="background:var(--peach);color:#fff;border:none;border-radius:8px;padding:8px 14px;font-size:13px;font-weight:800;cursor:pointer">Gửi</button>
        </div>
      </div>
    </div>`;
  }).join('');
}

function toggleWallMenu(id) {
  const m = document.getElementById(id);
  if (!m) return;
  const isOpen = m.style.display !== 'none';
  // Close all menus first
  document.querySelectorAll('[id^="menu_"]').forEach(el => el.style.display = 'none');
  m.style.display = isOpen ? 'none' : 'block';
}
document.addEventListener('click', e => {
  if (!e.target.closest('[id^="menu_"]') && e.target.textContent !== '⋯') {
    document.querySelectorAll('[id^="menu_"]').forEach(el => el.style.display = 'none');
  }
});

function openReply(postId) {
  const box = document.getElementById('replybox-'+postId);
  if (!box) return;
  const isOpen = box.style.display !== 'none';
  box.style.display = isOpen ? 'none' : 'flex';
  box.style.flexDirection = 'column';
  if (!isOpen) document.getElementById('reply-input-'+postId)?.focus();
}

async function postWall() {
  const input = document.getElementById('wall-input');
  const content = input.value.trim();
  if (!content) return;
  if (!currentUser) { showToast('Đăng nhập để đăng tin!'); return; }
  const { error } = await sb.from('wall_posts').insert({ profile_id: profileUserId, user_id: currentUser.id, content });
  if (error) { showToast('Lỗi đăng tin!'); return; }
  input.value = '';
  showToast('Đã đăng! 🎉');
  loadWall();
}

async function deleteWallPost(id) {
  if (!confirm('Xóa tin nhắn này?')) return;
  // Xóa khỏi DOM ngay lập tức
  const el = document.getElementById('post_'+id);
  if (el) { el.style.opacity='0'; el.style.transition='opacity .2s'; setTimeout(()=>el.remove(),200); }
  await sb.from('wall_posts').delete().eq('id', id);
}

async function toggleReplies(postId, btn) {
  const el = document.getElementById('replies-'+postId);
  if (el.style.display !== 'none') { el.style.display='none'; return; }
  el.style.display = 'block';
  el.innerHTML = '<div style="font-size:12px;color:var(--text-muted)">Đang tải...</div>';
  const { data: replies } = await sb.from('wall_replies').select('*, profiles(display_name,avatar_url)').eq('post_id',postId).order('created_at');
  let html = '';
  if (replies && replies.length) {
    html = replies.map(r => {
      const pf = r.profiles||{}; const ini = (pf.display_name||'?')[0].toUpperCase();
      return `<div style="display:flex;gap:8px;margin-bottom:8px"><div style="width:28px;height:28px;border-radius:50%;background:var(--peach-light);display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:800;color:var(--peach-dark);flex-shrink:0;overflow:hidden">${pf.avatar_url?`<img src="${esc(pf.avatar_url)}" style="width:100%;height:100%;object-fit:cover;border-radius:50%">`:`${ini}`}</div><div><div style="font-size:12px;font-weight:800">${esc(pf.display_name||'?')}</div><div style="font-size:13px;color:var(--text)">${esc(r.content)}</div></div></div>`;
    }).join('');
  }
  if (currentUser) html += `<div style="display:flex;gap:8px;margin-top:8px"><input id="reply-input-${postId}" placeholder="Viết trả lời..." style="flex:1;background:var(--bg);border:1.5px solid var(--border);border-radius:8px;padding:7px 10px;font-family:Nunito,sans-serif;font-size:13px;color:var(--text);outline:none"><button onclick="postReply('${postId}')" style="background:var(--peach);color:#fff;border:none;border-radius:8px;padding:7px 12px;font-size:12px;font-weight:800;cursor:pointer">Gửi</button></div>`;
  el.innerHTML = html || '<div style="font-size:12px;color:var(--text-muted);margin-bottom:8px">Chưa có trả lời</div>' + (currentUser?`<div style="display:flex;gap:8px;margin-top:8px"><input id="reply-input-${postId}" placeholder="Viết trả lời..." style="flex:1;background:var(--bg);border:1.5px solid var(--border);border-radius:8px;padding:7px 10px;font-family:Nunito,sans-serif;font-size:13px;color:var(--text);outline:none"><button onclick="postReply('${postId}')" style="background:var(--peach);color:#fff;border:none;border-radius:8px;padding:7px 12px;font-size:12px;font-weight:800;cursor:pointer">Gửi</button></div>`:'');
}

async function postReply(postId) {
  const input = document.getElementById('reply-input-'+postId);
  const content = input?.value?.trim();
  if (!content || !currentUser) return;
  await sb.from('wall_replies').insert({ post_id: postId, user_id: currentUser.id, content });
  toggleReplies(postId, null);
  setTimeout(()=>toggleReplies(postId, null), 100);
}

/* ── Follow ── */
async function checkFollowing() {
  if (!currentUser || isOwnProfile) return;
  const { data } = await sb.from('user_follows').select('id').eq('follower_id', currentUser.id).eq('following_id', profileUserId).maybeSingle();
  isFollowing = !!data;
  updateFollowBtn();
}

function updateFollowBtn() {
  const btn = document.getElementById('follow-btn');
  if (!btn) return;
  if (isFollowing) {
    btn.style.background = 'rgba(255,255,255,0.15)';
    btn.style.border = '2px solid rgba(255,255,255,0.75)';
    btn.style.color = '#fff';
    btn.innerHTML = `<svg viewBox="0 0 24 24" width="14" height="14" style="stroke:#fff;fill:none;stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round"><path d="M16 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="8.5" cy="7" r="4"/><polyline points="17 11 19 13 23 9"/></svg> Đang theo dõi`;
  } else {
    btn.style.background = 'transparent';
    btn.style.border = '2px solid rgba(255,255,255,0.75)';
    btn.style.color = '#fff';
    btn.innerHTML = `<svg viewBox="0 0 24 24" width="14" height="14" style="stroke:#fff;fill:none;stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round"><path d="M16 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="8.5" cy="7" r="4"/><line x1="20" y1="8" x2="20" y2="14"/><line x1="23" y1="11" x2="17" y2="11"/></svg> Theo dõi`;
  }
}

async function toggleFollow() {
  if (!currentUser) { showToast('Đăng nhập để theo dõi!'); return; }
  if (isFollowing) {
    await sb.from('user_follows').delete().eq('follower_id', currentUser.id).eq('following_id', profileUserId);
    isFollowing = false;
  } else {
    await sb.from('user_follows').insert({ follower_id: currentUser.id, following_id: profileUserId });
    isFollowing = true;
  }
  updateFollowBtn();
  // Update count
  const { count } = await sb.from('user_follows').select('*',{count:'exact',head:true}).eq('following_id', profileUserId);
  document.getElementById('stat-followers').textContent = fmtNum(count||0);
}

function showOwnControls() {
  document.getElementById('avatar-edit-label').style.display = 'flex';
  // Chạm vào ảnh nền để đổi
  const bg = document.getElementById('header-bg-blur');
  if (bg) { bg.style.cursor = 'pointer'; bg.onclick = () => document.getElementById('banner-file').click(); }
  document.getElementById('follow-btn').style.display = 'none';
  document.getElementById('tab-settings')?.style.setProperty('display','block');
}

/* ── Save profile ── */
async function saveProfile() {
  if (!currentUser) return;
  const updates = {
    display_name: document.getElementById('ed-name')?.value?.trim(),
    username: document.getElementById('ed-username')?.value?.trim(),
    bio: document.getElementById('ed-bio')?.value?.trim(),
    website: document.getElementById('ed-website')?.value?.trim(),
  };
  const { error } = await sb.from('profiles').update(updates).eq('id', currentUser.id);
  if (error) { showToast('Lỗi lưu: ' + error.message); return; }
  showToast('Đã lưu! 🐹');
  document.getElementById('display-name-header').textContent = updates.display_name || 'Người dùng';
  document.getElementById('username-header').textContent = '@' + (updates.username||'...');
}

async function changePassword() {
  const pw = document.getElementById('pw-new')?.value;
  if (!pw || pw.length < 6) { showToast('Mật khẩu tối thiểu 6 ký tự!'); return; }
  const { error } = await sb.auth.updateUser({ password: pw });
  if (error) { showToast('Lỗi: ' + error.message); return; }
  showToast('Đổi mật khẩu thành công!');
  document.getElementById('pw-new').value = '';
}

/* ── Avatar upload ── */
document.getElementById('avatar-file').addEventListener('change', async e => {
  const file = e.target.files[0];
  if (!file || !currentUser) return;
  document.getElementById('upload-hint').style.display = 'block';
  const path = `avatars/${currentUser.id}/avatar_${Date.now()}`;
  const { error: upErr } = await sb.storage.from('avatars').upload(path, file, { upsert: true });
  if (upErr) { showToast('Lỗi upload!'); document.getElementById('upload-hint').style.display='none'; return; }
  const url = sb.storage.from('avatars').getPublicUrl(path).data.publicUrl;
  await sb.from('profiles').update({ avatar_url: url }).eq('id', currentUser.id);
  document.getElementById('avatar-display').innerHTML = `<img src="${url}" style="width:100%;height:100%;object-fit:cover;border-radius:50%">`;
  document.getElementById('upload-hint').style.display = 'none';
  showToast('Đã cập nhật ảnh! 🐹');
});

/* ── Banner upload ── */
document.getElementById('banner-file').addEventListener('change', async e => {
  const file = e.target.files[0];
  if (!file || !currentUser) return;
  showToast('Đang tải ảnh nền...');
  const path = `banners/${currentUser.id}/banner_${Date.now()}`;
  const { error: upErr } = await sb.storage.from('avatars').upload(path, file, { upsert: true });
  if (upErr) { showToast('Lỗi upload!'); return; }
  const url = sb.storage.from('avatars').getPublicUrl(path).data.publicUrl;
  await sb.from('profiles').update({ banner_url: url }).eq('id', currentUser.id);
  document.getElementById('header-bg-blur').style.backgroundImage = `url('${url}')`;
  document.getElementById('header-bg-blur').style.backgroundSize = 'cover';
  document.getElementById('header-bg-blur').style.backgroundPosition = 'center';
  document.getElementById('header-bg-blur').style.filter = 'blur(0px) brightness(0.55)';
  showToast('Đã cập nhật ảnh nền! 🎨');
});

function renderLoginWall() {
  document.getElementById('header-content').innerHTML = `
    <div style="padding:80px 0 20px;color:#fff;text-align:center">
      <div style="font-size:48px;margin-bottom:12px">🐹</div>
      <div style="font-size:18px;font-weight:800;margin-bottom:6px">Peach Luku</div>
      <div style="font-size:13px;opacity:.7;margin-bottom:20px">Đăng nhập để xem hồ sơ của bạn</div>
      <button onclick="location.href='auth.html'" style="background:var(--peach);color:#fff;border:none;border-radius:12px;padding:10px 28px;font-family:Nunito,sans-serif;font-size:15px;font-weight:800;cursor:pointer">Đăng nhập</button>
    </div>`;
  document.getElementById('tab-bar').style.display = 'none';
  document.querySelectorAll('.pane').forEach(p=>p.classList.remove('active'));
}

init();
</script>
</body>
</html>
