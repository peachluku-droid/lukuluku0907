<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Hồ sơ — Peach Luku</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

/* ══════════════════════════════════════════
   THEME TOKENS — palette hồng pastel (Archive of Our Own style)
   Giữ nguyên TÊN biến cũ để không phải sửa lại toàn bộ CSS bên dưới,
   chỉ đổi GIÁ TRỊ cho khớp thiết kế mới.
   ══════════════════════════════════════════ */
:root, body.theme-light {
  --peach: #8D1B2A; --peach-light: #F7E9E6; --peach-mid: #A32637;
  --peach-dark: #6E141F; --peach-darker: #4A0E16;
  --bg: #F8EFE7; --bg2: #FFFDFB; --card: #FFFDFB;
  --text: #2B2B2B; --text-muted: #7B7B7B;
  --border: #ECD8D2; --border-hover: #A32637;
  --danger: #e05252; --success: #4caf7d;
  --header-bg: #FFFDFB;
  --header-text: #2B2B2B;
  --shadow-card: 0 4px 18px rgba(141,27,42,0.08);
  --shadow-card-hover: 0 10px 26px rgba(141,27,42,0.14);
  --dots-color: rgba(141,27,42,0.07);
}
body.theme-dark {
  --peach: #F3A9C2; --peach-light: #2A1620; --peach-mid: #C4708F;
  --peach-dark: #F7C6D8; --peach-darker: #FFE0EC;
  --bg: #170F14; --bg2: #211721; --card: #241823;
  --text: #F3DCE6; --text-muted: #A88C97;
  --border: rgba(243,169,194,0.14); --border-hover: #C4708F;
  --danger: #e07070; --success: #6fcf97;
  --header-bg: #170F14;
  --header-text: #F3DCE6;
  --shadow-card: 0 4px 18px rgba(0,0,0,0.28);
  --shadow-card-hover: 0 10px 26px rgba(0,0,0,0.36);
  --dots-color: rgba(243,169,194,0.05);
}
body.theme-sepia {
  --peach: #8B5E3C; --peach-light: #F0E8D8; --peach-mid: #A67C52;
  --peach-dark: #6B3E1C; --bg: #f5f0e8; --bg2: #faf7f0; --card: #faf7f0;
  --text: #3d2b1f; --text-muted: #9a8070;
  --border: rgba(139,94,60,0.18); --border-hover: #A67C52;
  --danger: #c05050; --success: #5a8a60;
  --header-bg: #3d2b1f; --header-text: #fff;
  --shadow-card: 0 4px 18px rgba(107,62,28,0.1);
  --shadow-card-hover: 0 10px 26px rgba(107,62,28,0.16);
  --dots-color: rgba(139,94,60,0.06);
}
body.theme-blue {
  --peach: #4A7DE0; --peach-light: #EAF1FE; --peach-mid: #9DBBF2;
  --peach-dark: #2E58B0; --peach-darker: #1E3C80;
  --bg: #EFF4FE; --bg2: #ffffff; --card: #ffffff;
  --text: #1C2740; --text-muted: #8A96B5;
  --border: rgba(74,125,224,0.16); --border-hover: #9DBBF2;
  --danger: #e05252; --success: #4caf7d;
  --header-bg: #ffffff; --header-text: #1C2740;
  --shadow-card: 0 4px 18px rgba(46,88,176,0.08);
  --shadow-card-hover: 0 10px 26px rgba(46,88,176,0.14);
  --dots-color: rgba(74,125,224,0.07);
}
body.theme-pink {
  --peach: #E876A0; --peach-light: #FFF0F6; --peach-mid: #F3B4CB;
  --peach-dark: #C34E77; --peach-darker: #8A2F4E;
  --bg: #FFF0F6; --bg2: #ffffff; --card: #ffffff;
  --text: #3A1F2A; --text-muted: #AD8494;
  --border: rgba(232,118,160,0.16); --border-hover: #F3B4CB;
  --danger: #e05252; --success: #4caf7d;
  --header-bg: #ffffff; --header-text: #3A1F2A;
  --shadow-card: 0 4px 18px rgba(195,78,119,0.08);
  --shadow-card-hover: 0 10px 26px rgba(195,78,119,0.14);
  --dots-color: rgba(232,118,160,0.07);
}
body.theme-purple {
  --peach: #8A5DE0; --peach-light: #F2EDFE; --peach-mid: #C0A9F2;
  --peach-dark: #5E38B0; --peach-darker: #402580;
  --bg: #F5F0FE; --bg2: #ffffff; --card: #ffffff;
  --text: #241C3A; --text-muted: #9C8CB5;
  --border: rgba(138,93,224,0.16); --border-hover: #C0A9F2;
  --danger: #e05252; --success: #4caf7d;
  --header-bg: #ffffff; --header-text: #241C3A;
  --shadow-card: 0 4px 18px rgba(94,56,176,0.08);
  --shadow-card-hover: 0 10px 26px rgba(94,56,176,0.14);
  --dots-color: rgba(138,93,224,0.07);
}

body {
  font-family: 'Nunito Sans', sans-serif;
  background: var(--bg); color: var(--text);
  min-height: 100vh;
  transition: background .3s, color .3s;
  padding-bottom: 76px; /* chừa chỗ cho bottom-nav cố định */
}

h1, h2, h3, .fredoka { font-family: 'Fredoka', sans-serif; }

/* ── HỌA TIẾT NỀN CHẤM BI ── */
.bg-dots {
  position: fixed; inset: 0; z-index: -1; pointer-events: none;
  background-image: radial-gradient(var(--dots-color) 2.4px, transparent 2.4px);
  background-size: 22px 22px;
  transition: background-image .3s;
}

/* ── TOPBAR (app header — logo + back + actions) ── */
.app-topbar {
  position: fixed; top: 0; left: 0; right: 0; z-index: 200;
  height: 60px;
  display: flex; align-items: center; justify-content: space-between;
  padding: 0 .9rem;
  background: var(--bg2);
  border-bottom: 1px solid var(--border);
  box-shadow: 0 2px 12px rgba(0,0,0,0.04);
  transition: background .3s, box-shadow .3s;
}
#topbar.scrolled { box-shadow: 0 2px 16px rgba(0,0,0,0.08); }
.topbar-btn {
  width: 38px; height: 38px; border-radius: 50%;
  background: var(--peach-light); border: 1px solid var(--border); cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  color: var(--peach-dark); flex-shrink: 0;
  transition: background .15s, transform .15s;
}
.topbar-btn:hover { transform: translateY(-1px); background: var(--peach); color: #fff; }
.topbar-btn:active { transform: scale(.94); }
.topbar-btn svg { width: 18px; height: 18px; stroke: currentColor; fill: none; stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; }
.topbar-right { display: flex; gap: 8px; }
.topbar-brand {
  display: flex; align-items: center; gap: 8px;
  font-family: 'Fredoka', sans-serif; font-weight: 700;
  color: var(--peach-dark); font-size: 17px;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.topbar-brand .brand-emoji { font-size: 19px; }
.topbar-brand .brand-beta { font-size: 11px; font-style: italic; color: var(--text-muted); font-family: 'Nunito Sans', sans-serif; font-weight: 700; margin-left: 2px; }

/* ── PAGE WRAP ── */
.page-wrap { max-width: 720px; margin: 0 auto; padding: 0 1rem; }

/* ── PROFILE HEADER CARD ── */
.profile-header { background: transparent; padding: 76px 0 0; position: relative; }

.profile-card {
  background: var(--card); border-radius: 26px;
  border: 1px solid var(--border); box-shadow: var(--shadow-card);
  padding: 22px 20px 6px; position: relative; overflow: hidden;
}
.header-bg-blur {
  position: absolute; top: -40px; right: -40px; width: 180px; height: 180px;
  border-radius: 50%; opacity: .5; z-index: 0;
  background: radial-gradient(circle, var(--peach-mid), transparent 70%);
  filter: blur(22px) brightness(1); transform: scale(1.15);
  transition: all .3s;
}
.header-content { display: block; text-align: left; position: relative; z-index: 1; }
.profile-top-row { display: flex; align-items: flex-start; gap: 18px; }

/* Avatar */
.avatar-ring {
  width: 116px; height: 116px; flex-shrink: 0;
  border-radius: 50%;
  border: 3px solid var(--peach-light);
  padding: 3px;
  background: var(--card);
  position: relative;
  box-shadow: 0 4px 16px rgba(196,61,104,0.14);
  transition: transform .15s;
}
.avatar-ring:hover { transform: scale(1.02); }
.avatar-img {
  width: 100%; height: 100%;
  border-radius: 50%;
  object-fit: cover;
  background: var(--peach-light);
  display: flex; align-items: center; justify-content: center;
  font-size: 34px; font-weight: 700;
  font-family: 'Fredoka', sans-serif;
  color: var(--peach-dark);
  overflow: hidden;
}
.avatar-img img { width: 100%; height: 100%; object-fit: cover; border-radius: 50%; display: block; }
.avatar-edit-label {
  position: absolute; bottom: 2px; right: 2px;
  width: 28px; height: 28px; border-radius: 50%;
  background: var(--peach); border: 2px solid var(--card);
  display: none !important;
  align-items: center; justify-content: center;
  cursor: pointer; transition: background .15s;
}
.avatar-edit-label:hover { background: var(--peach-dark); }
.avatar-edit-label svg { width: 12px; height: 12px; stroke: #fff; fill: none; stroke-width: 2.5; stroke-linecap: round; stroke-linejoin: round; }
#avatar-file { display: none; }

.profile-name-block { flex: 1; min-width: 0; padding-top: 8px; }
.profile-name {
  font-family: 'Fredoka', sans-serif;
  font-size: 25px; color: var(--text);
  font-weight: 700;
  line-height: 1.25;
  margin-bottom: 4px;
}
.profile-username { font-size: 14px; color: var(--text-muted); font-weight: 600; }
.profile-bio-preview {
  font-size: 13px; color: var(--text-muted);
  line-height: 1.55;
  margin-top: 10px;
}
.profile-bio-preview:empty { display: none; margin: 0; }

/* Action buttons row — 4 pill dạng mockup */
.action-row { display: flex; flex-wrap: wrap; gap: 9px; margin-top: 18px; }
.action-btn, .pill-static {
  display: inline-flex; align-items: center; gap: 6px;
  background: var(--peach-light); color: var(--peach-dark);
  border: 1.5px solid var(--border);
  border-radius: 999px; padding: 8px 15px;
  font-family: 'Nunito Sans', sans-serif; font-size: 12.5px; font-weight: 700;
  cursor: pointer; transition: all .15s;
}
.action-btn svg, .pill-static svg { width: 14px; height: 14px; stroke: currentColor; fill: none; stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; }
.action-btn:hover { background: var(--peach); color: #fff; border-color: var(--peach); transform: translateY(-1px); }
.action-btn:active { transform: translateY(0) scale(.97); }
.action-btn.primary { background: var(--peach-light); color: var(--peach-dark); }
.pill-static { cursor: default; opacity: .88; }

/* Cụm nút chỉ hiện với chính chủ (được JS bật/tắt qua #drawer-edit-btn, không đổi logic) */
#drawer-edit-btn { display: flex; flex-wrap: wrap; gap: 9px; }

/* Follow button (reuses action-btn styling) */
.follow-btn {
  display: inline-flex; align-items: center; gap: 6px;
  background: var(--peach-light); color: var(--peach-dark);
  border: 1.5px solid var(--border);
  border-radius: 999px; padding: 8px 15px;
  font-family: 'Nunito Sans', sans-serif; font-size: 12.5px; font-weight: 700;
  cursor: pointer; margin: 0; transition: all .15s;
}
.follow-btn:hover { background: var(--peach); color: #fff; border-color: var(--peach); transform: translateY(-1px); }
.follow-btn:active { transform: translateY(0) scale(.97); }

/* Stats row → grid 4 cột theo mockup */
.stats-row {
  display: grid; grid-template-columns: repeat(4, 1fr);
  width: 100%; margin-top: 20px;
  border-top: 1px solid var(--border);
}
.stat-item {
  padding: 14px 4px 12px;
  text-align: center; cursor: pointer;
  transition: opacity .15s;
  border-right: 1px solid var(--border);
}
.stat-item:last-child { border-right: none; }
.stat-item:hover { opacity: .72; }
.stat-num { font-family: 'Fredoka', sans-serif; font-size: 19px; font-weight: 700; color: var(--peach-dark); line-height: 1; }
.stat-label { font-size: 9.5px; font-weight: 700; color: var(--text-muted); text-transform: uppercase; letter-spacing: .4px; margin-top: 5px; }

/* ── TAB BAR ── */
.tab-bar {
  background: transparent;
  display: flex;
  position: sticky; top: 60px; z-index: 100;
  margin-top: 18px;
  padding-bottom: 0;
  justify-content: center;
}
.tab-btn {
  flex: 1; max-width: 220px; padding: 13px 8px;
  background: none; border: none; cursor: pointer;
  font-family: 'Fredoka', sans-serif; font-size: 14.5px; font-weight: 600;
  color: var(--text-muted);
  position: relative;
  transition: color .15s;
}
.tab-btn::after {
  content: ''; position: absolute; left: 50%; bottom: 0;
  transform: translateX(-50%) scaleX(0);
  width: 70%; height: 3px; border-radius: 3px;
  background: var(--peach);
  transition: transform .25s cubic-bezier(.4,0,.2,1);
}
.tab-bar { border-bottom: 1.5px solid var(--border); background: var(--bg); }
.tab-btn:hover { color: var(--peach); }
.tab-btn.active { color: var(--peach); }
.tab-btn.active::after { transform: translateX(-50%) scaleX(1); }

/* ── PANES ── */
.pane { display: none; padding: 1rem 0 1.5rem; max-width: 720px; margin: 0 auto; background: transparent; }
.pane.active { display: block; }
.pane-wall-wrap { display: none; max-width: 860px; margin: 0 auto; }
.pane-wall-wrap.active { display: block; }

/* Wall */
.wall-outer { background: transparent; min-height: 200px; }
.wall-compose-box { background: var(--card); border: 1px solid var(--border); border-radius: 18px; padding: 12px 14px; display: flex; align-items: center; gap: 12px; margin-bottom: 12px; box-shadow: var(--shadow-card); }
.wall-compose-box textarea { flex: 1; background: var(--bg); border: 1.5px solid var(--border); border-radius: 10px; font-family: 'Nunito Sans', sans-serif; font-size: 14px; color: var(--text); outline: none; resize: none; line-height: 1.5; overflow: hidden; padding: 9px 12px; transition: border-color .15s; }
.wall-compose-box textarea:focus { border-color: var(--peach-mid); }
.wall-compose-box textarea::placeholder { color: var(--text-muted); }
.wall-post { background: var(--card); border: 1px solid var(--border); border-radius: 18px; position: relative; margin-bottom: 12px; box-shadow: var(--shadow-card); overflow: hidden; transition: box-shadow .15s, transform .15s; }
.wall-post:hover { box-shadow: var(--shadow-card-hover); transform: translateY(-1px); }
.wall-post-header { display: flex; align-items: center; gap: 12px; padding: 14px 16px 10px; }
.wall-post-avatar { width: 42px; height: 42px; border-radius: 50%; background: var(--peach-light); display: flex; align-items: center; justify-content: center; font-size: 15px; font-weight: 700; font-family: 'Fredoka', sans-serif; color: var(--peach-dark); overflow: hidden; flex-shrink: 0; }
.wall-post-avatar img { width: 100%; height: 100%; object-fit: cover; border-radius: 50%; }
.wall-post-name { font-size: 14px; font-weight: 700; color: var(--text); }
.wall-post-time { font-size: 12px; color: var(--text-muted); margin-top: 2px; }
.wall-post-body { padding: 4px 16px 12px; font-size: 14px; color: var(--text); line-height: 1.6; white-space: pre-wrap; }
.wall-post-footer { background: var(--bg); padding: 8px 16px; border-top: 1px solid var(--border); }
.wall-reply-item { display: flex; gap: 10px; padding: 10px 16px; border-top: 1px solid var(--border); background: var(--bg); }
.wall-reply-avatar { width: 30px; height: 30px; border-radius: 50%; background: var(--peach-light); display: flex; align-items: center; justify-content: center; font-size: 11px; font-weight: 700; font-family: 'Fredoka', sans-serif; color: var(--peach-dark); overflow: hidden; flex-shrink: 0; }
.wall-reply-avatar img { width: 100%; height: 100%; object-fit: cover; border-radius: 50%; }
.wall-replybox { padding: 8px 16px 12px; background: var(--card); border-top: 1px solid var(--border); display: none; }
.wall-replybox.open { display: block; }
.wall-replybox-inner { display: flex; gap: 8px; }
.wall-replybox input { flex: 1; background: var(--bg); border: 1.5px solid var(--border); border-radius: 10px; padding: 9px 12px; font-family: 'Nunito Sans', sans-serif; font-size: 13px; color: var(--text); outline: none; transition: border-color .15s; }
.wall-replybox input:focus { border-color: var(--peach-mid); }
.wall-replybox input::placeholder { color: var(--text-muted); }

/* Story list items — mockup card style (dùng bởi renderIntro/loadIntroWorks) */
.story-hcard {
  display: flex; gap: 14px; padding: 14px;
  background: var(--card); border: 1px solid var(--border);
  border-radius: 18px; margin-bottom: 12px;
  text-decoration: none; color: var(--text);
  box-shadow: var(--shadow-card);
  transition: transform .15s, box-shadow .15s, border-color .15s;
}
.story-hcard:hover { transform: translateY(-2px); box-shadow: var(--shadow-card-hover); border-color: var(--border-hover); }
.story-hcard:active { transform: translateY(0) scale(.99); }
.story-hcover { width: 84px; height: 112px; border-radius: 12px; overflow: hidden; background: linear-gradient(145deg, var(--peach-light), #FFF6FA); flex-shrink: 0; display: flex; align-items: center; justify-content: center; font-size: 28px; }
.story-hcover img { width: 100%; height: 100%; object-fit: cover; display: block; }
.story-hinfo { flex: 1; min-width: 0; display: flex; flex-direction: column; justify-content: center; gap: 6px; }
.story-htitle { font-family: 'Fredoka', sans-serif; font-size: 15px; font-weight: 600; line-height: 1.35; color: var(--text); display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.story-hstats { display: flex; gap: 12px; flex-wrap: wrap; align-items: center; }
.story-hstat { font-size: 12px; font-weight: 600; color: var(--text-muted); display: flex; align-items: center; gap: 4px; }
.story-hstat svg { width: 13px; height: 13px; stroke: currentColor; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
.story-hdesc { font-size: 12.5px; color: var(--text-muted); line-height: 1.5; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.story-htags { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; margin-top: 2px; }
.story-htag { background: var(--peach-light); color: var(--peach-dark); border-radius: 999px; padding: 3px 10px; font-size: 11px; font-weight: 700; }
.story-htag-more { font-size: 11px; color: var(--text-muted); font-weight: 600; }

.story-htitle-row { display: flex; align-items: flex-start; justify-content: space-between; gap: 8px; }
.story-hchevron { flex-shrink: 0; margin-top: 2px; stroke: var(--peach); fill: none; stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; }

/* Bio bubble */
.bio-bubble {
  display: flex; align-items: center; gap: 12px;
  background: var(--peach-light); border-radius: 16px;
  padding: 14px 16px; margin-bottom: 18px;
}
.bio-bubble[onclick] { cursor: pointer; }
.bio-bubble-icon {
  width: 30px; height: 30px; border-radius: 50%; flex-shrink: 0;
  background: var(--card); color: var(--peach-dark);
  display: flex; align-items: center; justify-content: center;
}
.bio-bubble-text { font-size: 13px; line-height: 1.55; white-space: pre-wrap; }

/* Empty reading list */
.empty-list-card {
  display: flex; flex-direction: column; align-items: center; gap: 8px;
  border: 1.5px dashed var(--border-hover); border-radius: 16px;
  padding: 24px 16px; color: var(--text-muted); font-size: 13px; font-weight: 600;
}

/* Section wrapper cho #intro-content (JS chỉ innerHTML bên trong, class ở ngoài do ta style) */
#intro-content.section-card-wrap {
  background: var(--card); border-radius: 20px;
  border: 1px solid var(--border); padding: 1.1rem 1.1rem .2rem;
  box-shadow: var(--shadow-card);
}

@media (min-width: 860px) {
  .page-wrap { max-width: 780px; }
  .pane { max-width: 780px; }
  .pane-wall-wrap { max-width: 1000px; }
  .wall-outer { max-width: 700px; margin: 0 auto; }
}

/* ── SECTION CARDS (Chỉnh sửa / Settings) ── */
.section-card {
  background: var(--card); border-radius: 20px;
  border: 1px solid var(--border); padding: 1.25rem;
  margin-bottom: 1rem;
  box-shadow: var(--shadow-card);
}
.section-title {
  font-family: 'Fredoka', sans-serif;
  font-size: 12px; font-weight: 600; color: var(--text-muted);
  text-transform: uppercase; letter-spacing: .6px;
  margin-bottom: 1rem;
}
.field { display: flex; flex-direction: column; gap: 5px; margin-bottom: .9rem; }
.field:last-child { margin-bottom: 0; }
.field label { font-size: 12px; font-weight: 700; color: var(--text-muted); }
.field input, .field textarea {
  background: var(--bg); border: 1.5px solid var(--border);
  border-radius: 12px; padding: 9px 12px;
  font-family: 'Nunito Sans', sans-serif; font-size: 14px; color: var(--text);
  outline: none; transition: border .15s; resize: none;
}
.field input:focus, .field textarea:focus { border-color: var(--peach-mid); }
.field textarea { min-height: 72px; }

.save-btn {
  width: 100%; padding: 12px; border-radius: 14px;
  background: var(--peach); border: none; cursor: pointer;
  font-family: 'Fredoka', sans-serif; font-size: 15px; font-weight: 600;
  color: #fff; margin-top: .75rem; transition: opacity .15s, transform .15s;
}
.save-btn:hover { opacity: .9; transform: translateY(-1px); }
.save-btn:disabled { opacity: .5; cursor: not-allowed; }

/* password */
.pw-section { margin-top: 1rem; }
.pw-toggle {
  background: none; border: 1.5px solid var(--border-hover);
  border-radius: 12px; padding: 8px 14px;
  font-family: 'Nunito Sans', sans-serif; font-size: 13px; font-weight: 700;
  color: var(--text-muted); cursor: pointer; transition: all .15s;
  display: flex; align-items: center; gap: 6px; width: 100%; justify-content: center;
}
.pw-toggle:hover { background: var(--peach-light); color: var(--peach-dark); border-color: var(--peach-mid); }
.pw-toggle svg { width: 14px; height: 14px; stroke: currentColor; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
.pw-fields { display: none; margin-top: .75rem; }
.pw-fields.open { display: block; }

/* danger */
.danger-btn {
  width: 100%; padding: 10px; border-radius: 12px;
  background: none; border: 1.5px solid var(--danger);
  cursor: pointer; font-family: 'Nunito Sans', sans-serif;
  font-size: 14px; font-weight: 700; color: var(--danger);
  transition: background .15s;
}
.danger-btn:hover { background: rgba(224,82,82,.08); }

/* ── TÁC PHẨM (grid — pane riêng khi bấm vào stat "Tác phẩm") ── */
.story-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
  gap: 14px;
}
.story-card {
  background: var(--card); border-radius: 16px;
  border: 1px solid var(--border); overflow: hidden;
  text-decoration: none; color: var(--text);
  display: flex; flex-direction: column;
  box-shadow: var(--shadow-card);
  transition: all .18s cubic-bezier(.4,0,.2,1);
}
.story-card:hover { border-color: var(--border-hover); transform: translateY(-3px); box-shadow: var(--shadow-card-hover); }
.story-card:active { transform: translateY(-1px) scale(.98); }
.story-cover {
  position: relative; width: 100%; padding-top: 140%;
  background: linear-gradient(145deg, var(--peach-light), #FFF6FA);
  overflow: hidden;
}
.story-cover img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; display: none; }
.story-cover.has-img img { display: block; }
.story-cover-ph { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; font-size: 36px; }
.story-cover.has-img .story-cover-ph { display: none; }
.story-ch-badge {
  position: absolute; bottom: 6px; right: 6px;
  background: rgba(0,0,0,0.52); color: #fff;
  font-size: 10px; font-weight: 800; padding: 2px 6px; border-radius: 8px;
  backdrop-filter: blur(4px);
}
.story-info { padding: 10px 11px 12px; flex: 1; display: flex; flex-direction: column; gap: 4px; }
.story-title { font-family: 'Fredoka', sans-serif; font-size: 13px; font-weight: 600; line-height: 1.35; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.story-meta { font-size: 11px; font-weight: 600; color: var(--text-muted); display: flex; align-items: center; gap: 4px; margin-top: 2px; }
.story-meta svg { width: 11px; height: 11px; stroke: currentColor; fill: none; stroke-width: 2; }

.empty-pane {
  text-align: center; padding: 3rem 1rem;
  color: var(--text-muted); font-size: 13px;
}
.empty-pane .empty-icon { font-size: 42px; margin-bottom: 10px; }

/* ── UPLOAD PROGRESS ── */
.upload-hint { font-size: 11px; color: var(--text-muted); text-align: center; margin-top: 4px; display: none; }

/* ── LOGIN WALL ── */
.login-wall {
  background: var(--card); border-radius: 24px; border: 1px solid var(--border);
  padding: 2.5rem 1.5rem; text-align: center;
  display: flex; flex-direction: column; align-items: center; gap: 1rem;
  margin: 2rem 1.25rem;
  box-shadow: var(--shadow-card);
}
.login-wall h2 { font-family: 'Fredoka', sans-serif; font-size: 17px; font-weight: 600; }
.login-wall p { font-size: 13px; color: var(--text-muted); }
.login-wall-btn {
  background: var(--peach); color: #fff; border: none;
  border-radius: 14px; padding: 10px 28px;
  font-family: 'Fredoka', sans-serif; font-size: 15px; font-weight: 600; cursor: pointer;
  transition: transform .15s, opacity .15s;
}
.login-wall-btn:hover { transform: translateY(-1px); opacity: .92; }

/* ── TOAST ── */
.toast {
  position: fixed; bottom: 88px; left: 50%;
  transform: translateX(-50%) translateY(16px);
  background: var(--text); color: var(--bg2);
  padding: 10px 20px; border-radius: 24px;
  font-family: 'Nunito Sans', sans-serif;
  font-size: 13px; font-weight: 700;
  opacity: 0; pointer-events: none;
  transition: all .25s; white-space: nowrap; z-index: 999;
}
.toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

/* ── SKELETON ── */
.skel-card { border-radius: 16px; overflow: hidden; background: var(--card); border: 1px solid var(--border); }
.skel { background: linear-gradient(90deg, var(--peach-light) 25%, #FFF6FA 50%, var(--peach-light) 75%); background-size: 200% 100%; animation: shimmer 1.4s infinite; border-radius: 6px; }
.skel-cover-sq { padding-top: 140%; }
.skel-line { height: 11px; margin: 8px 10px 4px; }
.skel-line.short { width: 55%; }
@keyframes shimmer { 0%{background-position:200% 0} 100%{background-position:-200% 0} }

/* ── THEME DRAWER ── */
.theme-drawer {
  position: fixed; top: 66px; right: 1rem; z-index: 300;
  background: var(--bg2); border: 1px solid var(--border);
  border-radius: 18px; padding: 14px 16px; width: 210px;

.theme-swatches { display: grid; grid-template-columns: repeat(4,1fr); gap: 7px; }
.swatch { width: 36px; height: 36px; border-radius: 50%; border: 3px solid transparent; cursor: pointer; transition: all .15s; }
.swatch.active { border-color: var(--peach); box-shadow: 0 0 0 2px var(--bg2), 0 0 0 4px var(--peach); }
.swatch:hover { transform: scale(1.1); }
.swatch-lbl { font-size: 9px; text-align: center; color: var(--text-muted); margin-top: 3px; font-weight: 700; }

/* ── BOTTOM NAV (mới — thuần UI tĩnh, không gắn logic) ── */

function setTheme(n,el){ document.body.className='theme-'+n; localStorage.setItem('plTheme',n); document.querySelectorAll('.swatch').forEach(s=>s.classList.remove('active')); if(el)el.classList.add('active'); }
function toggleThemeDrawer(){ document.getElementById('theme-drawer').classList.toggle('open'); }
document.addEventListener('click',e=>{ const d=document.getElementById('theme-drawer'); if(!d.contains(e.target)&&!e.target.closest('#theme-toggle-btn'))d.classList.remove('open'); });
window.addEventListener('scroll',()=>{ document.getElementById('topbar').classList.toggle('scrolled',window.scrollY>60); });

function showToast(msg){ const t=document.getElementById('toast'); t.textContent=msg; t.classList.add('show'); setTimeout(()=>t.classList.remove('show'),2200); }
function esc(s){ if(!s)return''; return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
function fmtNum(n){ if(!n)return'0'; if(n>=1000000)return(n/1e6).toFixed(1)+'M'; if(n>=1000)return(n/1000).toFixed(1)+'K'; return String(n); }
function fmtDate(d){ const dt=new Date(d); return dt.toLocaleDateString('vi-VN',{day:'numeric',month:'short',year:'numeric'})+' lúc '+dt.toLocaleTimeString('vi-VN',{hour:'2-digit',minute:'2-digit'}); }

let currentUser = null;
let profileData = null;
let profileUserId = null;
let isOwnProfile = false;
let isFollowing = false;

function switchTab(name) {
  ['intro','works','wall','settings'].forEach(t => {
    document.getElementById('tab-'+t)?.classList.toggle('active', t===name);
    document.getElementById('pane-'+t)?.classList.toggle('active', t===name);
  });
  if (name === 'wall') loadWall();
  if (name === 'works') loadWorks();
}

async function init() {
  const params = new URLSearchParams(location.search);
  const userParam = params.get('user');

  let sessionUser = null;
  try { const {data:{session}} = await sb.auth.getSession(); sessionUser = session?.user||null; } catch(e){}
  if (!sessionUser) {
    sb.auth.onAuthStateChange((ev,session) => { if(session){ currentUser=session.user; if(isOwnProfile) showOwnControls(); checkFollowing(); } });
  } else {
    currentUser = sessionUser;
  }

  if (!userParam) {
    // Own profile
    if (!currentUser) { renderLoginWall(); return; }
    profileUserId = currentUser.id;
    isOwnProfile = true;
  } else {
    profileUserId = userParam;
    isOwnProfile = currentUser && currentUser.id === profileUserId;
  }

  await loadProfile();
  loadWorks();
  if (currentUser && !isOwnProfile) checkFollowing();
  if (isOwnProfile) showOwnControls();
}

async function loadProfile() {
  const { data } = await sb.from('profiles').select('*').eq('id', profileUserId).maybeSingle();
  profileData = data || {};

  // Banner
  const bannerUrl = profileData.banner_url || profileData.avatar_url;
  if (bannerUrl) {
    const blur = document.getElementById('header-bg-blur');
    blur.style.backgroundImage = `url('${bannerUrl}')`;
    blur.style.backgroundSize = 'cover';
    blur.style.backgroundPosition = 'center';
    blur.style.filter = profileData.banner_url ? 'blur(0px) brightness(0.55)' : 'blur(22px) brightness(0.35)';
    blur.style.transform = profileData.banner_url ? 'scale(1)' : 'scale(1.15)';
  }

  // Avatar
  const avatarEl = document.getElementById('avatar-display');
  if (profileData.avatar_url) {
    avatarEl.innerHTML = `<img src="${esc(profileData.avatar_url)}" onerror="this.parentElement.textContent='🐹'">`;
  } else {
    const initials = (profileData.display_name||'?')[0].toUpperCase();
    avatarEl.textContent = initials;
  }


  document.getElementById('display-name-header').textContent = profileData.display_name || 'Người dùng';
  document.getElementById('username-header').textContent = '@' + (profileData.username || '...');
  document.getElementById('bio-header').textContent = profileData.bio ? profileData.bio.slice(0,100)+(profileData.bio.length>100?'...':'') : '';
  document.title = (profileData.display_name||'Hồ sơ') + ' — Peach Luku';

  // Stats
  const [{ count: worksCount }, { count: followersCount }] = await Promise.all([
    sb.from('stories').select('*', {count:'exact',head:true}).eq('user_id', profileUserId),
    sb.from('user_follows').select('*', {count:'exact',head:true}).eq('following_id', profileUserId),
  ]);
  document.getElementById('stat-works').textContent = fmtNum(worksCount||0);
  document.getElementById('stat-followers').textContent = fmtNum(followersCount||0);

  // Intro pane
  renderIntro();

  // Show follow button for other profiles (kể cả chưa đăng nhập)
  if (!isOwnProfile) {
    document.getElementById('follow-btn').style.display = 'inline-flex';
  }
}

function renderIntro() {
  const p = profileData;
  let html = '';

  // Bio — dạng bubble card có icon, giống mockup
  const bioText = p.bio || (isOwnProfile ? 'Nhấp vào đây để thêm một mô tả về bản thân...' : '');
  if (bioText) {
    const bioColor = p.bio ? 'var(--text)' : 'var(--text-muted)';
    const bioClickAttr = isOwnProfile ? ' onclick="openEditModal()"' : '';
    html += `<div class="bio-bubble"${bioClickAttr}>
      <span class="bio-bubble-icon"><svg viewBox="0 0 24 24" width="16" height="16" style="stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg></span>
      <span class="bio-bubble-text" style="color:${bioColor}">${esc(bioText)}</span>
    </div>`;
  }

  // Ngày tham gia
  if (p.created_at) {
    const joined = new Date(p.created_at);
    const joinStr = 'thg ' + (joined.getMonth()+1) + ' ' + joined.getFullYear();
    html += `<div style="font-size:12px;color:var(--text-muted);padding:3px 0 12px">Đã gia nhập ${joinStr}</div>`;
  }

  // Social links
  if (p.website || p.facebook) {
    html += `<div style="display:flex;flex-direction:column;gap:10px;padding:4px 0 16px;border-bottom:1px solid var(--border)">`;
    if (p.facebook) html += `<a href="${esc(p.facebook)}" target="_blank" style="display:flex;align-items:center;gap:10px;text-decoration:none;color:var(--text)">
      <div style="width:34px;height:34px;border-radius:8px;background:#1877F2;display:flex;align-items:center;justify-content:center;flex-shrink:0">
        <svg viewBox="0 0 24 24" width="17" height="17" fill="#fff"><path d="M18 2h-3a5 5 0 0 0-5 5v3H7v4h3v8h4v-8h3l1-4h-4V7a1 1 0 0 1 1-1h3z"/></svg>
      </div>
      <span style="font-size:13px;font-weight:600">${esc(p.facebook.replace(/https?:\/\/(www\.)?facebook\.com\//,''))}</span>
    </a>`;
    if (p.website) html += `<a href="${esc(p.website)}" target="_blank" style="display:flex;align-items:center;gap:10px;text-decoration:none;color:var(--text)">
      <div style="width:34px;height:34px;border-radius:8px;background:var(--peach);display:flex;align-items:center;justify-content:center;flex-shrink:0">
        <svg viewBox="0 0 24 24" width="17" height="17" stroke="#fff" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><line x1="2" y1="12" x2="22" y2="12"/><path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"/></svg>
      </div>
      <span style="font-size:13px;font-weight:600;word-break:break-all">${esc(p.website)}</span>
    </a>`;
    html += `</div>`;
  }

  // Works section
  html += `<div style="margin-top:16px;padding-bottom:16px;border-bottom:1px solid var(--border)">
    <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:10px">
      <span style="font-family:'Fredoka',sans-serif;font-size:15px;font-weight:600;color:var(--text)">Truyện của ${esc(p.username||p.display_name||'...')} <span style="color:var(--peach)">›</span></span>
      <span id="intro-works-count" style="font-size:12px;color:var(--text-muted)"></span>
    </div>
    <div id="intro-works-list"></div>
  </div>`;

  // Reading list section
  html += `<div style="margin-top:16px">
    <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:10px">
      <span style="font-family:'Fredoka',sans-serif;font-size:15px;font-weight:600;color:var(--text)">Danh sách Đọc</span>
      <button onclick="toggleReadingLists()" style="background:none;border:none;cursor:pointer;color:var(--text-muted);padding:4px">
        <svg viewBox="0 0 24 24" width="18" height="18" style="stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round"><circle cx="12" cy="12" r="1"/><circle cx="19" cy="12" r="1"/><circle cx="5" cy="12" r="1"/></svg>
      </button>
    </div>
    <div id="intro-reading-lists"></div>
  </div>`;

  // KHÔNG có nút "Chỉnh sửa hồ sơ" ở đây nữa

  document.getElementById('intro-content').innerHTML = html;
  loadIntroWorks();
  loadReadingLists();
}

async function loadIntroWorks() {
  const list = document.getElementById('intro-works-list');
  if (!list) return;
  list.innerHTML = '<div style="font-size:13px;color:var(--text-muted);padding:.5rem 0">Đang tải...</div>';
  const { data: stories } = await sb.from('stories').select('*').eq('user_id', profileUserId).order('created_at', {ascending:false});
  const countEl = document.getElementById('intro-works-count');
  if (!stories || !stories.length) {
    list.innerHTML = '<div style="font-size:13px;color:var(--text-muted);padding:.5rem 0">Chưa có tác phẩm nào</div>';
    if (countEl) countEl.textContent = '';
    return;
  }
  if (countEl) countEl.textContent = stories.length + ' Truyện Đã Đăng';

  const storyIds = stories.map(s => s.id);
  const { data: chapData } = await sb.from('chapters').select('story_id').in('story_id', storyIds).eq('is_published', true);
  const chapCount = {};
  (chapData||[]).forEach(c => { chapCount[c.story_id] = (chapCount[c.story_id]||0) + 1; });

  list.style.display = 'block';

  list.innerHTML = stories.map(s => {
    const tags = s.tags ? s.tags.split(',').map(t=>t.trim()).filter(Boolean) : [];
    const rawDesc = s.description ? s.description.replace(/<[^>]+>/g,'') : '';
    const desc = rawDesc.slice(0,90) + (rawDesc.length>90?'....':'');
    const tagHtml = tags.slice(0,3).map(t=>`<span class="story-htag">${esc(t)}</span>`).join('');
    const extraTags = tags.length > 3 ? `<span class="story-htag-more">+ ${tags.length-3} thẻ khác</span>` : '';
    return `<a class="story-hcard" href="story.html?story=${s.id}">
      <div class="story-hcover">
        ${s.cover_url ? `<img src="${esc(s.cover_url)}" onerror="this.style.display='none'" loading="lazy">` : '📖'}
      </div>
      <div class="story-hinfo">
        <div class="story-htitle-row">
          <div class="story-htitle">${esc(s.title)}</div>
          <svg class="story-hchevron" viewBox="0 0 24 24" width="16" height="16"><path d="M9 18l6-6-6-6"/></svg>
        </div>
        <div class="story-hstats">
          <span class="story-hstat"><svg viewBox="0 0 24 24"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>${fmtNum(s.total_views||0)}</span>
          <span class="story-hstat"><svg viewBox="0 0 24 24"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/></svg>${fmtNum(s.votes||0)}</span>
          <span class="story-hstat"><svg viewBox="0 0 24 24"><line x1="8" y1="6" x2="21" y2="6"/><line x1="8" y1="12" x2="21" y2="12"/><line x1="3" y1="6" x2="3.01" y2="6"/><line x1="3" y1="12" x2="3.01" y2="12"/></svg>${chapCount[s.id]||0}</span>
        </div>
        ${rawDesc ? `<div class="story-hdesc">${esc(desc)}</div>` : ''}
        ${tagHtml||extraTags ? `<div class="story-htags">${tagHtml}${extraTags ? extraTags : ''}</div>` : ''}
      </div>
    </a>`;
  }).join('');
}

async function loadReadingLists() {
  const el = document.getElementById('intro-reading-lists');
  if (!el) return;
  el.innerHTML = '<div style="font-size:13px;color:var(--text-muted)">Đang tải...</div>';

  const { data: bms } = await sb.from('bookmarks').select('list_name, story_id, stories(title,cover_url)').eq('user_id', profileUserId);
  if (!bms || !bms.length) {
    el.innerHTML = `<div class="empty-list-card">
      <svg viewBox="0 0 24 24" width="26" height="26" style="stroke:var(--peach-mid);fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/></svg>
      <span>Chưa có danh sách nào</span>
    </div>`;
    return;
  }

  // Group theo list_name
  const lists = {};
  bms.forEach(b => {
    const name = b.list_name || 'Danh sách đọc';
    if (!lists[name]) lists[name] = [];
    lists[name].push(b);
  });

  el.innerHTML = Object.entries(lists).map(([name, items]) => {
    // Hiện tối đa 3 ảnh bìa chồng nhau
    const covers = items.slice(0,3).map((b,i) => {
      const s = b.stories || {};
      return `<div style="width:44px;height:62px;border-radius:6px;overflow:hidden;background:var(--peach-light);flex-shrink:0;border:2px solid var(--bg2);margin-left:${i>0?'-14px':'0'};z-index:${3-i}">
        ${s.cover_url ? `<img src="${esc(s.cover_url)}" style="width:100%;height:100%;object-fit:cover">` : '<div style="width:100%;height:100%;display:flex;align-items:center;justify-content:center;font-size:16px">📖</div>'}
      </div>`;
    }).join('');
    return `<div style="display:flex;align-items:center;gap:14px;padding:10px 0;border-bottom:1px solid var(--border)">
      <div style="display:flex;position:relative;flex-shrink:0">${covers}</div>
      <div style="flex:1;min-width:0">
        <div style="font-family:'Fredoka',sans-serif;font-size:14px;font-weight:600;color:var(--text)">${esc(name)}</div>
        <div style="font-size:12px;color:var(--text-muted);margin-top:2px">${items.length} truyện</div>
      </div>
    </div>`;
  }).join('');
}

function toggleReadingLists() { /* placeholder cho menu options sau */ }

function openEditModal() {
  const p = profileData;
  document.getElementById('ed-name').value = p.display_name || '';
  document.getElementById('ed-username').value = p.username || '';
  document.getElementById('ed-bio').value = p.bio || '';
  const modal = document.getElementById('edit-modal');
  modal.style.display = 'flex';
  setTimeout(() => document.getElementById('edit-modal-box').style.transform = 'translateY(0)', 10);
}
function closeEditModal() {
  document.getElementById('edit-modal-box').style.transform = 'translateY(100%)';
  setTimeout(() => document.getElementById('edit-modal').style.display = 'none', 250);
}

async function loadWorks() {
  const grid = document.getElementById('works-grid');
  const { data: stories } = await sb.from('stories').select('*').eq('user_id', profileUserId).order('created_at', {ascending:false});
  if (!stories || !stories.length) {
    grid.innerHTML = '<div style="text-align:center;padding:3rem 1rem;color:var(--text-muted);font-size:13px"><div style="font-size:36px;margin-bottom:8px">📚</div>Chưa có tác phẩm nào</div>';
    return;
  }
  grid.innerHTML = stories.map(s => `
    <a class="story-card" href="story.html?story=${s.id}">
      <div class="story-cover${s.cover_url?' has-img':''}">
        <div class="story-cover-ph">📖</div>
        ${s.cover_url?`<img src="${esc(s.cover_url)}" onerror="this.style.display='none'" loading="lazy">`:''}
      </div>
      <div class="story-info">
        <div class="story-title">${esc(s.title)}</div>
        <div class="story-meta">
          <svg viewBox="0 0 24 24"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
          ${fmtNum(s.total_views||0)}
        </div>
      </div>
    </a>`).join('');
}

/* ── Wall / Hội thoại ── */
async function loadWall() {
  const list = document.getElementById('wall-list');
  list.innerHTML = '<div style="text-align:center;padding:2rem;color:var(--text-muted);font-size:13px">Đang tải...</div>';
  if (currentUser) document.getElementById('wall-compose').style.display = 'block';

  const { data: posts, error } = await sb.from('wall_posts')
    .select('*')
    .eq('profile_id', profileUserId)
    .order('created_at', {ascending:false});

  if (error) { list.innerHTML = `<div style="text-align:center;padding:2rem;color:var(--text-muted);font-size:13px">Lỗi: ${esc(error.message)}</div>`; return; }
  if (!posts || !posts.length) {
    list.innerHTML = '<div style="text-align:center;padding:3rem 1rem;color:var(--text-muted);font-size:13px"><div style="font-size:36px;margin-bottom:8px">💬</div>Chưa có tin nhắn nào</div>';
    return;
  }

  // Fetch profiles riêng
  const userIds = [...new Set(posts.map(p => p.user_id).filter(Boolean))];
  let profMap = {};
  if (userIds.length) {
    const { data: profs } = await sb.from('profiles').select('id,display_name,avatar_url,username').in('id', userIds);
    (profs||[]).forEach(p => profMap[p.id] = p);
  }

  list.style.padding = '0';
  list.style.textAlign = 'left';
  list.innerHTML = posts.map(p => {
    const pf = profMap[p.user_id] || {};
    const initials = (pf.display_name||pf.username||'?')[0].toUpperCase();
    const canDelete = currentUser && (currentUser.id === p.user_id || currentUser.id === profileUserId || ADMIN_EMAILS.includes(currentUser.email));
    return `<div class="wall-post" id="post_${p.id}">
      <div class="wall-post-header">
        <div class="wall-post-avatar">${pf.avatar_url ? `<img src="${esc(pf.avatar_url)}" onerror="this.parentElement.textContent='${initials}'">` : initials}</div>
        <div style="flex:1;min-width:0">
          <div class="wall-post-name">${esc(pf.display_name||pf.username||'Người dùng')}</div>
          <div class="wall-post-time">${fmtDate(p.created_at)}</div>
        </div>
        ${canDelete ? `<button onclick="deleteWallPost('${p.id}')" style="background:none;border:none;cursor:pointer;color:var(--text-muted);padding:5px 10px;border-radius:8px;font-size:12px;font-weight:700;font-family:'Nunito Sans',sans-serif">Xoá</button>` : ''}
      </div>
      <div class="wall-post-body">${esc(p.content)}</div>
      <div id="replies-${p.id}"></div>
      <div class="wall-replybox" id="replybox-${p.id}">
        <div class="wall-replybox-inner">
          <input id="reply-input-${p.id}" placeholder="Viết trả lời..." onkeydown="if(event.key==='Enter'&&!event.shiftKey){event.preventDefault();postReply('${p.id}')}">
          <button onclick="postReply('${p.id}')" style="background:var(--peach);color:#fff;border:none;border-radius:9px;padding:9px 15px;font-family:'Nunito Sans',sans-serif;font-size:13px;font-weight:700;cursor:pointer;flex-shrink:0">Gửi</button>
        </div>
      </div>
      <div class="wall-post-footer">
        <button onclick="toggleReplyBox('${p.id}')" style="background:none;border:none;cursor:pointer;color:var(--text-muted);font-size:13px;font-weight:600;display:flex;align-items:center;gap:6px;font-family:'Nunito Sans',sans-serif;padding:0">
          <svg viewBox="0 0 24 24" width="15" height="15" style="stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
          Trả lời
        </button>
      </div>
    </div>`;
  }).join('');
  posts.forEach(p => loadReplies(p.id));
}

function toggleReplyBox(postId) {
  const box = document.getElementById('replybox-' + postId);
  if (!box) return;
  box.classList.toggle('open');
  if (box.classList.contains('open')) document.getElementById('reply-input-' + postId)?.focus();
}

function toggleWallMenu(id) {}
function openReply(postId) { toggleReplyBox(postId); }

async function postWall() {
  const input = document.getElementById('wall-input');
  const content = input.value.trim();
  if (!content) return;
  if (!currentUser) { showToast('Đăng nhập để đăng tin!'); return; }
  const btn = input.nextElementSibling?.querySelector('button') || document.querySelector('[onclick="postWall()"]');
  const { error } = await sb.from('wall_posts').insert({ profile_id: profileUserId, user_id: currentUser.id, content });
  if (error) { showToast('Lỗi đăng tin: ' + error.message); return; }
  input.value = '';
  input.style.height = 'auto';
  showToast('Đã đăng! 🎉');
  loadWall();
}

async function deleteWallPost(id) {
  if (!confirm('Xóa tin nhắn này?')) return;
  const el = document.getElementById('post_'+id);
  if (el) { el.style.opacity='0'; el.style.transition='opacity .2s'; setTimeout(()=>el.remove(),200); }
  await sb.from('wall_posts').delete().eq('id', id);
}

async function postReply(postId) {
  const input = document.getElementById('reply-input-'+postId);
  const content = input?.value?.trim();
  if (!content || !currentUser) return;
  const { error } = await sb.from('wall_replies').insert({ post_id: postId, user_id: currentUser.id, content });
  if (error) { showToast('Lỗi gửi trả lời!'); return; }
  input.value = '';
  // Close reply box
  const box = document.getElementById('replybox-'+postId);
  if (box) box.style.display = 'none';
  // Load and show replies
  await loadReplies(postId);
  showToast('Đã gửi! 💬');
}

async function loadReplies(postId) {
  const el = document.getElementById('replies-'+postId);
  if (!el) return;
  const { data: replies } = await sb.from('wall_replies').select('*').eq('post_id', postId).order('created_at');
  if (!replies || !replies.length) { el.innerHTML = ''; return; }

  const userIds = [...new Set(replies.map(r => r.user_id).filter(Boolean))];
  let profMap = {};
  if (userIds.length) {
    const { data: profs } = await sb.from('profiles').select('id,display_name,avatar_url,username').in('id', userIds);
    (profs||[]).forEach(p => profMap[p.id] = p);
  }

  el.innerHTML = replies.map(r => {
    const pf = profMap[r.user_id]||{};
    const ini = (pf.display_name||pf.username||'?')[0].toUpperCase();
    return `<div class="wall-reply-item">
      <div class="wall-reply-avatar">${pf.avatar_url ? `<img src="${esc(pf.avatar_url)}" onerror="this.parentElement.textContent='${ini}'">` : ini}</div>
      <div style="flex:1;min-width:0">
        <div style="font-size:13px;font-weight:700;color:var(--text)">${esc(pf.display_name||pf.username||'?')}</div>
        <div style="font-size:13px;color:var(--text);margin-top:2px;line-height:1.5">${esc(r.content)}</div>
      </div>
    </div>`;
  }).join('');
}

/* ── Follow ── */
async function checkFollowing() {
  if (!currentUser || isOwnProfile) return;
  const { data } = await sb.from('user_follows').select('id').eq('follower_id', currentUser.id).eq('following_id', profileUserId).maybeSingle();
  isFollowing = !!data;
  updateFollowBtn();
}

function updateFollowBtn() {
  const btn = document.getElementById('follow-btn');
  if (!btn) return;
  if (isFollowing) {
    btn.style.background = 'var(--peach)';
    btn.style.borderColor = 'var(--peach)';
    btn.style.color = '#fff';
    btn.innerHTML = `<svg viewBox="0 0 24 24" width="14" height="14" style="stroke:#fff;fill:none;stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round"><path d="M16 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="8.5" cy="7" r="4"/><polyline points="17 11 19 13 23 9"/></svg> Đang theo dõi`;
  } else {
    btn.style.background = 'var(--peach-light)';
    btn.style.borderColor = 'var(--border)';
    btn.style.color = 'var(--peach-dark)';
    btn.innerHTML = `<svg viewBox="0 0 24 24" width="14" height="14" style="stroke:currentColor;fill:none;stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round"><path d="M16 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="8.5" cy="7" r="4"/><line x1="20" y1="8" x2="20" y2="14"/><line x1="23" y1="11" x2="17" y2="11"/></svg> Theo dõi`;
  }
}

async function toggleFollow() {
  if (!currentUser) { showToast('Đăng nhập để theo dõi!'); return; }
  if (isFollowing) {
    await sb.from('user_follows').delete().eq('follower_id', currentUser.id).eq('following_id', profileUserId);
    isFollowing = false;
  } else {
    await sb.from('user_follows').insert({ follower_id: currentUser.id, following_id: profileUserId });
    isFollowing = true;
  }
  updateFollowBtn();
  // Update count
  const { count } = await sb.from('user_follows').select('*',{count:'exact',head:true}).eq('following_id', profileUserId);
  document.getElementById('stat-followers').textContent = fmtNum(count||0);
}

function showOwnControls() {
  // Show edit button in theme drawer
  const drawerEdit = document.getElementById('drawer-edit-btn');
  if (drawerEdit) drawerEdit.style.display = 'block';
  // Bỏ nút "Chỉnh sửa hồ sơ" trong pane intro vì đã gộp vào drawer
  // Avatar edit: show only on hover
  const ring = document.getElementById('avatar-ring');
  const editLabel = document.getElementById('avatar-edit-label');
  if (ring && editLabel) {
    ring.style.cursor = 'pointer';
    ring.addEventListener('mouseenter', () => { editLabel.style.setProperty('display','flex','important'); });
    ring.addEventListener('mouseleave', () => { editLabel.style.setProperty('display','none','important'); });
    ring.addEventListener('click', () => document.getElementById('avatar-file').click());
  }
  // Chạm vào ảnh nền để đổi
  const bg = document.getElementById('header-bg-blur');
  if (bg) { bg.style.cursor = 'pointer'; bg.onclick = () => document.getElementById('banner-file').click(); }
  document.getElementById('follow-btn').style.display = 'none';
  document.getElementById('tab-settings')?.style.setProperty('display','block');
}

/* ── Save profile ── */
async function saveProfile() {
  if (!currentUser) return;
  const updates = {
    display_name: document.getElementById('ed-name')?.value?.trim(),
    username: document.getElementById('ed-username')?.value?.trim(),
    bio: document.getElementById('ed-bio')?.value?.trim(),
  };
  const { error } = await sb.from('profiles').update(updates).eq('id', currentUser.id);
  if (error) { showToast('Lỗi lưu: ' + error.message); return; }
  showToast('Đã lưu! 🐹');
  profileData = { ...profileData, ...updates };
  document.getElementById('display-name-header').textContent = updates.display_name || 'Người dùng';
  document.getElementById('username-header').textContent = '@' + (updates.username||'...');
  document.getElementById('bio-header').textContent = updates.bio ? updates.bio.slice(0,100)+(updates.bio.length>100?'...':'') : '';
  closeEditModal();
  renderIntro();
}

async function changePassword() {
  const pw = document.getElementById('pw-new')?.value;
  if (!pw || pw.length < 6) { showToast('Mật khẩu tối thiểu 6 ký tự!'); return; }
  const { error } = await sb.auth.updateUser({ password: pw });
  if (error) { showToast('Lỗi: ' + error.message); return; }
  showToast('Đổi mật khẩu thành công!');
  document.getElementById('pw-new').value = '';
}

function compressImage(file, maxDim = 600, quality = 0.8) {
  return new Promise((resolve) => {
    if (!file.type.startsWith('image/') || file.type === 'image/gif') return resolve(file);
    const img = new Image();
    const reader = new FileReader();
    reader.onload = (e) => { img.src = e.target.result; };
    img.onload = () => {
      let { width, height } = img;
      if (width > maxDim || height > maxDim) {
        if (width > height) { height = Math.round(height * maxDim / width); width = maxDim; }
        else { width = Math.round(width * maxDim / height); height = maxDim; }
      }
      const canvas = document.createElement('canvas');
      canvas.width = width; canvas.height = height;
      canvas.getContext('2d').drawImage(img, 0, 0, width, height);
      const mime = supportsWebP() ? 'image/webp' : 'image/jpeg';
      canvas.toBlob((blob) => resolve(blob || file), mime, quality);
    };
    img.onerror = () => resolve(file);
    reader.readAsDataURL(file);
  });
}
let _webpSupport = null;
function supportsWebP() {
  if (_webpSupport !== null) return _webpSupport;
  const c = document.createElement('canvas');
  c.width = c.height = 1;
  _webpSupport = c.toDataURL('image/webp').indexOf('image/webp') === 5;
  return _webpSupport;
}
function imgExtFor(blob, file) {
  if (blob.type === 'image/webp') return 'webp';
  if (blob.type === 'image/jpeg') return 'jpg';
  return (file.name.split('.').pop() || 'jpg');
}
/* ── Avatar upload ── */
document.getElementById('avatar-file').addEventListener('change', async e => {
  const file = e.target.files[0];
  if (!file || !currentUser) return;
  document.getElementById('upload-hint').style.display = 'block';
  const compressed = await compressImage(file);
  const ext = imgExtFor(compressed, file);
  const path = `avatars/${currentUser.id}/avatar_${Date.now()}.${ext}`;
  const { error: upErr } = await sb.storage.from('avatars').upload(path, compressed, { upsert: true, contentType: compressed.type || file.type, cacheControl: '31536000' });
  if (upErr) { showToast('Lỗi upload!'); document.getElementById('upload-hint').style.display='none'; return; }
  const url = sb.storage.from('avatars').getPublicUrl(path).data.publicUrl;
  await sb.from('profiles').update({ avatar_url: url }).eq('id', currentUser.id);
  document.getElementById('avatar-display').innerHTML = `<img src="${url}" style="width:100%;height:100%;object-fit:cover;border-radius:50%">`;
  document.getElementById('upload-hint').style.display = 'none';
  showToast('Đã cập nhật ảnh! 🐹');
});

/* ── Banner upload ── */
document.getElementById('banner-file').addEventListener('change', async e => {
  const file = e.target.files[0];
  if (!file || !currentUser) return;
  showToast('Đang tải ảnh nền...');
  const path = `banners/${currentUser.id}/banner_${Date.now()}`;
  const { error: upErr } = await sb.storage.from('avatars').upload(path, file, { upsert: true });
  if (upErr) { showToast('Lỗi upload!'); return; }
  const url = sb.storage.from('avatars').getPublicUrl(path).data.publicUrl;
  await sb.from('profiles').update({ banner_url: url }).eq('id', currentUser.id);
  document.getElementById('header-bg-blur').style.backgroundImage = `url('${url}')`;
  document.getElementById('header-bg-blur').style.backgroundSize = 'cover';
  document.getElementById('header-bg-blur').style.backgroundPosition = 'center';
  document.getElementById('header-bg-blur').style.filter = 'blur(0px) brightness(0.55)';
  showToast('Đã cập nhật ảnh nền! 🎨');
});

    </div>`;

}
