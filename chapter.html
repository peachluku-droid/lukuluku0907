<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

body.theme-light  { --bg:#ffffff; --bg2:#ffffff; --text:#000000; --border:#ECD8D2; --accent:#8D1B2A; --accent2:#A32637; --panel:#ffffff; --sidebar:#F8EFE7; --meta:#7B7B7B; }
body.theme-dark   { --bg:#000000; --bg2:#111111; --text:#ffffff; --border:#333333; --accent:#f4a0bc; --accent2:#ed93b1; --panel:#111111; --sidebar:#0a0a0a; --meta:#888; }
body.theme-sepia  { --bg:#f5f0e8; --bg2:#faf7f0; --text:#3d2b1f; --border:#d4c4a8; --accent:#8b5e3c; --accent2:#a67c52; --panel:#faf7f0; --sidebar:#f0e8d8; --meta:#9a8070; }
body.theme-blue   { --bg:#eef5fd; --bg2:#f6faff; --text:#1a2a4a; --border:#c8ddf5; --accent:#2a5bbf; --accent2:#4a7de0; --panel:#f6faff; --sidebar:#e2eefb; --meta:#7a9ac0; }
body.theme-purple { --bg:#f4effe; --bg2:#faf6ff; --text:#2a1a4a; --border:#e0ccf8; --accent:#6a3bbf; --accent2:#8a5de0; --panel:#faf6ff; --sidebar:#ecdffe; --meta:#9a7ac0; }
body.theme-pink   { --bg:#faedf4; --bg2:#fdf5f9; --text:#2c1a22; --border:#f0cce0; --accent:#993556; --accent2:#d4537e; --panel:#fdf5f9; --sidebar:#f5dcec; --meta:#c09aaa; }
body.theme-wattpad{ --bg:#FBF0D9; --bg2:#fdf3e0; --text:#4A3525; --border:#d9c4a0; --accent:#8b5e1a; --accent2:#b07d2e; --panel:#fdf3e0; --sidebar:#f0ddb8; --meta:#a08050; }

body {
  font-family: var(--font-body, 'Noto Serif', Georgia, serif);
  background: var(--bg); color: var(--text);
  min-height: 100vh;
  transition: background .3s, color .3s;
  font-size: var(--font-size, 17px);
}

#nav-user-btn, .user-nav-btn, .user-nav-btn-ch {
  width: 34px; height: 34px; border-radius: 50%; overflow: hidden;
  display: flex; align-items: center; justify-content: center;
  font-size: 13px; font-weight: 800; color: var(--accent); text-decoration: none;
  border: 1.5px solid var(--border); flex-shrink: 0; background: none; padding: 0; cursor: pointer;
}
#nav-user-btn img, .user-nav-btn img, .user-nav-btn-ch img {
  width: 34px; height: 34px; border-radius: 50%; object-fit: cover; display: block;
}

.site-header {
  background: var(--bg2); border-bottom: 1px solid var(--border);
  padding: 10px 16px; display: flex; align-items: center; gap: 12px;
  position: sticky; top: 0; z-index: 100;
}
.header-logo { text-decoration: none; color: var(--accent); display: flex; align-items: center; }
.header-logo svg { width: 22px; height: 22px; stroke: var(--accent); fill: none; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
.header-title { font-size: 13px; color: var(--meta); flex: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.header-tools { display: flex; align-items: center; gap: 6px; flex-shrink: 0; }
.tool-icon-btn {
  background: none; border: 1.5px solid var(--border); border-radius: 8px; padding: 5px 10px;
  cursor: pointer; color: var(--text); transition: all .15s; display: flex; align-items: center;
}
.tool-icon-btn svg { width: 18px; height: 18px; stroke: currentColor; fill: none; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
.tool-icon-btn:hover { background: var(--sidebar); }
.tool-icon-btn.active { background: var(--sidebar); border-color: var(--accent2); }

.layout { display: flex; min-height: calc(100vh - 49px); }

.toc-sidebar {
  width: 240px; background: var(--sidebar); border-right: 1px solid var(--border);
  display: flex; flex-direction: column;
  position: sticky; top: 49px; height: calc(100vh - 49px);
  overflow-y: auto; transition: width .25s, opacity .25s; flex-shrink: 0;
}
.toc-sidebar.collapsed { width: 0; opacity: 0; overflow: hidden; }
.toc-head {
  padding: 14px 16px 10px; font-size: 13px; font-weight: 700;
  color: var(--accent); border-bottom: 1px solid var(--border);
  display: flex; align-items: center; gap: 6px;
}
.toc-head svg { width: 14px; height: 14px; stroke: currentColor; fill: none; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
.toc-item {
  display: block; padding: 10px 16px; font-size: 13px; color: var(--text);
  text-decoration: none; border-bottom: 1px solid var(--border);
  transition: background .15s; line-height: 1.4;
}
.toc-item:hover { background: var(--bg2); }
.toc-item.active { background: var(--bg2); color: var(--accent); font-weight: 700; border-left: 3px solid var(--accent); }
.toc-num { font-size: 11px; color: var(--meta); display: block; margin-bottom: 2px; }

.story-col { flex: 1; padding: 32px 48px; padding-bottom: max(56px, env(safe-area-inset-bottom) + 40px); max-width: 720px; margin: 0 auto; min-width: 0; }
@media (max-width: 600px) {
  .story-col { padding: 20px 18px; padding-bottom: max(56px, env(safe-area-inset-bottom) + 40px); }
  .chapter-stats { gap: 14px; padding: 10px 16px; font-size: 12px; }
}
.chapter-heading { font-size: 24px; font-weight: 700; color: var(--accent); margin-bottom: 6px; line-height: 1.3; text-align: center; }
.chapter-meta { font-size: 13px; color: var(--meta); margin-bottom: 36px; text-align: center; }

.para-wrap {
  margin-bottom: 1em; border-radius: 8px;
  padding: 1px 0 1px 6px; transition: background .2s; overflow: hidden;
}
.para-wrap.highlighted { background: color-mix(in srgb, var(--accent) 8%, transparent); }
.para-text {
  display: block; font-weight: var(--font-weight, 400); font-style: var(--font-style, normal); line-height: 1.4;
}
.para-text * { font-family: inherit !important; font-size: inherit !important; background: transparent !important; }
.para-text p { margin: 0 0 0.3em 0; padding: 0; }
.para-text p:last-child { margin-bottom: 0; }
.para-text div { margin: 0 0 0.3em 0; }
.para-text b, .para-text strong { font-weight: 700; }
.para-text i, .para-text em { font-style: italic; }
.para-text span { white-space: pre-wrap; }
.para-text br { line-height: 1.4; }
.para-text br + br { display: none; }

/* ── FIX 1: cmt-trigger nhỏ hơn 1 size ── */
.cmt-trigger {
  float: right; clear: right;
  display: inline-flex; align-items: center; justify-content: center; gap: 3px;
  background: color-mix(in srgb, var(--text) 55%, var(--bg));
  border: none; border-radius: 6px; color: #fff;
  cursor: pointer; transition: all .15s; opacity: 0.85;
  padding: 0 6px; height: 24px;
  margin-left: 8px; margin-top: 3px; margin-right: 0;
  font-family: 'Nunito', sans-serif;
}
.cmt-trigger svg { display: inline-block; width: 12px; height: 12px; stroke: #fff; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; flex-shrink: 0; }
.cmt-trigger .cnt { font-size: 11px; font-weight: 700; line-height: 1; }
.cmt-trigger:hover { opacity: 1; background: var(--accent); }
.cmt-trigger.active { opacity: 1; background: var(--accent); }
.cmt-trigger.has-cmt { opacity: 1; background: var(--accent); }

.ic { display:inline-block; vertical-align:-3px; margin-right:4px; width:16px; height:16px; stroke:currentColor; fill:none; stroke-width:1.8; stroke-linecap:round; stroke-linejoin:round; }
.chapter-stats {
  display: flex; justify-content: center; align-items: center;
  gap: 24px; padding: 12px 0; margin-bottom: 32px; font-size: 13px; color: var(--meta); flex-wrap: wrap;
}
.chapter-stats span { white-space: nowrap; }
.cmt-stats-link {
  cursor: pointer; padding: 4px 10px; border-radius: 16px;
  transition: background .15s, color .15s; -webkit-tap-highlight-color: transparent;
}
.cmt-stats-link:hover, .cmt-stats-link:active { background: var(--bg2); color: var(--accent); }

.chapter-nav {
  display: flex; justify-content: space-between; align-items: center;
  margin-top: 48px; padding: 24px 0; border-top: 1px solid var(--border); gap: 12px;
}
.nav-btn {
  text-decoration: none; background: var(--bg2); border: 1.5px solid var(--border);
  border-radius: 20px; padding: 8px 20px; font-size: 14px;
  color: var(--accent); font-weight: 600; transition: all .15s; white-space: nowrap;
  display: flex; align-items: center; gap: 5px;
}
.nav-btn svg { width: 15px; height: 15px; stroke: currentColor; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
.nav-btn:hover { background: var(--sidebar); }
.nav-btn.disabled { opacity: 0.4; pointer-events: none; }
.nav-chapter-title { font-size: 13px; color: var(--meta); text-align: center; flex: 1; }

.end-section { margin-top: 1.4em; display: flex; flex-direction: column; gap: 20px; }
.chapter-stats-end {
  display: flex; justify-content: center; align-items: center;
  gap: 0; font-size: 13px; color: var(--meta); flex-wrap: wrap;
}
.chapter-stats-end .stat-btn {
  white-space: nowrap; background: none; border: none; font-family: inherit;
  font-size: 13px; color: var(--meta); cursor: pointer; padding: 12px 18px;
  transition: all .15s; display: flex; align-items: center; gap: 5px;
}
.chapter-stats-end .stat-btn svg { width: 15px; height: 15px; stroke: currentColor; fill: none; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
.chapter-stats-end .stat-btn:hover { background: var(--bg2); color: var(--accent); }
.chapter-stats-end .stat-btn.voted { color: var(--accent); font-weight: 700; }
.chapter-stats-end .stat-btn.voted svg { stroke: var(--accent); fill: var(--accent); }

.tts-player { display: flex; flex-direction: column; gap: 8px; }
.tts-controls { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; }
.tts-play {
  display: flex; align-items: center; gap: 7px; padding: 9px 20px; border-radius: 20px;
  border: 1.5px solid var(--accent2); background: var(--bg2);
  color: var(--accent); font-size: 13px; font-weight: 700;
  cursor: pointer; font-family: 'Nunito', sans-serif; transition: background .15s;
}
.tts-play svg { width: 14px; height: 14px; stroke: currentColor; fill: currentColor; stroke-width: 0; flex-shrink: 0; }
.tts-play:hover { background: color-mix(in srgb, var(--accent) 12%, var(--bg2)); }
.tts-speed-wrap { display: flex; align-items: center; gap: 4px; flex-wrap: wrap; }
.tts-speed-label { font-size: 11px; color: var(--meta); font-family: 'Nunito', sans-serif; margin-right: 2px; }
.tts-speed-btn {
  padding: 4px 10px; border-radius: 12px; border: 1px solid var(--border);
  background: none; color: var(--meta); font-size: 12px; font-family: 'Nunito', sans-serif; cursor: pointer; transition: all .12s;
}
.tts-speed-btn.active { border-color: var(--accent2); color: var(--accent); font-weight: 700; background: color-mix(in srgb, var(--accent) 8%, var(--bg2)); }
.tts-speed-btn:hover { color: var(--accent); border-color: var(--accent2); }

.toc-inline-section { display: none; }
.toc-empty { padding: 14px 16px; font-size: 13px; color: var(--meta); }

.cmt-overview-context {
  font-size: 11.5px; color: var(--meta); line-height: 1.5;
  margin-bottom: 4px; cursor: pointer; opacity: 0.85;
  border-left: 2px solid var(--accent2); padding-left: 8px;
  overflow: hidden; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical;
}
.cmt-overview-context:hover { opacity: 1; color: var(--accent); }

.settings-drawer {
  position: fixed; top: 49px; left: 0; right: 0; background: var(--panel);
  border-bottom: 1px solid var(--border); padding: 18px 16px 20px;
  z-index: 200; display: none; flex-direction: column; gap: 18px;
  box-shadow: 0 4px 24px rgba(0,0,0,0.10);
}
.settings-drawer.open { display: flex; }
.setting-group label { font-size: 12px; color: var(--meta); display: block; margin-bottom: 10px; }
.theme-swatches { display: flex; gap: 8px; flex-wrap: wrap; }
.swatch { width: 38px; height: 38px; border-radius: 6px; border: 2.5px solid transparent; cursor: pointer; transition: border-color .15s; flex-shrink: 0; }
.swatch.active { border-color: var(--accent) !important; }
.swatch-light  { background:#ffffff; border-color:#ccc; }
.swatch-dark   { background:#1a1a1a; }
.swatch-sepia  { background:#f5f0e8; border-color:#ddd; }
.swatch-blue   { background:#e8f0fe; border-color:#ddd; }
.swatch-purple { background:#f0ebff; border-color:#ddd; }
.swatch-pink   { background:#fff0f6; border-color:#ddd; }
.swatch-wattpad{ background:#f5e6c8; border-color:#d9c4a0; }
.fontsize-row { display: flex; gap: 8px; }
.fs-btn {
  flex: 1; padding: 12px 0; background: var(--sidebar); border: 1px solid var(--border);
  border-radius: 8px; font-size: 16px; font-weight: 600; color: var(--text);
  cursor: pointer; font-family: inherit; transition: background .15s;
}
.fs-btn:hover { background: var(--bg2); }
.font-accordion { border: 1px solid var(--border); border-radius: 10px; overflow: hidden; margin-top: 10px; }
.font-accordion-trigger {
  display: flex; align-items: center; justify-content: space-between;
  padding: 14px 16px; font-size: 16px; color: var(--accent); background: var(--bg2);
  cursor: pointer; font-weight: 600; user-select: none;
}
.font-arrow { font-size: 12px; transition: transform .2s; display: flex; align-items: center; }
.font-arrow svg { width: 12px; height: 12px; stroke: currentColor; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; transition: transform .2s; }
.font-accordion-trigger.expanded .font-arrow svg { transform: rotate(180deg); }
.font-accordion-body { display: none; flex-direction: column; border-top: 1px solid var(--border); }
.font-accordion-body.open { display: flex; }
.font-list { display: flex; flex-direction: column; }
.font-list-item {
  padding: 14px 16px; font-size: 16px; color: var(--text); background: var(--bg2);
  border-bottom: 1px solid var(--border); cursor: pointer; transition: background .15s; text-align: center;
}
.font-list-item:last-child { border-bottom: none; }
.font-list-item:hover { background: var(--sidebar); }
.font-list-item.active { color: var(--accent); background: var(--sidebar); font-weight: 600; }
.style-row { display: flex; gap: 10px; margin-top: 10px; }
.style-btn {
  flex: 1; padding: 14px 0; background: var(--sidebar); border: 1.5px solid var(--border);
  border-radius: 8px; font-size: 20px; font-weight: 700; color: var(--text);
  cursor: pointer; font-family: 'Crimson Text', serif; transition: all .15s;
}
.style-btn:hover { background: var(--bg2); }
.style-btn.active { background: var(--bg2); border-color: var(--accent); color: var(--accent); }


.cmt-sheet-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.3); z-index: 299; }
.cmt-sheet-overlay.open { display: block; }
.cmt-sheet {
  position: fixed; inset: 0; background: #fff; z-index: 300;
  display: flex; flex-direction: column; height: 100vh; height: 100dvh;
  transform: translateX(100%); transition: transform .28s cubic-bezier(.32,1,.4,1);
}
body.theme-dark .cmt-sheet { background: var(--panel); }
.cmt-sheet.open { transform: translateX(0); }
.cmt-sheet-handle { display: none; }
.cmt-sheet-header {
  display: flex; align-items: center; justify-content: space-between;
  padding: 14px 16px; flex-shrink: 0; border-bottom: 1px solid var(--border);
  padding-top: max(14px, env(safe-area-inset-top));
}
.cmt-sheet-title { font-size: 16px; font-weight: 700; color: var(--accent); }
.cmt-sheet-close {
  background: none; border: none; cursor: pointer; color: var(--meta);
  padding: 6px 8px; border-radius: 8px; display: flex; align-items: center;
}
.cmt-sheet-close svg { width: 20px; height: 20px; stroke: currentColor; fill: none; stroke-width: 2.2; stroke-linecap: round; }
.cmt-sheet-close:hover { background: var(--sidebar); }
.cmt-para-quote {
  padding: 12px 18px; background: color-mix(in srgb, var(--accent) 6%, var(--bg2));
  border-left: 3px solid var(--accent); margin: 0 16px; border-radius: 0 8px 8px 0;
  font-size: 13.5px; line-height: 1.7; color: var(--text); font-style: italic;
  max-height: 90px; overflow: hidden;
  display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical;
  flex-shrink: 0; display: none;
}
.cmt-para-quote.visible { display: -webkit-box; margin-top: 12px; }
.cmt-sheet-list { flex: 1; overflow-y: auto; padding: 8px 16px; display: flex; flex-direction: column; gap: 0; }
.cmt-sheet-back {
  background: none; border: none; cursor: pointer; color: var(--text);
  padding: 6px; border-radius: 8px; display: flex; align-items: center; flex-shrink: 0;
}
.cmt-sheet-back svg { width: 20px; height: 20px; stroke: currentColor; fill: none; stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; }
.cmt-sheet-back:hover { background: var(--sidebar); }
.cmt-sheet-overview { flex: 1; overflow-y: auto; padding: 12px 16px; }
.cmt-sheet-detail { flex: 1; display: flex; flex-direction: column; min-height: 0; }
.cmt-bubble { display: flex; gap: 10px; padding: 12px 0; border-bottom: 1px solid var(--border); }
.cmt-bubble:last-child { border-bottom: none; }
.cmt-avatar { width: 38px; height: 38px; border-radius: 50%; color: #fff; display: flex; align-items: center; justify-content: center; font-size: 15px; font-weight: 700; flex-shrink: 0; font-family: 'Nunito', sans-serif; }
.cmt-body { flex: 1; min-width: 0; }
.cmt-user { font-size: 13px; font-weight: 700; color: var(--text); margin-bottom: 2px; font-family: 'Nunito', sans-serif; }
.cmt-content { font-size: 14px; line-height: 1.6; word-break: break-word; color: var(--text); font-family: 'Nunito', sans-serif; }
.cmt-footer { display: flex; align-items: center; gap: 12px; margin-top: 5px; }
.cmt-time { font-size: 11px; color: var(--meta); font-family: 'Nunito', sans-serif; }
.cmt-reply-btn { font-size: 12px; font-weight: 700; color: var(--accent); background: none; border: none; cursor: pointer; padding: 0; font-family: 'Nunito', sans-serif; }
.empty-msg { text-align: center; font-size: 13px; color: var(--meta); padding: 28px 12px; line-height: 1.8; font-family: 'Nunito', sans-serif; }
.cmt-sheet-input { padding: 10px 16px 20px; border-top: 1px solid var(--border); display: flex; flex-direction: column; gap: 6px; flex-shrink: 0; }
.sheet-emoji-row { display: flex; align-items: center; gap: 6px; }
.sheet-emoji-btn {
  background: var(--sidebar); border: 1.5px solid var(--border);
  border-radius: 8px; padding: 5px 9px; cursor: pointer; display: flex; align-items: center;
}
.sheet-emoji-btn svg svg { width: 17px; height: 17px; stroke: currentColor; fill: none; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
.sheet-emoji-picker { display: none; flex-wrap: wrap; gap: 2px; padding: 8px; border: 1.5px solid var(--border); border-radius: 10px; background: var(--bg2); max-height: 130px; overflow-y: auto; }
.sheet-emoji-picker.open { display: flex; }
.ep-label { width: 100%; font-size: 10px; color: var(--meta); padding: 4px 2px 2px; font-weight: 700; text-transform: uppercase; }
.ep-emoji { font-size: 19px; background: none; border: none; cursor: pointer; border-radius: 6px; padding: 3px 4px; line-height: 1; }
.ep-emoji:hover { background: var(--sidebar); }
.cmt-reply-tag {
  display: inline-flex; align-items: center; gap: 3px;
  background: color-mix(in srgb, var(--accent) 12%, var(--bg2));
  color: var(--accent); font-size: 12px; font-weight: 700;
  border-radius: 10px; padding: 1px 8px; margin-right: 4px;
  font-family: 'Nunito', sans-serif; cursor: pointer;
}
.cmt-reply-tag:hover { background: color-mix(in srgb, var(--accent) 20%, var(--bg2)); }
.reply-hint-bar {
  display: none; align-items: center; gap: 6px; padding: 5px 12px;
  background: color-mix(in srgb, var(--accent) 8%, var(--bg2));
  border-radius: 8px; font-size: 12px; color: var(--meta); font-family: 'Nunito', sans-serif;
}
.reply-hint-bar.visible { display: flex; }
.reply-hint-bar strong { color: var(--accent); }
.reply-hint-cancel { margin-left: auto; background: none; border: none; color: var(--meta); cursor: pointer; font-size: 15px; padding: 0 2px; line-height: 1; }
.sheet-input-bar { display: flex; align-items: center; gap: 8px; background: #fff; border: 1.5px solid var(--border); border-radius: 30px; padding: 6px 6px 6px 14px; }
.sheet-input-bar:focus-within { border-color: var(--accent); }
body.theme-dark .sheet-input-bar { background: var(--bg2); }
.sheet-text-inline { flex: 1; border: none; background: transparent; font-size: 14px; color: var(--text); font-family: 'Nunito', sans-serif; outline: none; min-height: 20px; max-height: 80px; resize: none; }
.sheet-send-inline {
  background: var(--accent); border: none; border-radius: 50%; width: 34px; height: 34px;
  display: flex; align-items: center; justify-content: center; cursor: pointer; flex-shrink: 0; transition: opacity .15s;
}
.sheet-send-inline svg { width: 15px; height: 15px; stroke: white; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
.sheet-send-inline:disabled { opacity: .4; cursor: not-allowed; }
.lightbox { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.85); z-index: 999; align-items: center; justify-content: center; }
.lightbox.open { display: flex; }
.lightbox img { max-width: 90vw; max-height: 90vh; border-radius: 12px; }
.lightbox-close {
  position: absolute; top: 20px; right: 24px; color: white; cursor: pointer;
  background: rgba(0,0,0,0.4); border: none; border-radius: 50%;
  width: 36px; height: 36px; display: flex; align-items: center; justify-content: center;
}
.lightbox-close svg { width: 18px; height: 18px; stroke: white; fill: none; stroke-width: 2.5; stroke-linecap: round; }
.para-skeleton { display: flex; flex-direction: column; gap: 24px; }
.skel-para { display: flex; flex-direction: column; gap: 8px; }
.skel-line { height: 14px; border-radius: 6px; background: linear-gradient(90deg, var(--border) 25%, color-mix(in srgb, var(--accent) 6%, var(--bg2)) 50%, var(--border) 75%); background-size: 200% 100%; animation: shimmer 1.4s infinite; }
@keyframes shimmer { 0%{background-position:200% 0} 100%{background-position:-200% 0} }
</style>

<script>
const SUPABASE_URL = 'https://jnlqzqtavfptkfvnndxq.supabase.co'
const SUPABASE_KEY = 'sb_publishable_ojRrfSwxK_B6-TGSXaYGxQ_DKERN0-f'
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY)

const params       = new URLSearchParams(location.search)
const STORY_ID     = params.get('story')
const CHAPTER_UUID = params.get('chapter') || null

if (!STORY_ID || !params.get('chapter')) {
  document.body.innerHTML = `<div style="display:flex;flex-direction:column;align-items:center;justify-content:center;height:100vh;text-align:center;padding:2rem;gap:12px">
    <svg viewBox="0 0 24 24" width="52" height="52" style="stroke:#d4537e;fill:none;stroke-width:1.3;stroke-linecap:round;stroke-linejoin:round"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>
    <div style="font-size:17px;font-weight:800">Thiếu thông tin chương</div>
    <div style="font-size:13px;color:#aaa">Vui lòng truy cập từ trang truyện</div>
    <a href="index.html" style="margin-top:8px;padding:10px 24px;background:#d4537e;color:white;border-radius:24px;text-decoration:none;font-weight:700;font-size:13px">Về trang chủ</a>
  </div>`
}

const FONTS = [
  { key: 'Noto Serif',       label: 'Mặc định'    },
  { key: 'Nunito',           label: 'Nunito'      },
  { key: 'Lora',             label: 'Lora'        },
  { key: 'Playfair Display', label: 'Playfair'    },
  { key: 'Source Sans 3',    label: 'Source Sans' },
  { key: 'Source Code Pro',  label: 'Monospace'   },
]
let fontIdx = 0, fontSize = 17

function setTheme(t, el) {
  document.body.className = 'theme-' + t
  document.querySelectorAll('.swatch').forEach(s => s.classList.remove('active'))
  el.classList.add('active')
  localStorage.setItem('plChTheme', t)
}
function changeFontSize(delta) {
  fontSize = Math.min(24, Math.max(13, fontSize + delta))
  document.body.style.setProperty('--font-size', fontSize + 'px')
  localStorage.setItem('plChFontSize', fontSize)
}
function setFont(idx, el) {
  fontIdx = idx
  document.body.style.setProperty('--font-body', FONTS[idx].key)
  document.querySelectorAll('.font-list-item').forEach(b => b.classList.remove('active'))
  el.classList.add('active')
  localStorage.setItem('plChFontIdx', idx)
  const label = document.getElementById('font-trigger-label')
  if (label) { label.textContent = FONTS[idx].label; label.style.fontFamily = "'" + FONTS[idx].key + "'" }
  document.getElementById('font-accordion-body')?.classList.remove('open')
  document.getElementById('font-accordion-trigger')?.classList.remove('expanded')
}
function toggleFontAccordion() {
  document.getElementById('font-accordion-body').classList.toggle('open')
  document.getElementById('font-accordion-trigger').classList.toggle('expanded')
}
function toggleBold(btn) {
  const on = btn.classList.toggle('active')
  document.body.style.setProperty('--font-weight', on ? '700' : '400')
  localStorage.setItem('plChBold', on ? '1' : '0')
}
function toggleItalic(btn) {
  const on = btn.classList.toggle('active')
  document.body.style.setProperty('--font-style', on ? 'italic' : 'normal')
  localStorage.setItem('plChItalic', on ? '1' : '0')
}
function restoreSettings() {
  const theme  = localStorage.getItem('plChTheme') || localStorage.getItem('plTheme') || 'light'
  fontSize     = parseInt(localStorage.getItem('plChFontSize') || '17')
  fontIdx      = parseInt(localStorage.getItem('plChFontIdx')  || '0')
  const bold   = localStorage.getItem('plChBold')   === '1'
  const italic = localStorage.getItem('plChItalic') === '1'
  document.body.className = 'theme-' + theme
  document.body.style.setProperty('--font-size',   fontSize + 'px')

const AVATAR_COLORS = ['#d4537e','#5b9bd5','#71c285','#e8a838','#9b7fe8','#e87878']
function avatarColorFor(id) {
  const s = String(id||'')
  let hash = 0
  for (let i = 0; i < s.length; i++) { hash = (hash * 31 + s.charCodeAt(i)) | 0 }
  return AVATAR_COLORS[Math.abs(hash) % AVATAR_COLORS.length]
}
function stripHtml(html) {
  const tmp = document.createElement('div'); tmp.innerHTML = html; return tmp.textContent || ''
}
function escapeHtml(str) {
  if (!str) return ''; const d = document.createElement('div'); d.textContent = str; return d.innerHTML
}
function jsEscape(str) {
  return String(str||'').replace(/\\/g,'\\\\').replace(/'/g,"\\'").replace(/\n/g,'\\n')
}
function formatTime(iso) {
  const diff = Math.floor((Date.now() - new Date(iso)) / 1000)
  if (diff < 60) return 'vừa xong'
  if (diff < 3600) return Math.floor(diff/60) + ' phút trước'
  if (diff < 86400) return Math.floor(diff/3600) + ' giờ trước'
  return Math.floor(diff/86400) + ' ngày trước'
}
function formatViews(n) {
  if (n >= 1e6) return (n/1e6).toFixed(1)+'M'
  if (n >= 1000) return (n/1000).toFixed(1)+'K'
  return String(n)
}

let _ttsWatchdog = null
function _startTtsWatchdog() {
  clearInterval(_ttsWatchdog)
  _ttsWatchdog = setInterval(() => {
    if (!speechSynthesis.speaking) { clearInterval(_ttsWatchdog); _ttsWatchdog = null; return }
    speechSynthesis.pause(); speechSynthesis.resume()
  }, 10000)
}
function _stopTtsWatchdog() { clearInterval(_ttsWatchdog); _ttsWatchdog = null }

function _ttsSpeak(text) {
  const utt = new SpeechSynthesisUtterance(text)
  utt.lang = 'vi-VN'
  utt.rate = _ttsRate
  const voices = speechSynthesis.getVoices()
  const viVoice = voices.find(v => v.lang.startsWith('vi'))
  if (viVoice) utt.voice = viVoice
  _ttsActive = true
  _ttsSetUi(true)
  utt.onstart = () => { _ttsActive = true; _ttsSetUi(true) }
  utt.onend   = () => { _ttsActive = false; _ttsSetUi(false); _stopTtsWatchdog() }
  utt.onerror = () => { _ttsActive = false; _ttsSetUi(false); _stopTtsWatchdog() }
  speechSynthesis.speak(utt)
  _startTtsWatchdog()
}

function _ttsSetUi(playing) {

      ? `<svg viewBox="0 0 24 24"><rect x="6" y="4" width="4" height="16"/><rect x="14" y="4" width="4" height="16"/></svg><span>Dừng đọc</span>`

function renderParagraphs(content) {
  const container = document.getElementById('paragraphs-container')
  if (!content || !content.trim()) {
    container.innerHTML = '<p style="color:var(--meta);font-size:14px;text-align:center;padding:2rem">Chương này chưa có nội dung.</p>'
    return
  }
  const isHtml = /<[a-z][\s\S]*>/i.test(content)
  content = content.replace(/<img(?![^>]*loading=)/gi, '<img loading="lazy" decoding="async"')
  let paragraphs = []
  if (isHtml) {
    const tmp = document.createElement('div'); tmp.innerHTML = content
    const blocks = []
    Array.from(tmp.childNodes).forEach(node => {
      if (node.nodeType === Node.TEXT_NODE) {
        const text = node.textContent.trim(); if (text) blocks.push({ type:'text', content:text })
      } else if (node.nodeType === Node.ELEMENT_NODE) {
        const plain = node.textContent.replace(/\u00a0/g,'').trim()
        if (plain || node.tagName === 'IMG') blocks.push({ type:'html', content:node.outerHTML })
      }
    })
    if (!blocks.length) blocks.push({ type:'html', content })
    paragraphs = blocks
  } else {
    paragraphs = content.split(/\n\n+|\n/).map(s=>s.trim()).filter(Boolean).map(l=>({type:'text',content:l}))
  }
  if (!paragraphs.length) {
    container.innerHTML = '<p style="color:var(--meta);font-size:14px;text-align:center;padding:2rem">Chương này chưa có nội dung.</p>'
    return
  }
  const seenPid = new Set()
  container.innerHTML = paragraphs.map((block, i) => {
    let pid = null
    if (block.type === 'html') { const m = block.content.match(/data-pid="([^"]+)"/); if (m) pid = m[1] }
    if (!pid) {
      const plain = block.type === 'html'
        ? (() => { const d = document.createElement('div'); d.innerHTML = block.content; return d.textContent })()
        : block.content
      pid = 'h' + paraHash(plain) + '_' + (i+1)
    }
    let uniquePid = pid, dupCount = 1
    while (seenPid.has(uniquePid)) { uniquePid = pid + '_' + (++dupCount) }
    seenPid.add(uniquePid); pid = uniquePid
    const rendered = block.type === 'html' ? block.content : escapeHtml(block.content)
    return `
    <div class="para-wrap" data-pid="${pid}">
      <button class="cmt-trigger" data-pid="${pid}"><svg viewBox="0 0 24 24"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg><span class="cnt">+</span></button>
      <div class="para-text">${rendered}</div>
    </div>`
  }).join('')
  document.querySelectorAll('.cmt-trigger').forEach(btn => {
    btn.addEventListener('click', e => {
      e.stopPropagation()
      const pid = btn.dataset.pid
      document.querySelectorAll('.para-wrap').forEach(el => el.classList.remove('highlighted'))
      document.querySelectorAll('.cmt-trigger').forEach(b => b.classList.remove('active'))
      document.querySelector(`.para-wrap[data-pid="${pid}"]`)?.classList.add('highlighted')
      btn.classList.add('active')
      openCmtSheet(pid)
    })
  })
}

;(function setupSwipeChapterNav() {
  let startY = null, startTime = 0, startedAtTop = false, startedAtBottom = false
  const EDGE_MARGIN = 160
  document.addEventListener('touchstart', e => {
    if (e.touches.length !== 1) return
    startY = e.touches[0].clientY; startTime = Date.now()
    const sc = document.scrollingElement || document.documentElement
    startedAtTop    = sc.scrollTop <= EDGE_MARGIN
    startedAtBottom = sc.scrollTop + sc.clientHeight >= sc.scrollHeight - EDGE_MARGIN
  }, { passive: true })
  document.addEventListener('touchend', e => {
    if (startY === null) return
    const deltaY = e.changedTouches[0].clientY - startY
    const elapsed = Date.now() - startTime; startY = null
    if (elapsed > 600 || Math.abs(deltaY) / elapsed < 0.3 || Math.abs(deltaY) < 50) return
    const sc = document.scrollingElement || document.documentElement
    const atTop    = sc.scrollTop <= EDGE_MARGIN
    const atBottom = sc.scrollTop + sc.clientHeight >= sc.scrollHeight - EDGE_MARGIN
    const btnPrev = document.getElementById('btn-prev')
    const btnNext = document.getElementById('btn-next')
    if (deltaY > 0 && (startedAtTop||atTop) && btnPrev && !btnPrev.classList.contains('disabled') && btnPrev.href !== '#')
      location.href = btnPrev.href
    else if (deltaY < 0 && (startedAtBottom||atBottom) && btnNext && !btnNext.classList.contains('disabled') && btnNext.href !== '#')
      location.href = btnNext.href
  }, { passive: true })
})()

async function fetchCommentsWithProfiles(query) {

  if (error) { console.error('LOAD CMT ERROR:', error); return { data: null, error } }

  const userIds = [...new Set(comments.map(c => c.user_id).filter(Boolean))]
  let profilesMap = {}
  if (userIds.length) {
    const { data: profiles } = await sb.from('profiles').select('id, display_name, avatar_url').in('id', userIds)
    if (profiles) profiles.forEach(p => { profilesMap[p.id] = p })

  return { data: comments.map(c => ({ ...c, profiles: profilesMap[c.user_id]||null })), error: null }
}

let _webpSupport = null
function supportsWebP() {
  if (_webpSupport !== null) return _webpSupport
  const c = document.createElement('canvas'); c.width = c.height = 1
  _webpSupport = c.toDataURL('image/webp').indexOf('image/webp') === 5; return _webpSupport
}
function compressImage(file, maxDim=1000, quality=0.8) {
  return new Promise(resolve => {
    if (!file.type.startsWith('image/') || file.type === 'image/gif') return resolve(file)
    const img = new Image(), reader = new FileReader()
    reader.onload = e => { img.src = e.target.result }
    img.onload = () => {
      let { width, height } = img
      if (width > maxDim || height > maxDim) {
        if (width > height) { height = Math.round(height*maxDim/width); width = maxDim }
        else { width = Math.round(width*maxDim/height); height = maxDim }
      }
      const canvas = document.createElement('canvas'); canvas.width = width; canvas.height = height
      canvas.getContext('2d').drawImage(img, 0, 0, width, height)
      const mime = supportsWebP() ? 'image/webp' : 'image/jpeg'
      canvas.toBlob(blob => resolve(blob||file), mime, quality)
    }
    img.onerror = () => resolve(file); reader.readAsDataURL(file)
  })
}
function imgExtFor(blob, file) {
  if (blob.type==='image/webp') return 'webp'; if (blob.type==='image/jpeg') return 'jpg'
  return file.name.split('.').pop() || 'jpg'
}

function setChapterMeta(ch, storyTitle, storyCover) {
  const canonicalUrl = 'https://peachluku.com/chapter.html?story='+encodeURIComponent(STORY_ID)+'&chapter='+encodeURIComponent(ch.id)
  const chTitle = 'Chương ' + ch.chapter_number + (ch.title ? ' — ' + ch.title : '')
  const pageTitle = chTitle + ' · ' + (storyTitle || 'Peach Luku')
  const tmp = document.createElement('div'); tmp.innerHTML = ch.content||''
  const desc = (tmp.textContent||'').replace(/\s+/g,' ').trim().slice(0,160) || 'Đọc truyện online tại Peach Luku'
  document.title = pageTitle
  if (window.PlSEO) {
    PlSEO.updateMeta({ title:pageTitle.replace(' — Peach Luku','').replace(' · Peach Luku',''), description:desc, image:storyCover||undefined, url:canonicalUrl, type:'article' })
    PlSEO.injectChapterJsonLd(ch, storyTitle, storyCover, STORY_ID)
  } else {
    const _m = (k,v) => { const el=document.querySelector('[property="'+k+'"]')||document.querySelector('[name="'+k+'"]'); if(el) el.setAttribute('content',v) }
    _m('description',desc); _m('og:title',pageTitle); _m('og:description',desc); _m('og:url',canonicalUrl)
    _m('twitter:title',pageTitle); _m('twitter:description',desc)
  }
}
