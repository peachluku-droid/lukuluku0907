<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Chỉnh Sửa Truyện — Peach Luku</title>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&family=Noto+Serif:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
/* ── VARIABLES ── */
:root {
  --peach: #e8835a; --peach-light: #fdf0ea; --peach-dark: #c96b3f;
  --bg: #f9f9f9; --bg2: #ffffff; --card: #ffffff;
  --text: #1a1a1a; --text-muted: #888; --border: #e8e8e8;
  --sidebar-w: 260px;
}

* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; }
body { font-family: 'Nunito', sans-serif; background: var(--bg); color: var(--text); }

/* ── TOPBAR ── */
.topbar {
  height: 52px; background: #fff; border-bottom: 1px solid var(--border);
  display: flex; align-items: center; justify-content: space-between;
  padding: 0 16px; position: fixed; top: 0; left: 0; right: 0; z-index: 100;
}
.topbar-left { display: flex; align-items: center; gap: 10px; }
.topbar-logo { font-size: 16px; font-weight: 900; color: var(--peach); text-decoration: none; }
.story-select {
  font-family: 'Nunito', sans-serif; font-size: 13px; font-weight: 700;
  border: 1.5px solid var(--border); border-radius: 8px; padding: 5px 10px;
  background: var(--bg); color: var(--text); outline: none; cursor: pointer;
  max-width: 200px;
}
.topbar-right { display: flex; align-items: center; gap: 8px; }
.btn {
  font-family: 'Nunito', sans-serif; font-size: 13px; font-weight: 800;
  border: none; border-radius: 8px; padding: 7px 14px; cursor: pointer;
  display: flex; align-items: center; gap: 5px; text-decoration: none;
  transition: all .15s;
}
.btn svg { width: 14px; height: 14px; stroke: currentColor; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
.btn-ghost { background: none; color: var(--text-muted); border: 1.5px solid var(--border); }
.btn-ghost:hover { background: var(--peach-light); color: var(--peach); border-color: var(--peach); }
.btn-primary { background: var(--peach); color: #fff; }
.btn-primary:hover { background: var(--peach-dark); }
.btn-success { background: #1fba52; color: #fff; }
.btn-success:hover { background: #18a046; }
.save-status { font-size: 11px; color: var(--text-muted); font-weight: 600; }
.new-story-btn {
  width: 32px; height: 32px; border-radius: 50%; background: var(--peach);
  color: #fff; border: none; cursor: pointer; font-size: 20px; font-weight: 300;
  display: flex; align-items: center; justify-content: center;
  transition: background .15s;
}
.new-story-btn:hover { background: var(--peach-dark); }

/* ── LAYOUT ── */
.app { display: flex; padding-top: 52px; height: 100vh; }

/* ── SIDEBAR ── */
.sidebar {
  width: var(--sidebar-w); flex-shrink: 0;
  background: #fff; border-right: 1px solid var(--border);
  overflow-y: auto; display: flex; flex-direction: column;
  height: 100%;
}
.sidebar-tabs {
  display: flex; border-bottom: 1px solid var(--border); flex-shrink: 0;
}
.sidebar-tab {
  flex: 1; padding: 12px 8px; font-size: 12px; font-weight: 800;
  text-align: center; cursor: pointer; color: var(--text-muted);
  border-bottom: 2px solid transparent; transition: all .15s;
}
.sidebar-tab.active { color: var(--peach); border-bottom-color: var(--peach); }
.sidebar-pane { display: none; flex-direction: column; flex: 1; }
.sidebar-pane.active { display: flex; }

/* Info pane */
.info-pane { padding: 16px; gap: 16px; overflow-y: auto; }
.cover-area {
  display: flex; align-items: center; gap: 12px;
  padding-bottom: 16px; border-bottom: 1px solid var(--border);
}
.cover-thumb {
  width: 72px; height: 96px; border-radius: 6px; object-fit: cover;
  background: var(--peach-light); border: 1.5px solid var(--border);
  flex-shrink: 0; cursor: pointer; overflow: hidden;
  display: flex; align-items: center; justify-content: center;
}
.cover-thumb img { width: 100%; height: 100%; object-fit: cover; }
.cover-thumb svg { width: 24px; height: 24px; stroke: var(--peach); fill: none; stroke-width: 1.5; }
.cover-label { font-size: 12px; color: var(--text-muted); font-weight: 600; cursor: pointer; }
.cover-label:hover { color: var(--peach); }

.info-field { display: flex; flex-direction: column; gap: 5px; }
.info-label { font-size: 11px; font-weight: 800; color: var(--text); text-transform: uppercase; letter-spacing: .3px; }
.info-input, .info-textarea, .info-select {
  font-family: 'Nunito', sans-serif; font-size: 13px; color: var(--text);
  border: none; border-bottom: 1.5px solid var(--border); background: none;
  padding: 6px 0; outline: none; transition: border .15s; width: 100%;
}
.info-input:focus, .info-textarea:focus, .info-select:focus { border-bottom-color: var(--peach); }
.info-input::placeholder, .info-textarea::placeholder { color: var(--text-muted); }
.info-textarea { resize: none; min-height: 80px; line-height: 1.5; }
.info-select { cursor: pointer; background: none; }
.tag-input-wrap { display: flex; flex-wrap: wrap; gap: 5px; align-items: center; border-bottom: 1.5px solid var(--border); padding-bottom: 6px; }
.tag-chip { background: var(--peach-light); color: var(--peach-dark); font-size: 11px; font-weight: 800; padding: 3px 8px; border-radius: 20px; display: flex; align-items: center; gap: 4px; }
.tag-chip button { background: none; border: none; cursor: pointer; color: var(--peach-dark); font-size: 13px; line-height: 1; padding: 0; }
.tag-inp { border: none; outline: none; font-family: 'Nunito', sans-serif; font-size: 12px; min-width: 80px; background: none; color: var(--text); }
.info-save-btn {
  margin-top: 4px; width: 100%; padding: 10px; border: none; border-radius: 10px;
  background: var(--peach); color: #fff; font-family: 'Nunito', sans-serif;
  font-size: 13px; font-weight: 800; cursor: pointer; transition: background .15s;
}
.info-save-btn:hover { background: var(--peach-dark); }

/* Chapters pane */
.ch-pane { overflow-y: auto; }
.ch-pane-head { padding: 10px 12px; border-bottom: 1px solid var(--border); flex-shrink: 0; }
.new-ch-btn {
  width: 100%; padding: 8px; border: 1.5px dashed var(--peach);
  border-radius: 8px; background: var(--peach-light); color: var(--peach);
  font-family: 'Nunito', sans-serif; font-size: 12px; font-weight: 800;
  cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 5px;
  transition: all .15s;
}
.new-ch-btn:hover { background: var(--peach); color: #fff; }
.new-ch-btn svg { width: 14px; height: 14px; stroke: currentColor; fill: none; stroke-width: 2.5; stroke-linecap: round; stroke-linejoin: round; }
.ch-list { flex: 1; overflow-y: auto; }
.ch-item {
  display: flex; align-items: center; gap: 8px;
  padding: 10px 12px; border-bottom: 1px solid var(--border);
  cursor: pointer; transition: background .12s;
}
.ch-item:hover { background: var(--peach-light); }
.ch-item.active { background: #fff8f5; border-left: 3px solid var(--peach); }
.ch-num { font-size: 10px; color: var(--text-muted); font-weight: 700; width: 28px; flex-shrink: 0; }
.ch-name { flex: 1; font-size: 12px; font-weight: 700; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.ch-badge { font-size: 9px; font-weight: 800; padding: 2px 6px; border-radius: 10px; flex-shrink: 0; }
.ch-badge.pub { background: #e6f9ee; color: #1fba52; }
.ch-badge.draft { background: var(--peach-light); color: var(--peach); }
.ch-empty { padding: 20px 12px; text-align: center; font-size: 12px; color: var(--text-muted); }

/* ── MAIN EDITOR ── */
.main { flex: 1; display: flex; flex-direction: column; min-width: 0; overflow: hidden; }
.editor-empty-state {
  flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center;
  gap: 10px; color: var(--text-muted);
}
.editor-empty-state svg { width: 52px; height: 52px; stroke: var(--border); fill: none; stroke-width: 1.3; stroke-linecap: round; stroke-linejoin: round; }
.editor-empty-state h3 { font-size: 15px; font-weight: 800; color: var(--text); }
.editor-empty-state p { font-size: 13px; }

.editor-wrap { flex: 1; display: none; flex-direction: column; overflow: hidden; min-height: 0; height: 100%; }
.editor-wrap.show { display: flex; min-height: 0; }
.ch-title-input {
  font-family: 'Noto Serif', Georgia, serif; font-size: 20px; font-weight: 700;
  border: none; border-bottom: 1.5px solid var(--border); padding: 14px 24px 12px;
  outline: none; background: #fff; color: var(--text); width: 100%;
  transition: border .15s;
}
.ch-title-input:focus { border-bottom-color: var(--peach); }
.ch-title-input::placeholder { color: var(--text-muted); font-weight: 400; }

/* Toolbar */
.toolbar {
  border-top: 1px solid var(--border);
  background: #fff;
  flex-shrink: 0;
  box-shadow: 0 -2px 12px rgba(0,0,0,0.07);
}
.toolbar-toggle {
  display: flex; align-items: center; justify-content: flex-end;
  padding: 2px 10px 0;
}
.toolbar-toggle-btn {
  background: #222; border: none; cursor: pointer;
  padding: 3px 10px 3px 8px; border-radius: 6px 6px 0 0;
  color: #fff; font-size: 12px; font-weight: 700;
  display: flex; align-items: center; gap: 4px; transition: background .15s;
  line-height: 1;
}
.toolbar-toggle-btn:hover { background: #000; }
.toolbar-toggle-btn .tb-arrow { transition: transform .2s; display: inline-block; }
.toolbar-toggle-btn.collapsed .tb-arrow { transform: rotate(90deg); }
.toolbar-inner {
  display: flex; align-items: center; gap: 2px;
  padding: 6px 16px 8px; flex-wrap: wrap;
  transition: all .2s;
}
.toolbar-inner.hidden { display: none; }
.tb-btn {
  background: none; border: none; cursor: pointer;
  padding: 5px 8px; border-radius: 6px; color: var(--text-muted);
  font-family: 'Nunito', sans-serif; font-size: 13px; font-weight: 700;
  display: flex; align-items: center; gap: 4px; transition: all .12s;
}
.tb-btn:hover { background: var(--peach-light); color: var(--peach); }
.tb-btn svg { width: 15px; height: 15px; stroke: currentColor; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
.tb-sep { width: 1px; height: 20px; background: var(--border); margin: 0 4px; }
.tb-align { font-size: 11px; }

/* Content */
.content-scroll { flex: 1; overflow-y: auto; background: #fff; padding: 0; min-height: 0; }
.content-editable {
  font-family: 'Noto Serif', Georgia, serif; font-size: 16px; line-height: 1.9;
  color: var(--text); min-height: calc(100vh - 200px); width: 100%; box-sizing: border-box;
  background: #fff; padding: 20px 16px;
  outline: none;
}
.content-editable:empty::before { content: attr(data-ph); color: var(--text-muted); font-style: italic; }
.content-editable p { margin-bottom: 0.8em; }
.content-editable hr { border: none; border-top: 2px solid var(--peach-light); margin: 2rem auto; width: 50%; }

/* Bottom bar */
.bottom-bar {
  display: flex; align-items: center; justify-content: space-between;
  padding: 8px 24px; border-top: 1px solid var(--border);
  background: #fff; font-size: 11px; color: var(--text-muted); font-weight: 600;
}
.bottom-actions { display: flex; gap: 8px; align-items: center; }

/* ── AUTH GATE ── */
.auth-gate {
  position: fixed; inset: 0; background: var(--bg);
  display: flex; align-items: center; justify-content: center; z-index: 999;
}
.auth-box {
  background: #fff; border-radius: 16px; padding: 32px 28px;
  width: 360px; box-shadow: 0 8px 40px rgba(0,0,0,0.1); text-align: center;
}
.auth-box h2 { font-size: 18px; font-weight: 900; margin: 8px 0 4px; }
.auth-box p { font-size: 13px; color: var(--text-muted); margin-bottom: 20px; }
.inp {
  width: 100%; padding: 10px 14px; border: 1.5px solid var(--border);
  border-radius: 10px; font-family: 'Nunito', sans-serif; font-size: 13px;
  color: var(--text); background: var(--bg); outline: none; margin-bottom: 10px;
  transition: border .15s;
}
.inp:focus { border-color: var(--peach); }
.auth-err { font-size: 12px; color: #e84040; margin-bottom: 8px; min-height: 16px; }

/* ── MODAL TẠO TRUYỆN ── */
.modal-overlay {
  position: fixed; inset: 0; z-index: 500;
  background: rgba(0,0,0,0.45); backdrop-filter: blur(4px);
  display: none; align-items: center; justify-content: center; padding: 20px;
}
.modal-overlay.open { display: flex; }
.modal {
  background: #fff; border-radius: 18px; width: 100%; max-width: 420px;
  box-shadow: 0 20px 60px rgba(0,0,0,0.18); overflow: hidden;
  animation: modalIn .2s ease;
}
@keyframes modalIn { from { opacity:0; transform:translateY(12px); } to { opacity:1; transform:translateY(0); } }
.modal-head {
  padding: 16px 20px; border-bottom: 1px solid var(--border);
  display: flex; align-items: center; justify-content: space-between;
}
.modal-head h3 { font-size: 15px; font-weight: 900; }
.modal-close { background: none; border: none; cursor: pointer; font-size: 18px; color: var(--text-muted); padding: 0; }
.modal-body { padding: 20px; display: flex; flex-direction: column; gap: 14px; }
.modal-label { font-size: 11px; font-weight: 800; text-transform: uppercase; letter-spacing: .3px; margin-bottom: 5px; display: block; }
.modal-input, .modal-textarea {
  width: 100%; padding: 10px 14px; border: 1.5px solid var(--border);
  border-radius: 10px; font-family: 'Nunito', sans-serif; font-size: 13px;
  color: var(--text); background: var(--bg); outline: none; transition: border .15s;
}
.modal-input:focus, .modal-textarea:focus { border-color: var(--peach); }
.modal-textarea { resize: vertical; min-height: 80px; }
.modal-footer { padding: 0 20px 20px; display: flex; gap: 8px; }
.modal-cancel { flex-shrink: 0; padding: 10px 16px; border: 1.5px solid var(--border); border-radius: 10px; background: none; font-family: 'Nunito', sans-serif; font-size: 13px; font-weight: 700; color: var(--text-muted); cursor: pointer; }
.modal-submit { flex: 1; padding: 10px; border: none; border-radius: 10px; background: var(--peach); color: #fff; font-family: 'Nunito', sans-serif; font-size: 14px; font-weight: 800; cursor: pointer; transition: background .15s; }
.modal-submit:hover { background: var(--peach-dark); }

/* Toast */
.toast {
  position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%) translateY(60px);
  background: #333; color: #fff; padding: 10px 20px; border-radius: 20px;
  font-size: 13px; font-weight: 700; z-index: 999; opacity: 0;
  transition: all .25s; white-space: nowrap; pointer-events: none;
}
.toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
.toast.ok { background: #1fba52; }
.toast.err { background: #e84040; }

@media (max-width: 640px) {
  .sidebar { position: fixed; left: -260px; top: 52px; bottom: 0; z-index: 50; transition: left .2s; box-shadow: 4px 0 20px rgba(0,0,0,0.12); }
  .sidebar.open { left: 0; }
  .story-select { max-width: 120px; font-size: 12px; }
}
</style>
</head>
<body>

<!-- AUTH GATE -->
<div class="auth-gate" id="authGate" style="display:none">
  <div class="auth-box">
    <div style="font-size:40px">🐹</div>
    <h2>Bạn chưa đăng nhập</h2>
    <p>Chỉ tác giả mới có thể chỉnh sửa truyện</p>
    <a class="btn btn-primary" style="width:100%;justify-content:center;text-decoration:none" id="authGateLink" href="auth.html">Đăng nhập</a>
  </div>
</div>

<!-- TOPBAR -->
<div class="topbar">
  <div class="topbar-left">
    <button class="btn btn-ghost" id="menuBtn" style="padding:6px 8px;display:none" onclick="toggleSidebar()">
      <svg viewBox="0 0 24 24"><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
    </button>
    <a class="topbar-logo" href="index.html">Peach Luku</a>
    <select class="story-select" id="storySelect" onchange="onStoryChange()">
      <option value="">-- Chọn truyện --</option>
    </select>
    <button class="new-story-btn" onclick="openNewStoryModal()" title="Tạo truyện mới">+</button>
  </div>
  <div class="topbar-right">
    <span class="save-status" id="saveStatus"></span>
    <button class="btn btn-ghost" onclick="saveDraft()">
      <svg viewBox="0 0 24 24"><path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"/><polyline points="17 21 17 13 7 13 7 21"/><polyline points="7 3 7 8 15 8"/></svg>
      Lưu
    </button>
    <button class="btn btn-success" onclick="publishChapter()">
      <svg viewBox="0 0 24 24"><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></svg>
      Đăng
    </button>
  </div>
</div>

<!-- APP -->
<div class="app" id="app" style="display:none">

  <!-- SIDEBAR -->
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-tabs">
      <div class="sidebar-tab active" onclick="switchSideTab('info',this)">📖 Truyện</div>
      <div class="sidebar-tab" onclick="switchSideTab('chapters',this)">📄 Chương</div>
    </div>

    <!-- INFO PANE -->
    <div class="sidebar-pane active info-pane" id="pane-info">
      <!-- Bìa -->
      <div class="cover-area">
        <div class="cover-thumb" id="coverThumb" onclick="document.getElementById('coverInput').click()">
          <svg viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><polyline points="21 15 16 10 5 21"/></svg>
        </div>
        <input type="file" id="coverInput" accept="image/*" style="display:none" onchange="previewCover(this)">
        <span class="cover-label" onclick="document.getElementById('coverInput').click()">Sửa Bìa Truyện</span>
      </div>

      <div class="info-field">
        <div class="info-label">Tiêu Đề Truyện</div>
        <input class="info-input" id="storyTitle" placeholder="Tên truyện..." maxlength="200">
      </div>

      <div class="info-field">
        <div class="info-label">Mô Tả Truyện</div>
        <textarea class="info-textarea" id="storyDesc" placeholder="Tác giả, tình trạng edit, tóm tắt..." rows="5"></textarea>
      </div>

      <div class="info-field">
        <div class="info-label">Thẻ</div>
        <div class="tag-input-wrap" id="tagWrap">
          <input class="tag-inp" id="tagInp" placeholder="Thêm thẻ..." onkeydown="handleTagKey(event)">
        </div>
      </div>

      <div class="info-field">
        <div class="info-label">Thể Loại Truyện</div>
        <select class="info-select" id="storyGenre">
          <option value="">-- Chọn thể loại --</option>
          <option>Lãng mạn</option>
          <option>Đam mỹ</option>
          <option>Hành động</option>
          <option>Kỳ huyễn</option>
          <option>Đô thị</option>
          <option>Hài hước</option>
          <option>Kinh dị</option>
          <option>Xuyên không</option>
          <option>Khác</option>
        </select>
      </div>

      <div class="info-field">
        <div class="info-label">Tình Trạng</div>
        <select class="info-select" id="storyStatus">
          <option value="ongoing">Đang ra</option>
          <option value="completed">Hoàn thành</option>
        </select>
      </div>

      <button class="info-save-btn" onclick="saveStoryInfo()">Lưu thông tin</button>
    </div>

    <!-- CHAPTERS PANE -->
    <div class="sidebar-pane ch-pane" id="pane-chapters">
      <div class="ch-pane-head">
        <button class="new-ch-btn" onclick="newChapter()">
          <svg viewBox="0 0 24 24"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
          Chương mới
        </button>
      </div>
      <div class="ch-list" id="chList">
        <div class="ch-empty">Chưa có chương nào</div>
      </div>
    </div>
  </aside>

  <!-- MAIN -->
  <main class="main">
    <div class="editor-empty-state" id="editorEmpty">
      <svg viewBox="0 0 24 24"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/></svg>
      <h3>Chọn hoặc tạo chương mới</h3>
      <p>Chọn truyện → tab Chương → bắt đầu viết 🐹</p>
    </div>

    <div class="editor-wrap" id="editorWrap">
      <input class="ch-title-input" id="chTitle" placeholder="Tên chương..." maxlength="200">

      <div class="content-scroll">
        <div class="content-editable" id="chContent" contenteditable="true"
          data-ph="Bắt đầu viết chương tại đây... 🐹"
          oninput="onContentInput()"></div>
      </div>

      <!-- Toolbar -->
      <div class="toolbar">
        <div class="toolbar-toggle">
          <button class="toolbar-toggle-btn collapsed" id="tbToggleBtn" onclick="toggleToolbar()" title="Ẩn/hiện toolbar">
            <span class="tb-arrow">▶</span> Định dạng
          </button>
        </div>
        <div class="toolbar-inner hidden" id="toolbarInner">
        <button class="tb-btn" onclick="fmt('bold')" title="In đậm"><b>B</b></button>
        <button class="tb-btn" onclick="fmt('italic')" title="In nghiêng"><i>I</i></button>
        <button class="tb-btn" onclick="fmt('underline')" title="Gạch chân"><u>U</u></button>
        <div class="tb-sep"></div>
        <button class="tb-btn tb-align" onclick="fmt('justifyLeft')" title="Căn trái">
          <svg viewBox="0 0 24 24"><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="15" y2="12"/><line x1="3" y1="18" x2="18" y2="18"/></svg>
        </button>
        <button class="tb-btn tb-align" onclick="fmt('justifyCenter')" title="Căn giữa">
          <svg viewBox="0 0 24 24"><line x1="3" y1="6" x2="21" y2="6"/><line x1="6" y1="12" x2="18" y2="12"/><line x1="4" y1="18" x2="20" y2="18"/></svg>
        </button>
        <button class="tb-btn tb-align" onclick="fmt('justifyRight')" title="Căn phải">
          <svg viewBox="0 0 24 24"><line x1="3" y1="6" x2="21" y2="6"/><line x1="9" y1="12" x2="21" y2="12"/><line x1="6" y1="18" x2="21" y2="18"/></svg>
        </button>
        <div class="tb-sep"></div>
        <button class="tb-btn" onclick="insertHR()" title="Ngăn cách">— Ngăn cách</button>
        <button class="tb-btn" onclick="insertNote()" title="Ghi chú tác giả">
          <svg viewBox="0 0 24 24"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
          Ghi chú
        </button>
        <div class="tb-sep"></div>
        <button class="tb-btn" onclick="insertImage()" title="Chèn ảnh">
          <svg viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><polyline points="21 15 16 10 5 21"/></svg>
          Ảnh
        </button>
        <button class="tb-btn" onclick="insertVideo()" title="Chèn video">
          <svg viewBox="0 0 24 24"><polygon points="23 7 16 12 23 17 23 7"/><rect x="1" y="5" width="15" height="14" rx="2"/></svg>
          Video
        </button>
        <button class="tb-btn" onclick="insertYoutube()" title="Chèn YouTube">
          <svg viewBox="0 0 24 24"><path d="M22.54 6.42a2.78 2.78 0 0 0-1.95-1.96C18.88 4 12 4 12 4s-6.88 0-8.59.46A2.78 2.78 0 0 0 1.46 6.42 29 29 0 0 0 1 12a29 29 0 0 0 .46 5.58A2.78 2.78 0 0 0 3.41 19.6C5.12 20 12 20 12 20s6.88 0 8.59-.46a2.78 2.78 0 0 0 1.95-1.95A29 29 0 0 0 23 12a29 29 0 0 0-.46-5.58z"/><polygon points="9.75 15.02 15.5 12 9.75 8.98 9.75 15.02" fill="#fff"/></svg>
          YouTube
        </button>
        <div class="tb-sep"></div>
        <button class="tb-btn" onclick="clearFormat()" title="Xóa định dạng">
          <svg viewBox="0 0 24 24"><path d="M22 3H7l-4 18h3l1-4h10l1 4h3L22 3z"/><line x1="4" y1="21" x2="20" y2="3"/></svg>
        </button>
      </div>
      </div>

      <div class="bottom-bar">
        <span id="wordCount">0 từ</span>
        <div class="bottom-actions">
          <button class="btn btn-ghost" onclick="saveDraft()">
            <svg viewBox="0 0 24 24"><path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"/><polyline points="17 21 17 13 7 13 7 21"/><polyline points="7 3 7 8 15 8"/></svg>
            Lưu bản thảo
          </button>
          <button class="btn btn-success" onclick="publishChapter()">
            <svg viewBox="0 0 24 24"><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></svg>
            Đăng chương
          </button>
        </div>
      </div>
    </div>
  </main>
</div>

<!-- MODAL TẠO TRUYỆN MỚI -->
<div class="modal-overlay" id="newStoryModal">
  <div class="modal">
    <div class="modal-head">
      <h3>Tạo truyện mới</h3>
      <button class="modal-close" onclick="closeNewStoryModal()">✕</button>
    </div>
    <div class="modal-body">
      <div>
        <label class="modal-label">Tiêu đề truyện *</label>
        <input class="modal-input" id="newStoryTitle" placeholder="Tên truyện...">
      </div>
      <div>
        <label class="modal-label">Tác giả</label>
        <input class="modal-input" id="newStoryAuthor" placeholder="Tên tác giả gốc...">
      </div>
      <div>
        <label class="modal-label">Mô tả ngắn</label>
        <textarea class="modal-textarea" id="newStoryDesc" placeholder="Mô tả truyện..."></textarea>
      </div>
    </div>
    <div class="modal-footer">
      <button class="modal-cancel" onclick="closeNewStoryModal()">Huỷ</button>
      <button class="modal-submit" onclick="createStory()">Tạo truyện</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
const SUPABASE_URL = 'https://jnlqzqtavfptkfvnndxq.supabase.co';
const SUPABASE_KEY = 'sb_publishable_ojRrfSwxK_B6-TGSXaYGxQ_DKERN0-f';
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

const ADMIN_EMAILS = ['peachluku@gmail.com'];

let currentUser = null;
let currentStoryId = null;
let currentChapterId = null;
let isDirty = false;
let autoSaveTimer = null;
let storyTags = [];
let coverFile = null;

// ── AUTH ──
async function init() {
  const { data: { session } } = await sb.auth.getSession();
  if (session) {
    currentUser = session.user;
    showApp();
  } else {
    // Chưa đăng nhập
    const nextUrl = encodeURIComponent(location.pathname + location.search);
    document.getElementById('authGateLink').href = 'auth.html?next=' + nextUrl;
    document.getElementById('authGate').style.display = 'flex';
  }
  // Kiểm tra ?story= param
  const params = new URLSearchParams(location.search);
  const storyParam = params.get('story');
  if (storyParam && currentUser) {
    await loadStories();
    document.getElementById('storySelect').value = storyParam;
    await onStoryChange();
  }
}

async function isStoryOwner(userId) {
  const { data } = await sb.from('stories').select('id').eq('user_id', userId).limit(1);
  return data && data.length > 0;
}

function showApp() {
  document.getElementById('authGate').style.display = 'none';
  document.getElementById('app').style.display = 'flex';
  document.getElementById('menuBtn').style.display = 'flex';
  loadStories();
}

// ── STORIES ──
async function loadStories() {
  let query = sb.from('stories').select('id, title, user_id').order('created_at', { ascending: false });
  if (ADMIN_EMAILS.includes(currentUser?.email)) {
    // Admin xem tất cả truyện
  } else {
    // Tác giả chỉ thấy truyện của mình
    query = query.eq('user_id', currentUser.id);
  }
  const { data } = await query;
  if (!data) return;
  const sel = document.getElementById('storySelect');
  const cur = sel.value;
  sel.innerHTML = '<option value="">-- Chọn truyện --</option>';
  data.forEach(s => {
    const opt = document.createElement('option');
    opt.value = s.id; opt.textContent = s.title;
    sel.appendChild(opt);
  });
  if (cur) sel.value = cur;
}

async function onStoryChange() {
  currentStoryId = document.getElementById('storySelect').value;
  if (!currentStoryId) return;
  await Promise.all([loadStoryInfo(), loadChapterList()]);
}

async function loadStoryInfo() {
  const { data } = await sb.from('stories').select('*').eq('id', currentStoryId).single();
  if (!data) return;
  document.getElementById('storyTitle').value = data.title || '';
  document.getElementById('storyDesc').value = data.description || '';
  document.getElementById('storyGenre').value = data.genre || '';
  document.getElementById('storyStatus').value = data.status || 'ongoing';
  // Tags
  storyTags = data.genre ? [] : [];
  if (data.tags) {
    try { storyTags = typeof data.tags === 'string' ? data.tags.split(',').map(t=>t.trim()).filter(Boolean) : data.tags; } catch{}
  }
  renderTags();
  // Cover
  if (data.cover_url) {
    document.getElementById('coverThumb').innerHTML = `<img src="${data.cover_url}" alt="">`;
  }
}

async function saveStoryInfo() {
  if (!currentStoryId) { showToast('Chọn truyện trước!', 'err'); return; }
  const title = document.getElementById('storyTitle').value.trim();
  const description = document.getElementById('storyDesc').value.trim();
  const genre = document.getElementById('storyGenre').value;
  const status = document.getElementById('storyStatus').value;
  if (!title) { showToast('Nhập tiêu đề truyện!', 'err'); return; }

  let cover_url = undefined;
  if (coverFile) {
    const ext = coverFile.name.split('.').pop();
    const path = `covers/${currentStoryId}_${Date.now()}.${ext}`;
    const { error: upErr } = await sb.storage.from('avatars').upload(path, coverFile, { upsert: true });
    if (!upErr) cover_url = sb.storage.from('avatars').getPublicUrl(path).data.publicUrl;
    coverFile = null;
  }

  const payload = { title, description, genre, status, tags: storyTags.join(','), updated_at: new Date().toISOString() };
  if (cover_url) payload.cover_url = cover_url;

  const { error } = await sb.from('stories').update(payload).eq('id', currentStoryId);
  if (error) { showToast('Lưu thất bại: ' + error.message, 'err'); return; }
  showToast('Đã lưu thông tin truyện! ✓', 'ok');
  loadStories();
}

async function createStory() {
  const title = document.getElementById('newStoryTitle').value.trim();
  const author = document.getElementById('newStoryAuthor').value.trim();
  const description = document.getElementById('newStoryDesc').value.trim();
  if (!title) { showToast('Nhập tên truyện!', 'err'); return; }
  const { data, error } = await sb.from('stories').insert({
    title, author, description,
    user_id: currentUser.id,
    created_at: new Date().toISOString(),
    updated_at: new Date().toISOString(),
  }).select().single();
  if (error) { showToast('Tạo thất bại: ' + error.message, 'err'); return; }
  closeNewStoryModal();
  await loadStories();
  document.getElementById('storySelect').value = data.id;
  await onStoryChange();
  showToast('Đã tạo truyện! 🎉', 'ok');
}

function openNewStoryModal() { document.getElementById('newStoryModal').classList.add('open'); }
function closeNewStoryModal() {
  document.getElementById('newStoryModal').classList.remove('open');
  ['newStoryTitle','newStoryAuthor','newStoryDesc'].forEach(id => document.getElementById(id).value = '');
}

// ── TAGS ──
function renderTags() {
  const wrap = document.getElementById('tagWrap');
  const inp = document.getElementById('tagInp');
  wrap.innerHTML = '';
  storyTags.forEach((tag, i) => {
    const chip = document.createElement('span');
    chip.className = 'tag-chip';
    chip.innerHTML = `${tag}<button onclick="removeTag(${i})">×</button>`;
    wrap.appendChild(chip);
  });
  wrap.appendChild(inp);
  inp.focus();
}
function handleTagKey(e) {
  const inp = document.getElementById('tagInp');
  if ((e.key === 'Enter' || e.key === ',') && inp.value.trim()) {
    e.preventDefault();
    const tag = inp.value.trim().replace(/,/g,'').toLowerCase();
    if (tag && !storyTags.includes(tag)) { storyTags.push(tag); renderTags(); }
    else inp.value = '';
  } else if (e.key === 'Backspace' && !inp.value && storyTags.length) {
    storyTags.pop(); renderTags();
  }
}
function removeTag(i) { storyTags.splice(i, 1); renderTags(); }

// ── COVER ──
function previewCover(input) {
  const file = input.files[0];
  if (!file) return;
  coverFile = file;
  const url = URL.createObjectURL(file);
  document.getElementById('coverThumb').innerHTML = `<img src="${url}" alt="">`;
}

// ── CHAPTERS ──
async function loadChapterList() {
  if (!currentStoryId) return;
  const { data } = await sb.from('chapters').select('id, title, chapter_number, is_published')
    .eq('story_id', currentStoryId).order('chapter_number', { ascending: true });
  const list = document.getElementById('chList');
  if (!data || !data.length) { list.innerHTML = '<div class="ch-empty">Chưa có chương nào</div>'; return; }
  list.innerHTML = data.map(ch => `
    <div class="ch-item ${ch.id === currentChapterId ? 'active' : ''}" onclick="openChapter('${ch.id}')">
      <span class="ch-num">Ch.${ch.chapter_number}</span>
      <span class="ch-name">${escH(ch.title || 'Chưa đặt tên')}</span>
      <span class="ch-badge ${ch.is_published ? 'pub' : 'draft'}">${ch.is_published ? 'Đã đăng' : 'Thảo'}</span>
    </div>`).join('');
}

async function openChapter(id) {
  if (isDirty && !confirm('Có thay đổi chưa lưu. Tiếp tục?')) return;
  currentChapterId = id;
  const { data } = await sb.from('chapters').select('*').eq('id', id).single();
  if (!data) return;
  document.getElementById('chTitle').value = data.title || '';
  document.getElementById('chContent').innerHTML = data.content || '';
  showEditor();
  updateWordCount();
  loadChapterList();
  closeSidebar();
}

function newChapter() {
  if (!currentStoryId) { showToast('Chọn truyện trước!', 'err'); return; }
  if (isDirty && !confirm('Có thay đổi chưa lưu. Tiếp tục?')) return;
  currentChapterId = null;
  document.getElementById('chTitle').value = '';
  document.getElementById('chContent').innerHTML = '';
  showEditor();
  document.getElementById('chTitle').focus();
  closeSidebar();
}

// ── SAVE / PUBLISH ──
async function saveDraft() {
  const { data: { session } } = await sb.auth.getSession();
  if (!session) { showToast('Phiên hết hạn, tải lại trang!', 'err'); return; }
  if (!currentStoryId) { showToast('Chọn truyện trước!', 'err'); return; }
  const title = document.getElementById('chTitle').value.trim();
  const content = document.getElementById('chContent').innerHTML;
  setSaveStatus('Đang lưu...');
  if (currentChapterId) {
    const { error } = await sb.from('chapters').update({ title, content, updated_at: new Date().toISOString() }).eq('id', currentChapterId);
    if (error) { showToast('Lưu thất bại!', 'err'); setSaveStatus(''); return; }
  } else {
    const { data: existing } = await sb.from('chapters').select('chapter_number').eq('story_id', currentStoryId).order('chapter_number', { ascending: false }).limit(1);
    const nextNum = existing?.length ? existing[0].chapter_number + 1 : 1;
    const { data, error } = await sb.from('chapters').insert({
      story_id: currentStoryId, title, content,
      chapter_number: nextNum, is_published: false, user_id: session.user.id
    }).select().single();
    if (error) { showToast('Lưu thất bại: ' + error.message, 'err'); setSaveStatus(''); return; }
    currentChapterId = data.id;
  }
  isDirty = false;
  setSaveStatus('Đã lưu ✓');
  showToast('Đã lưu bản thảo!', 'ok');
  loadChapterList();
  return true;
}

async function publishChapter() {
  if (!confirm('Đăng chương này lên? Độc giả sẽ thấy ngay.')) return;
  const saved = await saveDraft();
  if (!saved || !currentChapterId) return;
  const { error } = await sb.from('chapters').update({ is_published: true }).eq('id', currentChapterId);
  if (error) { showToast('Đăng thất bại!', 'err'); return; }
  showToast('Đã đăng chương! 🎉', 'ok');
  loadChapterList();
}

// ── EDITOR TOOLS ──
function fmt(cmd) { document.execCommand(cmd, false, null); document.getElementById('chContent').focus(); }
function clearFormat() { document.execCommand('removeFormat', false, null); }
function insertHR() {
  document.getElementById('chContent').focus();
  document.execCommand('insertHTML', false, '<hr><br>');
}
function toggleToolbar() {
  const inner = document.getElementById('toolbarInner');
  const btn = document.getElementById('tbToggleBtn');
  inner.classList.toggle('hidden');
  btn.classList.toggle('collapsed');
}

function insertImage() {
  const input = document.createElement('input');
  input.type = 'file'; input.accept = 'image/*';
  input.onchange = async (e) => {
    const file = e.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = (ev) => {
      document.execCommand('insertHTML', false,
        `<br><img src="${ev.target.result}" style="max-width:100%;border-radius:8px;display:block;margin:12px auto;" /><br>`);
    };
    reader.readAsDataURL(file);
  };
  input.click();
}

function insertVideo() {
  const input = document.createElement('input');
  input.type = 'file'; input.accept = 'video/*';
  input.onchange = (e) => {
    const file = e.target.files[0];
    if (!file) return;
    const url = URL.createObjectURL(file);
    document.execCommand('insertHTML', false,
      `<br><video controls src="${url}" style="max-width:100%;border-radius:8px;display:block;margin:12px auto;"></video><br>`);
  };
  input.click();
}

function insertYoutube() {
  const url = prompt('Dán link YouTube vào đây:');
  if (!url) return;
  let id = '';
  const m = url.match(/(?:youtube\.com\/watch\?v=|youtu\.be\/)([^&\s]+)/);
  if (m) id = m[1];
  if (!id) { alert('Link YouTube không hợp lệ!'); return; }
  document.execCommand('insertHTML', false,
    `<br><div style="position:relative;padding-bottom:56.25%;height:0;overflow:hidden;border-radius:8px;margin:12px 0;">
      <iframe src="https://www.youtube.com/embed/${id}" style="position:absolute;top:0;left:0;width:100%;height:100%;border:0;" allowfullscreen></iframe>
    </div><br>`);
}

function insertNote() {
  document.getElementById('chContent').focus();
  document.execCommand('insertHTML', false, '<div style="background:#FEF0E9;border-left:3px solid #E8835A;padding:10px 14px;border-radius:0 10px 10px 0;margin:12px 0;font-size:14px;font-style:italic;color:#9A7A6A"><b>📝 Ghi chú:</b> </div><br>');
}
function onContentInput() {
  isDirty = true; setSaveStatus('Chưa lưu'); updateWordCount();
  clearTimeout(autoSaveTimer);
  autoSaveTimer = setTimeout(saveDraft, 15000);
}
function updateWordCount() {
  const text = document.getElementById('chContent').innerText || '';
  const words = text.trim() ? text.trim().split(/\s+/).length : 0;
  document.getElementById('wordCount').textContent = `${words.toLocaleString()} từ`;
}

// ── UI HELPERS ──
function switchSideTab(name, el) {
  document.querySelectorAll('.sidebar-tab').forEach(t => t.classList.remove('active'));
  document.querySelectorAll('.sidebar-pane').forEach(p => p.classList.remove('active'));
  el.classList.add('active');
  document.getElementById('pane-' + name).classList.add('active');
}
function showEditor() {
  document.getElementById('editorEmpty').style.display = 'none';
  document.getElementById('editorWrap').classList.add('show');
}
function setSaveStatus(txt) { document.getElementById('saveStatus').textContent = txt; }
function showToast(msg, type = '') {
  const t = document.getElementById('toast');
  t.textContent = msg; t.className = `toast ${type} show`;
  setTimeout(() => t.classList.remove('show'), 2500);
}
function escH(s) { return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
function toggleSidebar() { document.getElementById('sidebar').classList.toggle('open'); }
function closeSidebar() {
  if (window.innerWidth <= 640) document.getElementById('sidebar').classList.remove('open');
}

// Phím tắt Ctrl+S
document.addEventListener('keydown', e => {
  if ((e.ctrlKey || e.metaKey) && e.key === 's') { e.preventDefault(); saveDraft(); }
});
document.getElementById('passInp')?.addEventListener('keydown', e => { if (e.key === 'Enter') doLogin(); });

// Click ngoài modal
document.getElementById('newStoryModal').addEventListener('click', e => {
  if (e.target === document.getElementById('newStoryModal')) closeNewStoryModal();
});

init();
</script>
</body>
</html>
