<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Viết Truyện — Peach Luku</title>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&family=Pacifico&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --peach: #E8835A; --peach-light: #FEF0E9; --peach-mid: #F2A882;
  --peach-dark: #B85B30;
  --bg: #FDF6F2; --bg2: #ffffff;
  --card: #ffffff; --text: #2C1A0E; --text-muted: #9A7A6A;
  --border: rgba(232,131,90,0.18); --border-hover: #F2A882;
  --danger: #e53935; --success: #43a047;
}
body.dark {
  --bg: #1a1a1a; --bg2: #242424; --card: #242424;
  --text: #F0D8C8; --text-muted: #A08070;
  --border: rgba(242,168,130,0.15); --border-hover: #C87050;
  --peach-light: #2A1A0E;
}

body { font-family: 'Nunito', sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; }

/* ── TOPBAR ── */
.topbar {
  background: var(--bg2); border-bottom: 1px solid var(--border);
  padding: 0 1.25rem; height: 56px;
  display: flex; align-items: center; justify-content: space-between;
  position: sticky; top: 0; z-index: 100;
}
.logo { font-family: 'Pacifico', cursive; font-size: 18px; color: var(--peach); text-decoration: none; }
.topbar-right { display: flex; align-items: center; gap: 8px; }
.btn {
  font-family: 'Nunito', sans-serif; font-weight: 700; font-size: 13px;
  padding: 7px 16px; border-radius: 20px; border: none; cursor: pointer;
  transition: all .15s; display: inline-flex; align-items: center; gap: 6px;
}
.btn-ghost { background: transparent; color: var(--text-muted); border: 1.5px solid var(--border-hover); }
.btn-ghost:hover { background: var(--peach-light); color: var(--peach-dark); }
.btn-primary { background: var(--peach); color: white; }
.btn-primary:hover { background: var(--peach-dark); }
.btn-success { background: var(--success); color: white; }
.btn-success:hover { filter: brightness(0.9); }
.btn svg { width: 14px; height: 14px; stroke: currentColor; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; flex-shrink: 0; }

/* ── AUTH GATE ── */
#auth-gate {
  display: flex; align-items: center; justify-content: center;
  min-height: calc(100vh - 56px); padding: 2rem;
}
.auth-box {
  background: var(--card); border: 1px solid var(--border);
  border-radius: 20px; padding: 2rem; width: 100%; max-width: 360px;
  text-align: center;
}
.auth-box h2 { font-size: 20px; font-weight: 800; margin-bottom: 6px; }
.auth-box p { font-size: 13px; color: var(--text-muted); margin-bottom: 1.5rem; }
.inp {
  width: 100%; padding: 10px 14px; border-radius: 12px;
  border: 1.5px solid var(--border-hover); background: var(--bg);
  color: var(--text); font-family: 'Nunito', sans-serif; font-size: 13px;
  font-weight: 600; outline: none; margin-bottom: 10px;
  transition: border .15s;
}
.inp:focus { border-color: var(--peach); }
.auth-err { font-size: 12px; color: var(--danger); margin-bottom: 8px; min-height: 16px; }

/* ── MAIN LAYOUT ── */
#app { display: none; }
.layout { display: grid; grid-template-columns: 260px 1fr; min-height: calc(100vh - 56px); }

/* ── SIDEBAR ── */
.sidebar {
  background: var(--bg2); border-right: 1px solid var(--border);
  padding: 1rem; display: flex; flex-direction: column; gap: 6px;
  position: sticky; top: 56px; height: calc(100vh - 56px); overflow-y: auto;
}
.sidebar-title { font-size: 11px; font-weight: 800; color: var(--text-muted); text-transform: uppercase; letter-spacing: .5px; padding: 4px 8px; margin-top: 4px; }
.story-select {
  width: 100%; padding: 9px 12px; border-radius: 12px;
  border: 1.5px solid var(--border-hover); background: var(--bg);
  color: var(--text); font-family: 'Nunito', sans-serif; font-size: 12px;
  font-weight: 700; outline: none; cursor: pointer; margin-bottom: 4px;
}
.chapter-item {
  display: flex; align-items: center; gap: 8px;
  padding: 8px 10px; border-radius: 10px; cursor: pointer;
  transition: all .15s; border: 1px solid transparent; font-size: 12px; font-weight: 700;
}
.chapter-item:hover { background: var(--peach-light); border-color: var(--border-hover); }
.chapter-item.active { background: var(--peach-light); border-color: var(--peach-mid); color: var(--peach-dark); }
.chapter-item .ch-num { font-size: 10px; color: var(--text-muted); font-weight: 600; flex-shrink: 0; }
.chapter-item .ch-title { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.ch-status {
  font-size: 9px; font-weight: 800; padding: 2px 6px; border-radius: 8px; flex-shrink: 0;
}
.ch-draft { background: #fff3cd; color: #856404; }
.ch-pub { background: #d1fae5; color: #065f46; }
.new-ch-btn {
  display: flex; align-items: center; gap: 6px;
  padding: 8px 10px; border-radius: 10px; cursor: pointer;
  border: 1.5px dashed var(--border-hover); color: var(--peach);
  font-size: 12px; font-weight: 700; transition: all .15s; background: none; width: 100%; margin-top: 4px;
}
.new-ch-btn:hover { background: var(--peach-light); }
.new-ch-btn svg { width: 13px; height: 13px; stroke: currentColor; fill: none; stroke-width: 2.5; stroke-linecap: round; }

/* ── EDITOR ── */
.editor-area {
  padding: 1.5rem; display: flex; flex-direction: column; gap: 1rem;
  max-width: 800px; margin: 0 auto; width: 100%;
}
.editor-empty {
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  min-height: 60vh; gap: 12px; color: var(--text-muted); text-align: center;
}
.editor-empty svg { width: 48px; height: 48px; stroke: var(--border-hover); fill: none; stroke-width: 1.5; }
.editor-empty h3 { font-size: 16px; font-weight: 800; }
.editor-empty p { font-size: 13px; }

.ch-title-inp {
  width: 100%; font-size: 22px; font-weight: 800; font-family: 'Nunito', sans-serif;
  border: none; outline: none; background: transparent; color: var(--text);
  border-bottom: 2px solid var(--border); padding-bottom: 10px;
  transition: border .15s;
}
.ch-title-inp:focus { border-color: var(--peach); }
.ch-title-inp::placeholder { color: var(--text-muted); font-weight: 600; }

/* toolbar */
.toolbar {
  display: flex; flex-wrap: wrap; gap: 4px; padding: 8px;
  background: var(--bg2); border: 1px solid var(--border); border-radius: 12px;
}
.tb-btn {
  padding: 5px 10px; border-radius: 8px; border: none; background: none;
  cursor: pointer; font-size: 12px; font-weight: 700; color: var(--text-muted);
  transition: all .15s; font-family: 'Nunito', sans-serif;
  display: flex; align-items: center; gap: 4px;
}
.tb-btn:hover { background: var(--peach-light); color: var(--peach-dark); }
.tb-btn svg { width: 13px; height: 13px; stroke: currentColor; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
.tb-sep { width: 1px; background: var(--border); margin: 0 4px; align-self: stretch; }

.content-area {
  min-height: 400px; padding: 1rem 1.2rem;
  border: 1.5px solid var(--border); border-radius: 14px;
  background: var(--card); outline: none;
  font-size: 15px; line-height: 1.9; color: var(--text);
  font-family: 'Nunito', sans-serif; font-weight: 500;
  transition: border .15s;
}
.content-area:focus { border-color: var(--peach); }
.content-area:empty::before { content: attr(data-placeholder); color: var(--text-muted); pointer-events: none; }

/* word count */
.meta-bar {
  display: flex; align-items: center; justify-content: space-between;
  font-size: 11px; color: var(--text-muted); font-weight: 600;
}
.action-bar { display: flex; gap: 8px; }

/* toast */
.toast {
  position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%);
  background: #1a1a1a; color: white; padding: 10px 20px;
  border-radius: 20px; font-size: 13px; font-weight: 700;
  z-index: 999; opacity: 0; transition: opacity .3s; pointer-events: none;
  white-space: nowrap;
}
.toast.show { opacity: 1; }
.toast.ok { background: var(--success); }
.toast.err { background: var(--danger); }

/* loading */
.loading { text-align: center; padding: 2rem; color: var(--text-muted); font-size: 13px; font-weight: 600; }

@media (max-width: 640px) {
  .layout { grid-template-columns: 1fr; }
  .sidebar { position: fixed; left: -280px; top: 56px; width: 260px; height: calc(100vh - 56px); z-index: 50; transition: left .25s; }
  .sidebar.open { left: 0; box-shadow: 4px 0 20px rgba(0,0,0,0.15); }
  .menu-btn { display: flex !important; }
}
.menu-btn { display: none; }
</style>
</head>
<body>

<!-- TOPBAR -->
<nav class="topbar">
  <div style="display:flex;align-items:center;gap:10px">
    <button class="btn btn-ghost menu-btn" id="menuBtn" style="padding:7px 10px" onclick="toggleSidebar()">
      <svg viewBox="0 0 24 24"><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
    </button>
    <a class="logo" href="index.html">Peach Luku</a>
  </div>
  <div class="topbar-right" id="topbar-actions" style="display:none">
    <span id="save-status" style="font-size:11px;color:var(--text-muted);font-weight:600"></span>
    <button class="btn btn-ghost" onclick="saveDraft()">
      <svg viewBox="0 0 24 24"><path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"/><polyline points="17 21 17 13 7 13 7 21"/><polyline points="7 3 7 8 15 8"/></svg>
      Lưu bản thảo
    </button>
    <button class="btn btn-success" onclick="publishChapter()">
      <svg viewBox="0 0 24 24"><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></svg>
      Đăng chương
    </button>
  </div>
</nav>

<!-- AUTH GATE -->
<div id="auth-gate">
  <div class="auth-box">
    <div style="font-size:36px;margin-bottom:8px">🐹</div>
    <h2>Đăng nhập để viết</h2>
    <p>Chỉ admin mới có thể đăng chương truyện</p>
    <div class="auth-err" id="auth-err"></div>
    <input class="inp" type="email" id="email-inp" placeholder="Email" autocomplete="email">
    <input class="inp" type="password" id="pass-inp" placeholder="Mật khẩu" autocomplete="current-password">
    <button class="btn btn-primary" style="width:100%;justify-content:center;margin-top:4px" onclick="doLogin()">
      Đăng nhập
    </button>
  </div>
</div>

<!-- APP -->
<div id="app">
  <div class="layout">
    <!-- SIDEBAR -->
    <aside class="sidebar" id="sidebar">
      <div class="sidebar-title">Chọn truyện</div>
      <select class="story-select" id="story-select" onchange="loadChapters()">
        <option value="">-- Chọn truyện --</option>
      </select>

      <div class="sidebar-title" style="margin-top:8px">Danh sách chương</div>
      <button class="new-ch-btn" onclick="newChapter()">
        <svg viewBox="0 0 24 24"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
        Chương mới
      </button>
      <div id="chapter-list"><div class="loading">Chọn truyện để xem danh sách</div></div>
    </aside>

    <!-- EDITOR -->
    <main>
      <div class="editor-area">
        <!-- Empty state -->
        <div class="editor-empty" id="editor-empty">
          <svg viewBox="0 0 24 24"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/><polyline points="10 9 9 9 8 9"/></svg>
          <h3>Chọn hoặc tạo chương mới</h3>
          <p>Chọn truyện bên trái rồi bắt đầu viết nhé 🐹</p>
        </div>

        <!-- Editor form -->
        <div id="editor-form" style="display:none;flex-direction:column;gap:1rem">
          <input class="ch-title-inp" id="ch-title" placeholder="Tên chương..." maxlength="200">

          <!-- Toolbar -->
          <div class="toolbar">
            <button class="tb-btn" onclick="fmt('bold')" title="In đậm">
              <svg viewBox="0 0 24 24"><path d="M6 4h8a4 4 0 0 1 4 4 4 4 0 0 1-4 4H6z"/><path d="M6 12h9a4 4 0 0 1 4 4 4 4 0 0 1-4 4H6z"/></svg>
              <b style="font-size:12px">B</b>
            </button>
            <button class="tb-btn" onclick="fmt('italic')" title="In nghiêng">
              <i style="font-size:12px;font-style:italic">I</i>
            </button>
            <button class="tb-btn" onclick="fmt('underline')" title="Gạch chân">
              <u style="font-size:12px">U</u>
            </button>
            <div class="tb-sep"></div>
            <button class="tb-btn" onclick="insertHR()" title="Ngăn cách">— Ngăn cách</button>
            <button class="tb-btn" onclick="insertNote()" title="Ghi chú tác giả">
              <svg viewBox="0 0 24 24"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
              Ghi chú
            </button>
            <div class="tb-sep"></div>
            <button class="tb-btn" onclick="clearFormat()" title="Xóa định dạng">
              <svg viewBox="0 0 24 24"><path d="M22 3H7l-4 18h3l1-4h10l1 4h3L22 3z"/><line x1="4" y1="21" x2="20" y2="3"/></svg>
              Xóa định dạng
            </button>
          </div>

          <div class="content-area" id="ch-content" contenteditable="true"
            data-placeholder="Bắt đầu viết chương tại đây... 🐹"></div>

          <div class="meta-bar">
            <span id="word-count">0 từ</span>
            <div class="action-bar">
              <button class="btn btn-ghost" onclick="saveDraft()">
                <svg viewBox="0 0 24 24"><path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"/><polyline points="17 21 17 13 7 13 7 21"/><polyline points="7 3 7 8 15 8"/></svg>
                Lưu bản thảo
              </button>
              <button class="btn btn-success" onclick="publishChapter()">
                <svg viewBox="0 0 24 24"><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></svg>
                Đăng chương
              </button>
            </div>
          </div>
        </div>
      </div>
    </main>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
const SUPABASE_URL = 'https://jnlqzqtavfptkfvnndxq.supabase.co';
const SUPABASE_KEY = 'sb_publishable_ojRrfSwxK_B6-TGSXaYGxQ_DKERN0-f';
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

// ── ADMIN EMAILS (thêm email của bạn vào đây) ──
const ADMIN_EMAILS = ['peachluku@gmail.com'];

let currentChapterId = null;
let autoSaveTimer = null;
let isDirty = false;

// ── AUTH ──
async function init() {
  const { data: { session } } = await sb.auth.getSession();
  if (session && ADMIN_EMAILS.includes(session.user.email)) {
    showApp();
  }
}

async function doLogin() {
  const email = document.getElementById('email-inp').value.trim();
  const pass = document.getElementById('pass-inp').value;
  const errEl = document.getElementById('auth-err');
  errEl.textContent = '';

  if (!email || !pass) { errEl.textContent = 'Vui lòng nhập đầy đủ thông tin'; return; }

  const { data, error } = await sb.auth.signInWithPassword({ email, password: pass });
  if (error) { errEl.textContent = 'Email hoặc mật khẩu không đúng'; return; }

  if (!ADMIN_EMAILS.includes(data.user.email)) {
    await sb.auth.signOut();
    errEl.textContent = 'Tài khoản này không có quyền admin';
    return;
  }
  showApp();
}

function showApp() {
  document.getElementById('auth-gate').style.display = 'none';
  document.getElementById('app').style.display = 'block';
  document.getElementById('topbar-actions').style.display = 'flex';
  loadStories();
}

// ── STORIES ──
async function loadStories() {
  const { data } = await sb.from('stories').select('id, title').order('created_at', { ascending: false });
  if (!data) return;
  const sel = document.getElementById('story-select');
  sel.innerHTML = '<option value="">-- Chọn truyện --</option>';
  data.forEach(s => {
    const opt = document.createElement('option');
    opt.value = s.id; opt.textContent = s.title;
    sel.appendChild(opt);
  });
}

// ── CHAPTERS ──
async function loadChapters() {
  const storyId = document.getElementById('story-select').value;
  const list = document.getElementById('chapter-list');
  if (!storyId) { list.innerHTML = '<div class="loading">Chọn truyện để xem danh sách</div>'; return; }

  list.innerHTML = '<div class="loading">Đang tải...</div>';
  const { data } = await sb.from('chapters').select('id, title, chapter_number, is_published')
    .eq('story_id', storyId).order('chapter_number', { ascending: true });

  if (!data || data.length === 0) {
    list.innerHTML = '<div class="loading" style="font-size:11px">Chưa có chương nào</div>';
    return;
  }

  list.innerHTML = data.map(ch => `
    <div class="chapter-item ${ch.id === currentChapterId ? 'active' : ''}" onclick="openChapter('${ch.id}')">
      <span class="ch-num">Ch.${ch.chapter_number}</span>
      <span class="ch-title">${escH(ch.title || 'Chưa đặt tên')}</span>
      <span class="ch-status ${ch.is_published ? 'ch-pub' : 'ch-draft'}">${ch.is_published ? 'Đã đăng' : 'Thảo'}</span>
    </div>
  `).join('');
}

async function openChapter(id) {
  if (isDirty && !confirm('Bạn có thay đổi chưa lưu. Tiếp tục không?')) return;
  currentChapterId = id;
  const { data } = await sb.from('chapters').select('*').eq('id', id).single();
  if (!data) return;

  document.getElementById('ch-title').value = data.title || '';
  document.getElementById('ch-content').innerHTML = data.content || '';
  showEditor();
  updateWordCount();
  loadChapters();
  closeSidebar();
}

function newChapter() {
  const storyId = document.getElementById('story-select').value;
  if (!storyId) { showToast('Chọn truyện trước nhé!', 'err'); return; }
  if (isDirty && !confirm('Bạn có thay đổi chưa lưu. Tiếp tục không?')) return;
  currentChapterId = null;
  document.getElementById('ch-title').value = '';
  document.getElementById('ch-content').innerHTML = '';
  showEditor();
  document.getElementById('ch-title').focus();
  closeSidebar();
}

// ── SAVE / PUBLISH ──
async function saveDraft() {
  const { data: { session } } = await sb.auth.getSession();
  if (!session) { showToast('Phiên đăng nhập hết hạn, hãy tải lại trang!', 'err'); return; }

  const storyId = document.getElementById('story-select').value;
  if (!storyId) { showToast('Chọn truyện trước nhé!', 'err'); return; }

  const title = document.getElementById('ch-title').value.trim();
  const content = document.getElementById('ch-content').innerHTML;
  setSaveStatus('Đang lưu...');

  if (currentChapterId) {
    const { error } = await sb.from('chapters').update({ title, content, updated_at: new Date().toISOString() }).eq('id', currentChapterId);
    if (error) { console.error('[saveDraft update]', error); showToast('Lưu thất bại: ' + error.message, 'err'); return; }
  } else {
    // lấy số chương tiếp theo
    const { data: existing } = await sb.from('chapters').select('chapter_number').eq('story_id', storyId).order('chapter_number', { ascending: false }).limit(1);
    const nextNum = existing && existing.length > 0 ? existing[0].chapter_number + 1 : 1;

    const { data, error } = await sb.from('chapters').insert({
      story_id: storyId, title, content,
      chapter_number: nextNum, is_published: false,
      user_id: session.user.id
    }).select().single();
    if (error) { console.error('[saveDraft insert]', error); showToast('Lưu thất bại: ' + error.message, 'err'); setSaveStatus(''); return; }
    currentChapterId = data.id;
  }

  isDirty = false;
  setSaveStatus('Đã lưu ✓');
  showToast('Đã lưu bản thảo!', 'ok');
  loadChapters();
  return true;
}

async function publishChapter() {
  if (!confirm('Đăng chương này lên? Độc giả sẽ thấy ngay.')) return;
  const saved = await saveDraft();
  if (!saved || !currentChapterId) return; // dừng nếu lưu thất bại

  const { error } = await sb.from('chapters').update({ is_published: true }).eq('id', currentChapterId);
  if (error) { console.error('[publishChapter]', error); showToast('Đăng thất bại: ' + error.message, 'err'); return; }
  showToast('Đã đăng chương! 🎉', 'ok');
  loadChapters();
}

// ── EDITOR TOOLS ──
function fmt(cmd) { document.execCommand(cmd, false, null); document.getElementById('ch-content').focus(); }
function clearFormat() { document.execCommand('removeFormat', false, null); }
function insertHR() {
  document.getElementById('ch-content').focus();
  document.execCommand('insertHTML', false, '<hr style="border:none;border-top:2px solid #F2A882;margin:1.5rem auto;width:60%"><br>');
}
function insertNote() {
  document.getElementById('ch-content').focus();
  document.execCommand('insertHTML', false, '<div style="background:#FEF0E9;border-left:3px solid #E8835A;padding:10px 14px;border-radius:0 10px 10px 0;margin:12px 0;font-size:13px;color:#9A7A6A"><b>📝 Ghi chú của tác giả:</b> </div><br>');
}

function updateWordCount() {
  const text = document.getElementById('ch-content').innerText || '';
  const words = text.trim() ? text.trim().split(/\s+/).length : 0;
  document.getElementById('word-count').textContent = `${words.toLocaleString()} từ`;
}

document.addEventListener('DOMContentLoaded', () => {
  const content = document.getElementById('ch-content');
  if (content) {
    content.addEventListener('input', () => {
      isDirty = true;
      setSaveStatus('Chưa lưu');
      updateWordCount();
      clearTimeout(autoSaveTimer);
      autoSaveTimer = setTimeout(saveDraft, 10000); // auto-save sau 10 giây
    });
  }
  const titleInp = document.getElementById('ch-title');
  if (titleInp) {
    titleInp.addEventListener('input', () => { isDirty = true; setSaveStatus('Chưa lưu'); });
  }
  // Enter để login
  document.getElementById('pass-inp')?.addEventListener('keydown', e => { if (e.key === 'Enter') doLogin(); });
});

// ── HELPERS ──
function showEditor() {
  document.getElementById('editor-empty').style.display = 'none';
  document.getElementById('editor-form').style.display = 'flex';
}
function setSaveStatus(txt) { document.getElementById('save-status').textContent = txt; }
function showToast(msg, type = '') {
  const t = document.getElementById('toast');
  t.textContent = msg; t.className = `toast ${type} show`;
  setTimeout(() => t.classList.remove('show'), 2500);
}
function escH(s) { return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
function toggleSidebar() { document.getElementById('sidebar').classList.toggle('open'); }
function closeSidebar() { document.getElementById('sidebar').classList.remove('open'); }

init();
</script>
</body>
</html>
